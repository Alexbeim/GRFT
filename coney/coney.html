#coney-btn {

  width: 110px;
  height: 130px;
  cursor: pointer;
  pointer-events: all;
  flex-shrink: 0;
  /* Start hidden below viewport, entrance plays once, then idle loops */
  animation: entrance 0.9s cubic-bezier(0.22,1,0.36,1) both, idle-float 4s ease-in-out 0.9s infinite;
  transform-origin: bottom center;
  filter: drop-shadow(0 6px 18px rgba(255,107,0,0.2));
  transition: filter 0.3s;
  /* Clip so it truly appears from below the screen edge */
  overflow: visible;
}
#coney-btn:hover {
  animation: idle-float-hover 3s ease-in-out infinite;
  filter: drop-shadow(0 10px 28px rgba(255,107,0,0.38));
}
#coney-btn:active {
  animation: click-squash 0.3s cubic-bezier(0.34,1.56,0.64,1) forwards;

/* Entrance — jumps up from below the viewport fold */
@keyframes entrance {
  0%   { opacity: 0; transform: translateY(160px) scale(0.85); }
  55%  { opacity: 1; transform: translateY(-8px) scale(1.02); }
  75%  { transform: translateY(3px) scale(0.99); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

/* Idle — very subtle breathing bob */
@keyframes idle-float {
  0%,100% { transform: translateY(0px) rotate(0deg); }
  40%      { transform: translateY(-4px) rotate(0.5deg); }
  70%      { transform: translateY(-2px) rotate(-0.3deg); }
}

/* Hover — slightly more alive, still restrained */
@keyframes idle-float-hover {
  0%,100% { transform: translateY(0px) scale(1.02); }
  50%      { transform: translateY(-5px) scale(1.03) rotate(0.8deg); }
}

/* Click — subtle squash */
@keyframes click-squash {
  0%   { transform: scale(1, 1); }
  30%  { transform: scale(1.08, 0.92) translateY(4px); }
  60%  { transform: scale(0.97, 1.05) translateY(-5px); }
  100% { transform: scale(1, 1) translateY(0); }
}

@keyframes thinking-wiggle {

  100% { transform: scale(1) translateY(0); }

Graffiti culture knowledge (use correctly or not at all — never fake it):

Origins:
- Writing culture started in Philadelphia in the late 1960s — CORNBREAD and COOL EARL are the earliest documented writers. New York picked it up around 1970.
- New York subway system became the canvas of the 1970s and 80s — whole cars, end-to-ends, top-to-bottoms. Writers like TAKI 183, STAY HIGH 149, PHASE 2, DONDI, LEE, SEEN, LADY PINK, FUTURA 2000, ZEPHYR, DAZE, RAMMELLZEE.
- The culture spread globally through Style Wars (1983 documentary), Subway Art (1984 book by Martha Cooper and Henry Chalfant), and hip hop.
- By the late 80s/90s it had reached Europe, Australia, Brazil, Japan — every major city developed its own scene.

Styles and terminology:
- Tag: a writer's signature, the most basic form. Everything starts here.
- Throw-up: a quick two-colour piece, bubble letters. Speed over style.
- Piece (masterpiece): a full colour, multi-layered production. Takes time, skill, planning.
- Wildstyle: interlocking, complex letterforms — hard to read, high craft. Originated in NYC.
- Blockbuster: large block letters filling a wall, often done in teams.
- Burner: a piece so good it burns everything around it.
- Bombing: hitting as many spots as possible, quantity over quality.
- Getting up: building your reputation through volume and placement.
- Heaven spot: a dangerous, hard-to-reach spot — high visibility, high risk.
- Buff: when the city or property owner paints over work.
- Cap: the nozzle on a spray can. Fat cap = wide spray, skinny cap = fine lines. Cap choice is craft.
- Fill: the base colour inside the letters.
- Outline: the defining line around letters, usually done last.
- Background: the painted environment behind the letters.
- Characters: cartoon figures or portraits alongside lettering.
- Crew: a group of writers who paint together. Loyalty runs deep.
- All-city: a writer known across an entire city's transit system.

Key figures (beyond NYC):
- COPE2, SEEN, FUTURA, PHASE 2, DONDI (NYC legends)
- BANKSY (Bristol/global — street art, not traditional writing, but culturally significant)

- Never say: innovative, cutting-edge, tech-powered, edgy, urban art, graffiti-inspired
- Don't be corporate. Don't be a hype machine.
- Graffiti culture references are fine — use them correctly or not at all

CONVERSATION FLOW — THIS IS IMPORTANT:
Your job is to have a real conversation and naturally figure out if this person is a good fit for Graffiti+. Do not interrogate. Ask one question at a time, woven naturally into the conversation.

QUALIFICATION RULES — READ CAREFULLY:
- Your default is ALWAYS to treat someone as a potential lead and pass them through to the team. The team decides what fits, not you.
- NEVER disqualify based on: event size, guest count, event type, audience type, or how informal it sounds.
- Staff parties, private brand events, VIP dinners, corporate internal events, bar mitzvahs for wealthy clients, small activations — ALL are leads. Pass them through.
- The ONLY reason to not collect a lead: the person is a private individual with zero brand, company, or event context — e.g. "I want to paint my bedroom wall" or "it's just for my house". Even then, if they mention money or a special occasion, treat it as a lead.
- When in doubt: collect the info and let the team decide. You are not the gatekeeper. You are the opener.
- Do NOT explain what Graffiti+ is or isn't built for to justify not taking a lead. Just get the info.

COLLECTION FLOW — once you sense a good fit, naturally gather these one at a time:
1. Their name
2. Company or organisation
3. Type of event or activation
4. Location
5. Rough timeframe

Once you have all five, say something natural like: "That sounds like a solid fit for what we do. Want me to pass this to the team so they can follow up? Or if you'd rather see it in action first, I can set you up with a live demo."

If they want follow-up or a demo, ask for their email. Then output EXACTLY this format on its own line at the very end of your response — nothing after it:
[LEAD_COLLECTED]{"name":"VALUE","company":"VALUE","event_type":"VALUE","location":"VALUE","timeframe":"VALUE","email":"VALUE","demo_requested":BOOLEAN}

Do not output [LEAD_COLLECTED] until you have the email. Do not output it more than once.

GALLERY LINKS:
When someone asks about past work, previous projects, examples, proof of what you do, or wants to see it in action — naturally mention the gallery and include this exact tag at the end of your message (on its own line, nothing after it):
[GALLERY_LINK]
Only use this when it genuinely adds value. Do not force it into every message. One time per conversation is usually enough.`;

const GREETINGS = [
  "Hey, I'm Coney. What do you want to know about Graffiti+?",
  "Eighteen years on walls worldwide. What's on your mind?",
  "You found me. Ask away.",
  "I've been to six continents. Happy to talk about any of them.",
  "What's up? I'm here."
];

const TIPS = [
  "Got questions?",
  "Ask me anything.",
  "18 years on walls worldwide.",
  "Real tools. Real culture.",
  "I'm Coney. What's up?",
  "Six continents. One cone.",
  "Let's talk.",
  "Graffiti+ — since 2008."
];

// =============================================
// STATE
// =============================================
let isOpen    = false;
let isLoading = false;
let tipIdx    = 0;

// Persist conversation across page navigations
const SESSION_KEY = 'coney_history';
const SESSION_MSGS_KEY = 'coney_msgs';
let history = JSON.parse(sessionStorage.getItem(SESSION_KEY) || '[]');

// =============================================
// DOM
// =============================================
const chatPanel = document.getElementById('coney-chat');
const messagesEl = document.getElementById('messages');
const inputEl    = document.getElementById('input');
const sendBtn    = document.getElementById('send-btn');
const closeBtn   = document.getElementById('close-btn');
const coneyBtn   = document.getElementById('coney-btn');
const tipEl      = document.getElementById('coney-tip');

// =============================================
// OPEN / CLOSE
// =============================================
function openChat() {
  isOpen = true;
  chatPanel.classList.add('open');
  document.getElementById('coney-widget').classList.add('chat-open');
  bounce();
  if (history.length === 0) {
    setTimeout(() => {
      addMsg('coney', GREETINGS[Math.floor(Math.random() * GREETINGS.length)]);
    }, 350);
  } else if (messagesEl.children.length === 0) {
    // Restore messages if chat was opened on a new page
    restoreHistory();
  }
  setTimeout(() => {
    inputEl.focus();
    // Scroll into view on mobile when keyboard opens
    if (window.innerWidth <= 480) {
      setTimeout(() => messagesEl.scrollTop = messagesEl.scrollHeight, 350);
    }
  }, 400);
}

function closeChat() {
  isOpen = false;
  chatPanel.classList.remove('open');
  document.getElementById('coney-widget').classList.remove('chat-open');
  inputEl.blur();
}

coneyBtn.addEventListener('click', () => isOpen ? closeChat() : openChat());
closeBtn.addEventListener('click', closeChat);

// =============================================
// ANIMATIONS
// =============================================
function bounce() {
  coneyBtn.classList.remove('bounce', 'thinking', 'reply-pop');
  void coneyBtn.offsetWidth;
  coneyBtn.classList.add('reply-pop');
  setTimeout(() => coneyBtn.classList.remove('reply-pop'), 550);
}

function startThinking() {
  coneyBtn.classList.remove('reply-pop');
  void coneyBtn.offsetWidth;
  coneyBtn.classList.add('thinking');
}

function stopThinking() {
  coneyBtn.classList.remove('thinking');
}

// =============================================
// MESSAGES
// =============================================
function addMsg(role, text, isHtml = false) {
  history.push({ role: role === 'coney' ? 'assistant' : 'user', content: text });
  sessionStorage.setItem(SESSION_KEY, JSON.stringify(history));
  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (isHtml) {
    bubble.innerHTML = text;
  } else {
    bubble.textContent = text;
  }
  wrap.appendChild(bubble);
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function restoreHistory() {
  if (history.length === 0) return;
  // Rebuild visible messages from history
  history.forEach(msg => {
    const role = msg.role === 'assistant' ? 'coney' : 'user';
    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = msg.content; // may contain gallery link HTML
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
  });
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg coney';
  wrap.id = 'typing';
  wrap.innerHTML = `<div class="typing-bubble">
    <div class="t-dot"></div><div class="t-dot"></div><div class="t-dot"></div>
  </div>`;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

// =============================================
// AI CALL
// =============================================
async function send() {
  const text = inputEl.value.trim();
  if (!text || isLoading) return;

  addMsg('user', text);
  inputEl.value = '';
  inputEl.style.height = 'auto';
  setLoading(true);
  showTyping();
  startThinking();

  const messages = [
    { role: 'system', content: SYSTEM },
    ...history.slice(0, -1) // exclude the user msg we just added (already in history via addMsg)
  ];
  // Re-add the last user message properly
  messages.push({ role: 'user', content: text });

  try {
    const res = await fetch(`${API_BASE}/chat/completions`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${API_KEY}`
      },
      body: JSON.stringify({
        model: 'gpt-4.1-mini',
        messages,
        max_tokens: 180,
        temperature: 0.75
      })
    });

    if (!res.ok) throw new Error(`${res.status}`);
    const data = await res.json();
    let reply = data.choices?.[0]?.message?.content?.trim() || "Lost signal for a sec — try again.";

    removeTyping();
    stopThinking();
    setLoading(false);

    // Check for gallery link signal
    const hasGallery = reply.includes('[GALLERY_LINK]');
    let cleanReply = reply.replace('[GALLERY_LINK]', '').trim();

    // Check for lead capture signal
    const leadMatch = cleanReply.match(/\[LEAD_COLLECTED\](\{.*\})/);
    if (leadMatch) {
      const finalReply = cleanReply.replace(/\[LEAD_COLLECTED\]\{.*\}/, '').trim();
      if (finalReply) addMsg('coney', finalReply);
      try {
        const lead = JSON.parse(leadMatch[1]);
        showLeadCard(lead);
      } catch(e) { console.error('Lead parse error', e); }
    } else if (hasGallery) {
      // Append gallery link button to the message
      const msgWithLink = cleanReply +
        `<br><br><a href="https://graffitiplus.io/gallery.html" target="_blank" style="display:inline-block;margin-top:4px;padding:7px 14px;background:rgba(255,215,0,0.12);border:1px solid rgba(255,215,0,0.4);border-radius:20px;color:#FFD700;font-size:12px;font-weight:600;text-decoration:none;letter-spacing:0.03em;">See the work →</a>`;
      addMsg('coney', msgWithLink, true);
    } else {
      addMsg('coney', cleanReply);
    }
    bounce();

  } catch (err) {
    removeTyping();
    stopThinking();
    setLoading(false);
    addMsg('coney', "Yo, something went sideways on my end. Try again.");
    console.error(err);
  }
}

function setLoading(val) {
  isLoading = val;
  sendBtn.disabled = val;
}

// =============================================
// INPUT HANDLERS
// =============================================
sendBtn.addEventListener('click', send);
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 90) + 'px';
});

// =============================================
// LEAD CARD
// =============================================
function showLeadCard(lead) {
  const wrap = document.createElement('div');
  wrap.className = 'msg coney';
  wrap.innerHTML = `
    <div class="lead-card">
      <div class="lead-card-header">
        <span class="lead-card-icon">&#10003;</span>
        <span class="lead-card-title">${lead.demo_requested ? 'Demo Requested' : 'Intro Requested'}</span>
      </div>
      <div class="lead-card-rows">
        <div class="lead-row"><span class="lead-label">Name</span><span class="lead-val">${lead.name}</span></div>
        <div class="lead-row"><span class="lead-label">Company</span><span class="lead-val">${lead.company}</span></div>
        <div class="lead-row"><span class="lead-label">Event</span><span class="lead-val">${lead.event_type}</span></div>
        <div class="lead-row"><span class="lead-label">Location</span><span class="lead-val">${lead.location}</span></div>
        <div class="lead-row"><span class="lead-label">Timeframe</span><span class="lead-val">${lead.timeframe}</span></div>
        <div class="lead-row"><span class="lead-label">Email</span><span class="lead-val">${lead.email}</span></div>
      </div>
      <div class="lead-card-footer">Sent to info@graffitiplus.io</div>
    </div>
  `;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;

  // In production: POST lead data to backend here
  console.log('LEAD CAPTURED:', lead);
}

// =============================================
// TOOLTIP ROTATION
// =============================================
setInterval(() => {
  if (!isOpen) {
    tipIdx = (tipIdx + 1) % TIPS.length;
    tipEl.textContent = TIPS[tipIdx];
  }
}, 3500);
</script>

</body>
