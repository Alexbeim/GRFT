document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"026695de-a1ee-4c7d-9161-90b1cb9ca967\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"178f12cd-4b7e-4b51-9483-2683c4a8f194\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"52403c2e-06ef-4d90-a5f2-2edc31bf2a52\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Graffiti display face — big stat numbers + the occasional tagged word\n   (\"18 · 500+ · 6 · 2008\" on the homepage). The live site uses a custom\n   hand-drawn tag; Permanent Marker is the closest free stand-in.\n   SUBSTITUTION — replace with the licensed face if you have it. */\n/* latin */\n@font-face {\n  font-family: 'Permanent Marker';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"271c3782-75e8-438d-ae5f-4c06e439fa7e\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Graffiti+ colour system.\n   Rule: black ground, photography is the colour, yellow is a single accent — never a flood.\n   Ratio discipline ≈ 70% black ground / 25% ink + photo / 5% yellow. */\n:root {\n  /* — Dark surface (stage / hero / covers) — */\n  --gp-ground:        #0A0B0C; /* primary background on every surface */\n  --gp-ground-alt:    #000D10; /* deepest black, photo overlays */\n  --gp-ink:           #F4F4F2; /* primary type on dark */\n  --gp-ink-dim:       #E0E0DC; /* body / supporting copy on dark */\n  --gp-muted:         #9A9A96; /* secondary copy, second headline line */\n  --gp-mono-grey:     #8A8A86; /* eyebrow + metadata labels */\n  --gp-accent:        #FEBD17; /* signature yellow — rules, numerals, one word */\n  --gp-accent-deep:   #B07A00; /* dark-gold shadow / pressed / yellow text on light */\n  --gp-hairline:      rgba(244, 244, 242, 0.16); /* dividers, grid lines, borders */\n\n  /* — Light surface (long-form web, documents) — */\n  --gp-paper:         #FFFFFF; /* primary light ground */\n  --gp-paper-warm:    #FAF9F6; /* softer light ground, large fields */\n  --gp-ink-on-light:  #0A0B0C; /* headlines + primary type on light */\n  --gp-body:          #33333A; /* body copy on light */\n  --gp-muted-light:   #6B6B70; /* second headline line, secondary copy on light */\n  --gp-hairline-light: rgba(10, 11, 12, 0.12); /* dividers / grid lines on light */\n\n  /* — Photo scrim (directional, lands where copy sits) — */\n  --gp-scrim-strong:  rgba(10, 11, 12, 0.96);\n  --gp-scrim-soft:    rgba(10, 11, 12, 0.90);\n\n  /* — Semantic aliases — */\n  --surface:          var(--gp-ground);\n  --surface-light:    var(--gp-paper);\n  --text:             var(--gp-ink);\n  --text-light:       var(--gp-ink-on-light);\n  --text-muted:       var(--gp-muted);\n  --label:            var(--gp-mono-grey);\n  --accent:           var(--gp-accent);\n  --accent-text-light: var(--gp-accent-deep); /* yellow-toned text on light — never raw accent */\n  --rule:             var(--gp-hairline);\n  --rule-light:       var(--gp-hairline-light);\n}\n\n/* Graffiti+ typography.\n   Grotesk display (Archivo) + mono labels (Space Mono). Mono is for labels ONLY —\n   eyebrows, captions, stat tickers, metadata. Never body or headlines. */\n:root {\n  /* Families */\n  --gp-font-display: \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-body:    \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-mono:    \"Space Mono\", \"Courier New\", ui-monospace, monospace;\n  --gp-font-graffiti: \"Permanent Marker\", \"Comic Sans MS\", cursive; /* big stat numbers / tagged accents */\n\n  /* Weights — the live site sets headlines around bold, not black */\n  --gp-weight-body:    400;\n  --gp-weight-medium:  500;\n  --gp-weight-display: 700;\n  --gp-weight-black:   800;\n\n  /* Display metrics */\n  --gp-display-tracking: -0.01em; /* neutral grotesque needs little negative tracking */\n  --gp-display-leading:  0.92;    /* 0.84–0.98 */\n  --gp-body-leading:     1.5;     /* 1.3–1.5 */\n  --gp-mono-tracking:    0.18em;  /* 0.12–0.22em, UPPERCASE */\n\n  /* Fluid web scale — clamp(min, preferred, max), base 1rem = 16px */\n  --gp-hero:      clamp(3rem, 9vw, 7.5rem);        /* 900 */\n  --gp-title:     clamp(2rem, 5vw, 4rem);          /* 800 */\n  --gp-subhead:   clamp(1.4rem, 2.6vw, 2.25rem);   /* 800 */\n  --gp-body-size: clamp(1rem, 1.2vw, 1.25rem);     /* 400 */\n  --gp-stat:      clamp(2.75rem, 7vw, 6rem);       /* 900 */\n  --gp-eyebrow:   0.875rem;                          /* 0.8125–0.9375rem */\n\n  /* Slide scale (1920×1080, px) — 24px floor */\n  --gp-slide-hero:    185px;  /* 160–210 / 900 */\n  --gp-slide-title:   84px;   /* 72–96 / 800 */\n  --gp-slide-subhead: 38px;   /* 34–44 / 800 */\n  --gp-slide-body:    32px;   /* 28–38 / 400–500 */\n  --gp-slide-stat:    104px;  /* 88–120 / 900 */\n  --gp-slide-eyebrow: 24px;   /* 22–26 */\n}\n\n/* Graffiti+ spacing & layout.\n   Use these steps only. Hairline grids structure cells — borders divide, don't contain. */\n:root {\n  /* Spacing scale (rem) */\n  --gp-space-1:  0.5rem;\n  --gp-space-2:  0.75rem;\n  --gp-space-3:  1rem;\n  --gp-space-4:  1.5rem;\n  --gp-space-5:  2rem;\n  -- label}}<\u002Ftext>\n            <\u002Fsc-if>\n            <sc-if value=\"{{s.isHome}}\" hint-placeholder-val=\"{{false}}\">\n              <circle cx=\"0\" cy=\"0\" r=\"10\" fill=\"#C7402F\"><\u002Fcircle>\n              <circle cx=\"0\" cy=\"0\" r=\"3.2\" fill=\"#ffffff\"><\u002Fcircle>\n              <text x=\"0\" y=\"-14\" text-anchor=\"middle\" font-family=\"ui-monospace, Menlo, monospace\" font-size=\"10\" fill=\"#C7402F\">{{s.label}}<\u002Ftext>\n            <\u002Fsc-if>\n            <sc-if value=\"{{s.isTx}}\" hint-placeholder-val=\"{{false}}\">\n              <rect x=\"-6\" y=\"-6\" width=\"12\" height=\"12\" rx=\"2\" fill=\"#1F8A5B\"><\u002Frect>\n              <text x=\"0\" y=\"-11\" text-anchor=\"middle\" font-family=\"ui-monospace, Menlo, monospace\" font-size=\"9\" fill=\"#1F8A5B\">{{s.label}}<\u002Ftext>\n            <\u002Fsc-if>\n            <sc-if value=\"{{s.isHub}}\" hint-placeholder-val=\"{{false}}\">\n              <rect x=\"-14\" y=\"-9\" width=\"28\" height=\"18\" rx=\"2\" fill=\"#0A0B0C\"><\u002Frect>\n              <line x1=\"-8\" y1=\"6\" x2=\"-8\" y2=\"9\" stroke=\"#FEBD17\" stroke-width=\"1.4\"><\u002Fline>\n              <line x1=\"-2\" y1=\"6\" x2=\"-2\" y2=\"9\" stroke=\"#FEBD17\" stroke-width=\"1.4\"><\u002Fline>\n              <line x1=\"4\" y1=\"6\" x2=\"4\" y2=\"9\" stroke=\"#FEBD17\" stroke-width=\"1.4\"><\u002Fline>\n              <text x=\"0\" y=\"3\" text-anchor=\"middle\" font-family=\"ui-monospace, Menlo, monospace\" font-size=\"8\" letter-spacing=\"1\" fill=\"#ffffff\">HUB<\u002Ftext>\n              <text x=\"0\" y=\"-13\" text-anchor=\"middle\" font-family=\"ui-monospace, Menlo, monospace\" font-size=\"9\" fill=\"#6B6B70\">{{s.label}}<\u002Ftext>\n            <\u002Fsc-if>\n          <\u002Fg>\n        <\u002Fsc-for>\n      <\u002Fsvg>\n\n      <sc-if value=\"{{anyOver}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-top:12px;padding:10px 13px;background:#FBEAE7;border:1px solid #E3B4AC;border-radius:3px\">\n          <span style=\"color:#C7402F;font-size:14px\">⚠<\u002Fspan>\n          <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.02em;color:#C7402F\">{{warnText}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{notCompact}}\" hint-placeholder-val=\"{{true}}\">\n        <div class=\"sd-legend\" style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px 20px;padding:14px 4px 4px\">\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--gp-font-mono);font-size:11px;color:#33333A\"><span style=\"width:12px;height:12px;border-radius:2px;background:#2A6FDB;display:inline-block\"><\u002Fspan>Lighthouse · power only<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--gp-font-mono);font-size:11px;color:#33333A\"><span style=\"width:12px;height:12px;border-radius:50%;background:#C7402F;display:inline-block\"><\u002Fspan>Home tracker<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--gp-font-mono);font-size:11px;color:#33333A\"><span style=\"width:12px;height:12px;border-radius:2px;background:#1F8A5B;display:inline-block\"><\u002Fspan>Transmitter · 1 ft apart<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--gp-font-mono);font-size:11px;color:#33333A\"><span style=\"width:12px;height:12px;border-radius:2px;background:#0A0B0C;display:inline-block\"><\u002Fspan>Hub<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--gp-font-mono);font-size:11px;color:#33333A\"><span style=\"width:12px;height:12px;border-radius:2px;background:#fff;border:1.5px solid #0A0B0C;display:inline-block\"><\u002Fspan>Computer / printer · on cabinet<\u002Fspan>\n          <span style=\"display:inline-flex;align-items:center;gap:8px;font-family:var(--gp-font-mono);font-size:11px;color:#33333A\"><span style=\"width:14px;height:2px;background:#9A9A96;display:inline-block\"><\u002Fspan>Data cable · red if &gt; 5 m<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"margin-top:14px;border-top:1px solid #E6E3DC;padding-top:14px\">\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:10px\">Cable runs · to hub<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 18px\">\n            <sc-for list=\"{{cableRuns}}\" as=\"r\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #F0EEE8\">\n                <span style=\"font-family:var(--gp-font-mono);font-size:11px;color:#33333A\">{{r.label}}<\u002Fspan>\n                <sc-if value=\"{{r.ok}}\" hint-placeholder-val=\"{{true}}\"><span style=\"font-family:var(--gp-font-mono);font-size:11px;color:#0A0B0C\">{{r.len}}<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{r.over}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-family:var(--gp-font-mono);font-size:11px;font-weight:700;color:#C7402F\">{{r.len}} ⚠<\u002Fspan><\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.02em;color:#9A9A96;margin-top:10px;line-height:1.5\">The hub sits next to the computer. Transmitters and the home tracker run to it; when the computer is to the side, the cables route around the screen (down to the floor, across, and up) rather than across the screen face. If the computer is behind the screen they run straight back. Lighthouses need power only — no data run.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:640},&quot;editable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showHeader&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;syncKey&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    unit: \"m\",\n    widthM: 6.0, heightM: 3.4, ratio: \"16:9\", floorM: 1.0,\n    wStr: \"6\", hStr: \"3.4\", fStr: \"1\",\n    lighthouses: 2, homeTracker: true, transmitters: 4, txPos: \"bottom\",\n    lhPos: \"floor\", pcLoc: \"left\", prLoc: \"right\",\n    overrides: {}, drag: null,\n  };\n  M2F = 3.28084;\n  FT = 0.3048;\n  CFG_KEYS = [\"unit\", \"widthM\", \"heightM\", \"ratio\", \"floorM\", \"wStr\", \"hStr\", \"fStr\", \"lighthouses\", \"homeTracker\", \"transmitters\", \"txPos\", \"lhPos\", \"pcLoc\", \"prLoc\", \"overrides\"];\n  urlEvent() {\n    try {\n      const q = new URLSearchParams(location.search).get(\"event\");\n      if (q) return q;\n      const h = (location.hash || \"\").match(/event=([^&]+)/);\n      if (h) return decodeURIComponent(h[1]);\n    } catch (e) {}\n    return null;\n  }\n  resolveKey() {\n    if (this.props.syncKey) return this.props.syncKey;\n    const ev = this.urlEvent();\n    return ev ? \"gp-setup-\" + ev : null;\n  }\n  componentDidMount() {\n    const key = this.resolveKey();\n    this._key = key;\n    if (!key) return;\n    this.loadCfg();\n    if (!(this.props.editable ?? true)) {\n      this._onStorage = (e) => { if (e.key === key) this.loadCfg(); };\n      window.addEventListener(\"storage\", this._onStorage);\n    }\n  }\n  componentWillUnmount() { if (this._onStorage) window.removeEventListener(\"storage\", this._onStorage); }\n  componentDidUpdate() { if (this._key && (this.props.editable ?? true)) this.saveCfg(); }\n  saveCfg() {\n    try { const c = {}; for (const k of this.CFG_KEYS) c[k] = this.state[k]; localStorage.setItem(this._key, JSON.stringify(c)); } catch (e) {}\n  }\n  loadCfg() {\n    try { const raw = localStorage.getItem(this._key); if (!raw) return; const c = JSON.parse(raw); const patch = {}; for (const k of this.CFG_KEYS) if (k in c) patch[k] = c[k]; this.setState(patch); } catch (e) {}\n  }\n  setSvg = (el) => { this.svg = el; };\n  fmt(m) { return this.state.unit === \"m\" ? (m.toFixed(2) + \" m\") : (m * this.M2F).toFixed(1) + \" ft\"; }\n  fmtNum(m, unit) { const v = unit === \"m\" ? m : m * this.M2F; const dec = unit === \"m\" ? 2 : 1; return (+v.toFixed(dec)).toString(); }\n  fromUnit(v) { return this.state.unit === \"m\" ? v : v / this.M2F; }\n  toUnit(m) { return this.state.unit === \"m\" ? m : m * this.M2F; }\n  startDrag(id) { return (e) => { if (!(this.props.editable ?? true)) return; if (e.preventDefault) e.preventDefault(); this.setState({ drag: { id } }); }; }\n  onMove = (e) => {\n    if (!this.state.drag || !this.svg) return;\n    const pt = this.svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;\n    const ctm = this.svg.getScreenCTM(); if (!ctm) return;\n    const p = pt.matrixTransform(ctm.inverse());\n    const id = this.state.drag.id;\n    const x = Math.max(12, Math.min(748, p.x)), y = Math.max(14, Math.min(470, p.y));\n    this.setState((s) => ({ overrides: { ...s.overrides, [id]: { x, y } } }));\n  };\n  endDrag = () => { if (this.state.drag) this.setState({ drag: null }); };\n  onW = (e) => { const t = e.target.value, v = parseFloat(t); this.setState(Object.assign({ wStr: t }, isFinite(v) && v > 0 ? { widthM: this.fromUnit(v) } : {})); };\n  onH = (e) => { const t = e.target.value, v = parseFloat(t); this.setState(Object.assign({ hStr: t }, isFinite(v)  []; const devCenters = {};\n    Object.keys(byLoc).forEach((loc) => {\n      const devs = byLoc[loc];\n      const behind = loc === \"behind\";\n      const w = devs.length > 1 ? 74 : 50;\n      const cabCx = locCabX(loc);\n      const dxOf = (idx) => devs.length > 1 ? cabCx + (idx === 0 ? -18 : 18) : cabCx;\n      devs.forEach((k, idx) => { devCenters[k] = { x: dxOf(idx), y: cabTop - 12, behind }; });\n      stations.push({\n        cabX: +(cabCx - w / 2).toFixed(1), cabY: +cabTop.toFixed(1), cabW: w, cabH,\n        drawerY: +(cabTop + 13).toFixed(1), drawerX1: +(cabCx - w / 2 + 6).toFixed(1), drawerX2: +(cabCx + w / 2 - 6).toFixed(1),\n        op: behind ? 0.45 : 1,\n        devs: devs.map((k, idx) => ({ isPC: k === \"PC\", isPrinter: k === \"PR\", x: +dxOf(idx).toFixed(1), y: +(cabTop - 12).toFixed(1) })),\n      });\n    });\n    const pcC = devCenters[\"PC\"];\n    const pcBehind = st.pcLoc === \"behind\";\n\n    // ---- Hub sits next to the computer ----\n    const hubCabX = locCabX(st.pcLoc);\n    auto[\"HUB0\"] = pcBehind\n      ? { x: cx + 30, y: scrMidY + 6 }\n      : { x: hubCabX + (st.pcLoc === \"left\" ? 22 : -22), y: floorY - cabH - 6 };\n    const pos = (id) => st.overrides[id] || auto[id];\n    const hub = pos(\"HUB0\");\n\n    // ---- Cables (data) + length check ----\n    const THRESH = 5; // metres\n    const pxM = (px) => px / scale;\n    const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);\n    // Route a sensor's cable to the hub. Behind computer → straight. Otherwise route\n    // AROUND the screen: drop to the floor, run along the floor, rise to the hub side.\n    const routeToHub = (p) => {\n      if (pcBehind) return { pts: [p, hub], len: pxM(dist(p, hub)) };\n      const aisleY = floorY + 6;\n      const onLeft = hub.x <= cx;\n      const edgeX = onLeft ? wallLeft - 10 : wallRight + 10;\n      // Sensors below the screen (bottom transmitters) can drop straight to the floor aisle.\n      if (p.y >= wallBottom - 2) {\n        const len = pxM(Math.abs(p.y - aisleY) + Math.abs(p.x - hub.x) + Math.abs(aisleY - hub.y));\n        return { pts: [p, { x: p.x, y: aisleY }, { x: hub.x, y: aisleY }, hub], len };\n      }\n      // Top-mounted sensors (home tracker, top transmitters) route AROUND the screen:\n      // lift above the top edge, out to the nearest side, down the outside, then along the floor.\n      const liftY = Math.min(p.y, wallTop - 10);\n      const pts = [p, { x: p.x, y: liftY }, { x: edgeX, y: liftY }, { x: edgeX, y: aisleY }, { x: hub.x, y: aisleY }, hub];\n      const len = pxM(Math.abs(p.y - liftY) + Math.abs(p.x - edgeX) + Math.abs(liftY - aisleY) + Math.abs(edgeX - hub.x) + Math.abs(aisleY - hub.y));\n      return { pts, len };\n    };\n    const cables = []; const runs = [];\n    const pushCable = (label, pts, len) => { const over = len > THRESH; cables.push({ points: pts.map((p) => p.x.toFixed(1) + \",\" + p.y.toFixed(1)).join(\" \"), stroke: over ? \"#C7402F\" : \"#9A9A96\", width: 1.6 }); runs.push({ label, len, over }); };\n    for (let i = 0; i < nT; i++) { const t = pos(\"T\" + i); const r = routeToHub(t); pushCable(\"T\" + (i + 1) + \" \\u2192 Hub\", r.pts, r.len); }\n    if (st.homeTracker) { const h = pos(\"H0\"); const r = routeToHub(h); pushCable(\"Home \\u2192 Hub\", r.pts, r.len); }\n    const cableRuns = runs.map((r) => ({ label: r.label, len: this.fmt(r.len), over: r.over, ok: !r.over }));\n    const overCount = runs.filter((r) => r.over).length;\n    const anyOver = overCount > 0;\n    const warnText = overCount + (overCount === 1 ? \" run over 5 m\" : \" runs over 5 m\") + \" \\u2014 check routing\";\n\n    const sensors = [];\n    const mk = (id, flags, p, label, op) => sensors.push(Object.assign({ id, isLH: false, isHome: false, isTx: false, isHub: false, x: +p.x.toFixed(1), y: +p.y.toFixed(1), label, op: op == null ? 1 : op, onDown: this.startDrag(id), cursor: editable ? \"grab\" : \"default\" }, flags));\n    for (let i = 0; i < nL; i++) mk(\"L\" + i, { isLH: t
