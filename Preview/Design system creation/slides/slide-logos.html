<!-- @dsCard group="Slides" viewport="1280x720" subtitle="Logo wall — partner marks on the dark band" name="Logo wall slide" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{width:1920px;height:1080px;background:#0A0B0C;color:#F4F4F2;padding:80px 96px;box-sizing:border-box;
       display:flex;flex-direction:column}
  .eyebrow-row{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--gp-hairline);padding-bottom:26px}
  .eb{font-family:var(--gp-font-mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#FEBD17}
  .ebr{font-family:var(--gp-font-mono);font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#8A8A86}
  h1{font-family:var(--gp-font-display);font-weight:700;font-size:84px;line-height:.94;letter-spacing:-0.01em;margin:64px 0 auto}
  .two{color:#9A9A96}
  .wall{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--gp-hairline);border:1px solid var(--gp-hairline)}
  .chip{background:#0A0B0C;display:flex;align-items:center;justify-content:center;min-height:150px;
    font-family:var(--gp-font-mono);font-size:30px;letter-spacing:.1em;color:#9A9A96}
</style></head>
<body>
  <div class="eyebrow-row"><span class="eb">· Partners</span><span class="ebr">Graffiti+ / Partners</span></div>
  <h1>Trusted by<br><span class="two">world-class brands.</span></h1>
  <div class="wall">
    <span class="chip">NIKE</span><span class="chip">ADIDAS</span><span class="chip">JORDAN</span><span class="chip">PORSCHE</span>
    <span class="chip">SAMSUNG</span><span class="chip">GOOGLE</span><span class="chip">DISNEY</span><span class="chip">CHANEL</span>
  </div>
</body></html>
