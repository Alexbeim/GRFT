<!-- @dsCard group="Type" viewport="700x200" subtitle="Space Mono · UPPERCASE · wide tracking · labels only" name="Mono labels" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#FFFFFF;padding:30px 40px;color:#0A0B0C;display:flex;flex-direction:column;gap:18px}
  .eyebrow{font-family:var(--gp-font-mono);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:#B07A00;
           display:inline-flex;align-items:center;gap:.6em}
  .dot{width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block}
  .row{display:flex;justify-content:space-between;border-top:1px solid var(--gp-hairline-light);padding-top:12px;
       font-family:var(--gp-font-mono);font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:#6B6B70}
  .meta{font-family:var(--gp-font-mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#6B6B70}
  .note{font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A86}
</style></head>
<body>
  <div class="eyebrow"><span class="dot"></span>The original</div>
  <div class="row"><span>Featured</span><span>On now</span></div>
  <div class="meta">Kyongsub Do · Experience Designer, Cheil</div>
  <div class="note">Eyebrows · captions · stat labels · metadata — never body or headlines</div>
</body></html>
