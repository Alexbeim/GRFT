<!-- @dsCard group="Colors" viewport="700x150" subtitle="Web ≈ 60% light · 40% dark · yellow accent" name="Light/dark balance" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#FFFFFF;padding:22px;font-family:var(--gp-font-mono);font-size:12px;letter-spacing:.06em;color:#0A0B0C}
  .bar{display:flex;height:54px;width:100%;overflow:hidden;border:1px solid var(--gp-hairline-light)}
  .bar > div{display:flex;align-items:flex-end;padding:8px 10px;text-transform:uppercase;font-size:10px}
  .legend{display:flex;gap:22px;margin-top:14px;color:#6B6B70;text-transform:uppercase}
  .dot{display:inline-block;width:10px;height:10px;margin-right:7px;vertical-align:middle}
</style></head>
<body>
  <div class="bar">
    <div style="flex:60;background:#FFFFFF;color:#0A0B0C">60 · paper + photography</div>
    <div style="flex:35;background:#0A0B0C;color:#F4F4F2">35 · dark (nav · hero · footer)</div>
    <div style="flex:5;background:#FEBD17;color:#0A0B0C">5</div>
  </div>
  <div class="legend">
    <span><span class="dot" style="background:#FFFFFF;border:1px solid var(--gp-hairline-light)"></span>light reading surface</span>
    <span><span class="dot" style="background:#0A0B0C"></span>dark punctuation</span>
    <span><span class="dot" style="background:#FEBD17"></span>yellow accent</span>
  </div>
</body></html>
