<!-- @dsCard group="Colors" viewport="700x180" subtitle="Near-black grounds + ink scale on dark" name="Dark surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--gp-hairline);
        font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.06em}
  .sw{padding:18px 14px;min-height:108px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;color:var(--gp-ink)}
  .name{text-transform:uppercase;color:var(--gp-mono-grey)}
  .hex{color:var(--gp-ink)}
</style></head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#0A0B0C"><span class="name">Ground</span><span class="hex">#0A0B0C</span></div>
    <div class="sw" style="background:#000D10"><span class="name">Ground alt</span><span class="hex">#000D10</span></div>
    <div class="sw" style="background:#0A0B0C"><span class="name" style="color:#F4F4F2">Ink</span><span class="hex">#F4F4F2</span></div>
    <div class="sw" style="background:#0A0B0C"><span class="name" style="color:#9A9A96">Muted</span><span class="hex" style="color:#9A9A96">#9A9A96</span></div>
    <div class="sw" style="background:#0A0B0C"><span class="name" style="color:#8A8A86">Mono grey</span><span class="hex" style="color:#8A8A86">#8A8A86</span></div>
  </div>
</body></html>
