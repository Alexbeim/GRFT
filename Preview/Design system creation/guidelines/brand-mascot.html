<!-- @dsCard group="Brand" viewport="700x240" subtitle="Cone mascot — corner, on the baseline, one per surface" name="Cone mascot" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#0A0B0C;color:#F4F4F2;position:relative;height:240px;overflow:hidden;
       font-family:var(--gp-font-display)}
  .pad{padding:30px 40px}
  h1{font-weight:700;font-size:40px;letter-spacing:-0.01em;line-height:.96;margin:0;max-width:60%}
  .two{color:#9A9A96}
  .foot{position:absolute;left:40px;bottom:18px;font-family:var(--gp-font-mono);font-size:11px;
        letter-spacing:.18em;text-transform:uppercase;color:#8A8A86}
  /* placeholder cone — real asset is assets/cone-mascot.png (608×812, transparent) */
  .cone{position:absolute;right:40px;bottom:0;height:218px;width:auto;
        filter:drop-shadow(0 14px 30px rgba(0,0,0,0.55))}
</style></head>
<body>
  <div class="pad"><h1>The original.<br><span class="two">Built on the street.</span></h1></div>
  <img class="cone" src="../assets/cone-mascot.png" alt="GRFT+ cone mascot">
  <div class="foot">GRFT+ · feet on the baseline · bottom corner · one per surface</div>
</body></html>
