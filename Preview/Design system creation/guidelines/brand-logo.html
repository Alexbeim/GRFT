<!-- @dsCard group="Brand" viewport="700x220" subtitle="GRFT+ bubble wordmark — white on dark, ink on light" name="Logo" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{margin:0;display:grid;grid-template-columns:1fr 1fr}
  .cell{display:flex;align-items:center;justify-content:center;min-height:220px;padding:30px}
  .dark{background:#0A0B0C}
  .light{background:#FFFFFF;border-left:1px solid var(--gp-hairline-light)}
  .dark img{height:96px;filter:brightness(0) invert(1)}
  .light img{height:96px}
</style></head>
<body>
  <div class="cell dark"><img src="../assets/logo-grft.png" alt="GRFT+ on dark"></div>
  <div class="cell light"><img src="../assets/logo-grft.png" alt="GRFT+ on light"></div>
</body></html>
