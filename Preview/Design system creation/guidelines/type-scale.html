<!-- @dsCard group="Type" viewport="700x320" subtitle="Display, body, mono — plus the graffiti number face" name="Type scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#FFFFFF;padding:24px 40px;color:#0A0B0C;font-family:var(--gp-font-display)}
  .row{display:flex;align-items:baseline;gap:20px;border-top:1px solid var(--gp-hairline-light);padding:11px 0}
  .row:first-child{border-top:none}
  .lbl{font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
       color:#8A8A86;width:140px;flex:none}
  .px{font-family:var(--gp-font-mono);font-size:11px;color:#B07A00;width:96px;flex:none;text-align:right}
  .spec{font-weight:700;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden}
</style></head>
<body>
  <div class="row"><span class="lbl">Hero display</span><span class="spec" style="font-size:40px">F1 Las Vegas</span><span class="px">clamp→7.5rem</span></div>
  <div class="row"><span class="lbl">Section title</span><span class="spec" style="font-size:30px;font-weight:700">Two decades in</span><span class="px">2–4rem</span></div>
  <div class="row"><span class="lbl">Body</span><span class="spec" style="font-size:18px;font-weight:400">From load-in to last tag</span><span class="px">1–1.25rem</span></div>
  <div class="row"><span class="lbl">Graffiti stat</span><span class="spec" style="font-family:var(--gp-font-graffiti);font-weight:400;font-size:40px;letter-spacing:0">500+</span><span class="px">tag face</span></div>
  <div class="row"><span class="lbl">Eyebrow / mono</span><span class="spec" style="font-family:var(--gp-font-mono);font-size:14px;font-weight:400;letter-spacing:.18em">FEATURED</span><span class="px">0.8125rem</span></div>
</body></html>
