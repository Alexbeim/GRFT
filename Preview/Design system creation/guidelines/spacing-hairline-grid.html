<!-- @dsCard group="Spacing" viewport="700x200" subtitle="1px rules divide cells on paper — borders don't box" name="Hairline grid" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#FFFFFF;padding:30px 40px;color:#0A0B0C}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);background:#FFFFFF}
  .cell{padding:8px 22px 8px 0;display:flex;flex-direction:column;gap:10px;min-height:74px;justify-content:flex-end;
        border-right:1px solid var(--gp-hairline-light)}
  .cell:last-child{border-right:none;padding-left:22px}
  .cell:nth-child(2){padding-left:22px}
  .fig{font-family:var(--gp-font-graffiti);font-size:56px;line-height:1}
  .unit{font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6B6B70}
</style></head>
<body>
  <div class="grid">
    <div class="cell"><span class="fig">18</span><span class="unit">Years of deployment</span></div>
    <div class="cell"><span class="fig">500+</span><span class="unit">Global activations</span></div>
    <div class="cell"><span class="fig">6</span><span class="unit">Continents</span></div>
  </div>
</body></html>
