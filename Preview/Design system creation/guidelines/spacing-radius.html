<!-- @dsCard group="Spacing" viewport="700x150" subtitle="No rounded cards — 0px radius, 2px on buttons" name="Radius" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#0A0B0C;padding:30px 40px;display:flex;gap:30px;align-items:center;
       font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A86}
  .item{display:flex;flex-direction:column;gap:12px;align-items:center}
  .box{width:120px;height:60px;background:#FEBD17}
  .btn{background:#FEBD17;color:#0A0B0C;border-radius:2px;padding:14px 22px;font-weight:700;
       font-family:var(--gp-font-mono);font-size:13px;letter-spacing:.08em;text-transform:none}
</style></head>
<body>
  <div class="item"><div class="box" style="border-radius:0"></div><span>Surfaces · 0px</span></div>
  <div class="item"><div class="btn">Book a demo</div><span>Buttons · 2px</span></div>
</body></html>
