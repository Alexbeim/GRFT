<!-- @dsCard group="Components" viewport="700x150" subtitle="Primary fill · secondary outline · link + arrow" name="Button" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:#0A0B0C;padding:34px 40px;display:flex;gap:22px;align-items:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:.5rem;font-family:var(--gp-font-mono);font-size:13px;
       font-weight:700;letter-spacing:.06em;line-height:1;padding:14px 22px;border:1px solid transparent;
       border-radius:2px;cursor:pointer;text-decoration:none}
  .primary{background:#FEBD17;color:#0A0B0C}
  .secondary{background:transparent;color:#F4F4F2;border-color:#F4F4F2}
  .link{background:transparent;color:#F4F4F2;padding:4px 0}
  .disabled{opacity:.45}
</style></head>
<body>
  <span class="btn primary">Book a demo</span>
  <span class="btn secondary">Our story</span>
  <span class="btn link">View project&nbsp;→</span>
  <span class="btn primary disabled">Book a demo</span>
</body></html>
