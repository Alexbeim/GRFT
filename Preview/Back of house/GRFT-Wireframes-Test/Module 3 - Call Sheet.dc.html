  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"763582dc-58dc-43b7-b0af-82832690c779\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"cf856529-a753-47ac-ad2d-a2fafaa01fdc\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"fde8b389-7450-44e9-b53d-3a8c5e318b65\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Graffiti display face — big stat numbers + the occasional tagged word\n   (\"18 · 500+ · 6 · 2008\" on the homepage). The live site uses a custom\n   hand-drawn tag; Permanent Marker is the closest free stand-in.\n   SUBSTITUTION — replace with the licensed face if you have it. */\n/* latin */\n@font-face {\n  font-family: 'Permanent Marker';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"fa5fa2b8-537e-4d64-b7bf-97f8a2a1b0ac\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Graffiti+ colour system.\n   Rule: black ground, photography is the colour, yellow is a single accent — never a flood.\n   Ratio discipline ≈ 70% black ground / 25% ink + photo / 5% yellow. */\n:root {\n  /* — Dark surface (stage / hero / covers) — */\n  --gp-ground:        #0A0B0C; /* primary background on every surface */\n  --gp-ground-alt:    #000D10; /* deepest black, photo overlays */\n  --gp-ink:           #F4F4F2; /* primary type on dark */\n  --gp-ink-dim:       #E0E0DC; /* body / supporting copy on dark */\n  --gp-muted:         #9A9A96; /* secondary copy, second headline line */\n  --gp-mono-grey:     #8A8A86; /* eyebrow + metadata labels */\n  --gp-accent:        #FEBD17; /* signature yellow — rules, numerals, one word */\n  --gp-accent-deep:   #B07A00; /* dark-gold shadow / pressed / yellow text on light */\n  --gp-hairline:      rgba(244, 244, 242, 0.16); /* dividers, grid lines, borders */\n\n  /* — Light surface (long-form web, documents) — */\n  --gp-paper:         #FFFFFF; /* primary light ground */\n  --gp-paper-warm:    #FAF9F6; /* softer light ground, large fields */\n  --gp-ink-on-light:  #0A0B0C; /* headlines + primary type on light */\n  --gp-body:          #33333A; /* body copy on light */\n  --gp-muted-light:   #6B6B70; /* second headline line, secondary copy on light */\n  --gp-hairline-light: rgba(10, 11, 12, 0.12); /* dividers / grid lines on light */\n\n  /* — Photo scrim (directional, lands where copy sits) — */\n  --gp-scrim-strong:  rgba(10, 11, 12, 0.96);\n  --gp-scrim-soft:    rgba(10, 11, 12, 0.90);\n\n  /* — Semantic aliases — */\n  --surface:          var(--gp-ground);\n  --surface-light:    var(--gp-paper);\n  --text:             var(--gp-ink);\n  --text-light:       var(--gp-ink-on-light);\n  --text-muted:       var(--gp-muted);\n  --label:            var(--gp-mono-grey);\n  --accent:           var(--gp-accent);\n  --accent-text-light: var(--gp-accent-deep); /* yellow-toned text on light — never raw accent */\n  --rule:             var(--gp-hairline);\n  --rule-light:       var(--gp-hairline-light);\n}\n\n/* Graffiti+ typography.\n   Grotesk display (Archivo) + mono labels (Space Mono). Mono is for labels ONLY —\n   eyebrows, captions, stat tickers, metadata. Never body or headlines. */\n:root {\n  /* Families */\n  --gp-font-display: \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-body:    \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-mono:    \"Space Mono\", \"Courier New\", ui-monospace, monospace;\n  --gp-font-graffiti: \"Permanent Marker\", \"Comic Sans MS\", cursive; /* big stat numbers / tagged accents */\n\n  /* Weights — the live site sets headlines around bold, not black */\n  --gp-weight-body:    400;\n  --gp-weight-medium:  500;\n  --gp-weight-display: 700;\n  --gp-weight-black:   800;\n\n  /* Display metrics */\n  --gp-display-tracking: -0.01em; /* neutral grotesque needs little negative tracking */\n  --gp-display-leading:  0.92;    /* 0.84–0.98 */\n  --gp-body-leading:     1.5;     /* 1.3–1.5 */\n  --gp-mono-tracking:    0.18em;  /* 0.12–0.22em, UPPERCASE */\n\n  /* Fluid web scale — clamp(min, preferred, max), base 1rem = 16px */\n  --gp-hero:      clamp(3rem, 9vw, 7.5rem);        /* 900 */\n  --gp-title:     clamp(2rem, 5vw, 4rem);          /* 800 */\n  --gp-subhead:   clamp(1.4rem, 2.6vw, 2.25rem);   /* 800 */\n  --gp-body-size: clamp(1rem, 1.2vw, 1.25rem);     /* 400 */\n  --gp-stat:      clamp(2.75rem, 7vw, 6rem);       /* 900 */\n  --gp-eyebrow:   0.875rem;                          /* 0.8125–0.9375rem */\n\n  /* Slide scale (1920×1080, px) — 24px floor */\n  --gp-slide-hero:    185px;  /* 160–210 / 900 */\n  --gp-slide-title:   84px;   /* 72–96 / 800 */\n  --gp-slide-subhead: 38px;   /* 34–44 / 800 */\n  --gp-slide-body:    32px;   /* 28–38 / 400–500 */\n  --gp-slide-stat:    104px;  /* 88–120 / 900 */\n  --gp-slide-eyebrow: 24px;   /* 22–26 */\n}\n\n/* Graffiti+ spacing & layout.\n   Use these steps only. Hairline grids structure cells — borders divide, don't contain. */\n:root {\n  /* Spacing scale (rem) */\n  --gp-space-1:  0.5rem;\n  --gp-space-2:  0.75rem;\n  --gp-space-3:  1rem;\n  --gp-space-4:  1.5rem;\n  --gp-space-5:  2rem;\n  --gp-space-6:  3rem;\n  --gp-space-7:  4rem;\n  --gp-space-8:  6rem;\n  --gp-space-9:  8rem;\n\n  /* Section rhythm + measure */\n  --gp-section-pad:  clamp(4rem, 10vw, 9rem); /* vertical section padding */\n  --gp-content-max:  1240px;                  /* max content width */\n  --gp-gutter:       clamp(1.25rem, 5vw, 4rem);\n  --gp-measure:      70ch;                     /* body line length */\n\n  /* Slide canvas */\n  --gp-slide-w: 1920px;\n  --gp-slide-h: 1080px;\n  --gp-slide-pad: 80px 96px;\n\n  /* Radius — none / minimal. No rounded accent cards. */\n  --gp-radius: 0px;\n  --gp-radius-btn: 2px;\n\n  /* Border / hairline weight */\n  --gp-hairline-w: 1px;\n\n  /* Motion */\n  --gp-ease: cubic-bezier(0.2, 0.0, 0.0, 1.0);\n  --gp-dur-fast: 160ms;\n  --gp-dur: 200ms;\n  --gp-dur-reveal: 400ms;\n}\n\n<\u002Fstyle>\n  <style>\n    *{box-sizing:border-box}\n    body{margin:0;background:#e7e5df}\n    .print-sheet{display:none}\n    @media print{\n      @page{margin:14mm}\n      html,body{background:#fff !important}\n      .gp-screen{display:none !important}\n      .print-sheet{display:block !important}\n    }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#e7e5df;padding:48px;font-family:var(--gp-font-body)\">\n\n  <div class=\"gp-screen\" style=\"max-width:900px;margin:0 auto 30px\">\n    <div style=\"display:flex;margin-bottom:18px\">\n      <a href=\"Prototype Hub.dc.html\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2px;text-decoration:none;display:inline-flex;align-items:center;gap:8px;background:#fff;color:#6B6B70;border:1px solid var(--gp-hairline-light)\" style-hover=\"border-color:#0A0B0C;color:#0A0B0C\"><span style=\"font-size:13px\">←<\u002Fspan>All modules<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-family:var(--gp-font-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#B07A00;display:flex;align-items:center;gap:.6 font-size:11px;font-weight:700\">{{st.n}}<\u002Fspan>\n                            <span style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.45;color:#33333A\">{{st.text}}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{m.escalate}}\" hint-placeholder-val=\"{{false}}\">\n                      <div onclick=\"{{goReport}}\" style=\"margin-top:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FAF9F6;border:1px solid var(--gp-hairline-light);border-radius:4px;padding:11px 13px;cursor:pointer\" style-hover=\"border-color:#c2bfb6\">\n                        <span style=\"font-family:var(--gp-font-body);font-size:13px;color:#33333A\">Still stuck? Escalate this.<\u002Fspan>\n                        <span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#B07A00;font-weight:700;white-space:nowrap\">Report an issue →<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{m.isUser}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"display:flex;justify-content:flex-end\">\n                  <div style=\"max-width:80%;background:#0A0B0C;color:#F4F4F2;border-radius:12px 4px 12px 12px;padding:11px 14px;font-family:var(--gp-font-body);font-size:14px;line-height:1.45\">{{m.text}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-for>\n\n            <div style=\"margin-top:4px\">\n              <div style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#9A9A96;margin-bottom:9px\">Common problems<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{quickProblems}}\" as=\"q\" hint-placeholder-count=\"5\">\n                  <span onclick=\"{{q.ask}}\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.02em;padding:9px 13px;border-radius:16px;background:#fff;border:1px solid var(--gp-hairline-light);color:#1B1B1F;cursor:pointer\" style-hover=\"border-color:#FEBD17;background:#FEF8E6\">{{q.label}}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position:sticky;bottom:0;margin-top:auto;background:#0A0B0C\">\n            <div style=\"padding:11px 12px;display:flex;gap:9px;align-items:center;border-top:1px solid rgba(244,244,242,0.14)\">\n              <div onclick=\"{{sendDummy}}\" style=\"flex:1;background:#16181b;border:1px solid rgba(244,244,242,0.14);border-radius:18px;padding:11px 15px;font-family:var(--gp-font-body);font-size:13px;color:#6B6B70;cursor:pointer\">Describe the problem…<\u002Fdiv>\n              <span onclick=\"{{sendDummy}}\" style=\"width:38px;height:38px;border-radius:50%;background:#FEBD17;color:#0A0B0C;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;cursor:pointer\">↑<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid rgba(244,244,242,0.14);display:flex\">\n              <div onclick=\"{{goCall}}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 20px;cursor:pointer\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7A7A78\" stroke-width=\"1.6\"><rect x=\"5\" y=\"4.5\" width=\"14\" height=\"16\" rx=\"2\"><\u002Frect><rect x=\"9\" y=\"3\" width=\"6\" height=\"3.2\" rx=\"1\" fill=\"#7A7A78\" stroke=\"none\"><\u002Frect><path d=\"M8.5 11h7M8.5 15h4.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7A7A78\">Call sheet<\u002Fspan>\n              <\u002Fdiv>\n              <div onclick=\"{{goKb}}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 20px;cursor:pointer\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7A7A78\" stroke-width=\"1.6\"><path d=\"M12 6.2C10 4.9 7.5 4.7 5 5.2v12c2.5-.5 5-.3 7 1 2-1.3 4.5-1.5 7-1v-12c-2.5-.5-5-.3-7 1z\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M12 6.2V18\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7A7A78\">Knowledge<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 20px;cursor:pointer\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FEBD17\" stroke-width=\"1.6\"><path d=\"M5 6h14v9H10l-4 3.5V15H5z\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#FEBD17;font-weight:700\">Coney<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"position:absolute;bottom:96px;left:50%;transform:translateX(-50%);z-index:50;background:#0A0B0C;color:#F4F4F2;border-radius:4px;padding:11px 18px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,0.32);white-space:nowrap\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block;flex:none\"><\u002Fspan>\n          <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.04em;color:#F4F4F2\">{{toast}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fx-import>\n  <\u002Fdiv>\n\n  <!-- ============ PRINTABLE PDF (print only) ============ -->\n  <div class=\"print-sheet\">\n    <div style=\"max-width:720px;margin:0 auto;font-family:var(--gp-font-body);color:#0A0B0C\">\n      <div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #0A0B0C;padding-bottom:14px;margin-bottom:20px\">\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#6B6B70;margin-bottom:7px\">GRFT+ · Call sheet<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-display);font-weight:700;font-size:28px;letter-spacing:-0.01em\">Brewery Launch Party<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-mono);font-size:12px;color:#6B6B70;margin-top:5px\">Sat · Jun 14, 2026 · Stanley Park Pavilion, 610 Pipeline Rd, Vancouver BC<\u002Fdiv>\n        <\u002Fdiv>\n        <img src=\"4e39d1b7-1b65-4134-b744-b515e73c4d0b\" alt=\"GRFT+\" style=\"height:24px\">\n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:22px 36px\">\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">Your call time<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-display);font-weight:700;font-size:22px\">2:00 PM · Load-in (Pavilion dock)<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-mono);font-size:12px;color:#33333A;margin-top:4px\">Lead technician · M. Okafor<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">License key<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-mono);font-size:14px\">GRFT4-9X2K-7QPL-A1V8<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">Schedule<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.9\">2:00 PM · Load-in &amp; build<br>6:30 PM · Wall live · paint open<br>11:30 PM · Wrap &amp; load-out<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">System &amp; gear<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.7\">GRFT+ Wall v4 · 4K (3840×2160)<br>Cases A &amp; B · 12 cans · 2 × 20A<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">Team<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.7\">M. Okafor · Lead technician<br>A. Reyes · Technician<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">Client contact<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.7\">Dana Whitfield · Brand lead<br>+1 (604) 555-0192<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">Travel<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.7\">AC 123 · YYZ→YVR · 9:10 AM<br>Sylvia Hotel · check-in 1 PM<\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">Venue<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.7\">Stanley Park Pavilion<br>610 Pipeline Rd, Vancouver BC<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"grid-column:1 / -1\">\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">Tech notes<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.55\">Wall v4 on hardline; 4G backup in Case B lid. Pair all 12 cans before doors — dock #3 is slow, allow extra time. Run the 12-point pre-event check.<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"grid-column:1 / -1\">\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;border-bottom:1px solid #d8d5cd;padding-bottom:6px;margin-bottom:8px\">Logistics notes<\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.55\">Load-in via the north service door. Parking pass at front desk. All-black dress. Crew meal at 5 PM.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: \"callsheet\",\n    issueType: \"equipment\",\n    urgent: false,\n    toast: null,\n    kbFilter: \"all\",\n    chat: null,\n    inventoryDone: false,\n    invChecked: {},\n  };\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: null }), 1900);\n  }\n  // ---- Coney troubleshooting knowledge ----\n  problemBank() {\n    return [\n      {\n        key: \"power\",\n        label: \"Wall won't power on\",\n        reply: \"Let's get the wall live. Most no-power calls are a circuit or sequence issue.\",\n        steps: [\n          \"Confirm both legs are on a dedicated 20A circuit — share nothing else on it.\",\n          \"Check the breaker at the compute case (it trips on inrush). Reset and hold 3s.\",\n          \"Power up in order: mains → compute unit → panels. Wait for the green hub LED before the panels.\",\n        ],\n        escalate: true,\n      },\n      {\n        key: \"cans\",\n        label: \"Spray cans not pairing\",\n        reply: \"Pairing drops are almost always charge or dock-handshake. Try this:\",\n        steps: [\n          \"Re-dock the can fully for 5s — listen for the double chirp.\",\n          \"Check the charge ring: below 15% it won't hold a pairing.\",\n          \"If two+ cans are stuck, power-cycle the pairing hub (hold the side button 6s).\",\n        ],\n        escalate: true,\n      },\n      {\n        key: \"network\",\n        label: \"Network drops mid-event\",\n        reply: \"Mid-event drops usually mean RF congestion at a busy venue.\",\n        steps: [\n          \"Switch the compute unit to the wired uplink if a drop is available.\",\n          \"Move the router off the floor and away from LED walls / large metal.\",\n          \"In the wall app, set the band to 5GHz-only to dodge crowded 2.4GHz.\",\n        ],\n        escalate: true,\n      },\n      {\n        key: \"latency\",\n        label: \"Paint lag / latency\",\n        reply: \"Lag is a load issue — the wall is rendering more than the compute can keep up with.\",\n        steps: [\n          \"Cap active cans at 8 for a single 4K wall.\",\n          \"Lower the brush particle density one notch in the wall app.\",\n          \"Restart the wall app between sessions to clear the render buffer.\",\n        ],\n        escalate: true,\n      },\n      {\n        key: \"panel\",\n        label: \"Dead panel / artifacts\",\n        reply: \"A dark block or flicker is nearly always a seated-cable fault.\",\n        steps: [\n          \"Reseat the ribbon cable on the back of the affected panel.\",\n          \"Swap in a spare panel from Case E if it persists.\",\n          \"Flag the panel ID so it's pulled from the next kit.\",\n        ],\n        escalate: true,\n      },\n    ];\n  }\n  send(p) {\n    const userMsg = { from: \"user\", text: p.label };\n    const coneyMsg = { from: \"coney\", text: p.reply, steps: p.steps || [], escalate: !!p.escalate };\n    this.setState((s) => ({ chat: [...(s.chat || this.intro()), userMsg, coneyMsg] }));\n  }\n  intro() {\n    return [{ from: \"coney\", text: \"Hey, I'm Coney — your on-site troubleshooting buddy. Pick a problem below or describe what the wall's doing.\", steps: [], escalate: false }];\n  }\n  resetChat() { this.setState({ chat: this.intro() }); }\n  renderVals() {\n    const typeDefs = [\"Technical\", \"Logistics\", \"Client\", \"Equipment\", \"Feedback\"];\n    const issueTypes = typeDefs.map((label) => ({\n      label,\n      active: this.state.issueType === label.toLowerCase(),\n      notActive: this.state.issueType !== label.toLowerCase(),\n      pick: () => this.setState({ issueType: label.toLowerCase() }),\n    }));\n\n    // ---- Knowledge base ----\n    const articles = [\n      { cat: \"install\", catLabel: \"Install\", title: \"Rigging the wall frame\", summary: \"Frame assembly order, torque spec, and the two-person lift for a 4K wall.\" },\n      { cat: \"install\", catLabel: \"Install\", title: \"Power & circuit requirements\", summary: \"Two dedicated 20A legs, no shared loads. Inrush, breakers, and the power-up sequence.\" },\n      { cat: \"install\", catLabel: \"Install\", title: \"Connecting the compute unit\", summary: \"Cabling from compute case to the panel chain and the green-LED handshake.\" },\n      { cat: \"install\", catLabel: \"Install\", title: \"Pairing the spray cans\", summary: \"Docking handshake, charge thresholds, and bringing a full set of 12 online.\" },\n      { cat: \"trouble\", catLabel: \"Troubleshoot\", title: \"Wall won't power on\", summary: \"Circuit, breaker, and sequence checks — the three causes behind most no-power calls.\" },\n      { cat: \"trouble\", catLabel: \"Troubleshoot\", title: \"Spray cans not pairing\", summary: \"Re-dock, charge ring, and a hub power-cycle when multiple cans drop.\" },\n      { cat: \"trouble\", catLabel: \"Troubleshoot\", title: \"Network drops mid-event\", summary: \"Wired uplink, router placement, and forcing 5GHz in crowded venues.\" },\n      { cat: \"trouble\", catLabel: \"Troubleshoot\", title: \"Paint lag / latency\", summary: \"Cap active cans, lower particle density, restart the app to clear the buffer.\" },\n      { cat: \"best\", catLabel: \"Best practice\", title: \"Pre-event load-in checklist\", summary: \"The 12-point check to run before doors so nothing surfaces live.\" },\n      { cat: \"best\", catLabel: \"Best practice\", title: \"Spray-can battery rotation\", summary: \"Rotate cans through the dock in thirds to keep a full set always charged.\" },\n      { cat: \"best\", catLabel: \"Best practice\", title: \"Wall placement & crowd flow\", summary: \"Sightlines, throw distance, and keeping a clear paint lane in busy rooms.\" },\n      { cat: \"best\", catLabel: \"Best practice\", title: \"Lighting for best visibility\", summary: \"Keep direct light off the wall face; aim for even, indirect ambient levels.\" },\n    ];\n    const filt = this.state.kbFilter;\n    const catColors = { install: \"#2A6FDB\", trouble: \"#C7402F\", best: \"#1F8A5B\" };\n    const kbArticles = articles\n      .filter((a) => filt === \"all\" || a.cat === filt)\n      .map((a) => ({ ...a, catColor: catColors[a.cat], open: () => this.flash(\"Opens “\" + a.title + \"” (demo)\") }));\n    const kbFilters = [\n      { key: \"all\", label: \"All\" },\n      { key: \"install\", label: \"Installation\" },\n      { key: \"trouble\", label: \"Troubleshooting\" },\n      { key: \"best\", label: \"Best practices\" },\n    ].map((f) => ({ label: f.label, active: filt === f.key, notActive: filt !== f.key, go: () => this.setState({ kbFilter: f.key }) }));\n\n    // ---- Coney chat ----\n    const chat = (this.state.chat || this.intro()).map((m, i) => ({\n      isConey: m.from === \"coney\",\n      isUser: m.from === \"user\",\n      text: m.text,\n      steps: (m.steps || []).map((s, j) => ({ n: j + 1, text: s })),\n      hasSteps: (m.steps || []).length > 0,\n      escalate: !!m.escalate,\n    }));\n    const quickProblems = this.problemBank().map((p) => ({ label: p.label, ask: () => this.send(p) }));\n\n    // ---- Case inventory ----\n    const invDefs = [\n      { label: \"Case A · Wall\", items: [\n        { key: \"a0\", label: \"Frame rails\", qty: \"×4\" },\n        { key: \"a1\", label: \"Panel set\", qty: \"×24\" },\n        { key: \"a2\", label: \"Ribbon cables\", qty: \"×6\" },\n        { key: \"a3\", label: \"Mounting feet\", qty: \"×2\" },\n      ] },\n      { label: \"Case B · Compute\", items: [\n        { key: \"b0\", label: \"Compute unit\", qty: \"×1\" },\n        { key: \"b1\", label: \"Power supply\", qty: \"×2\" },\n        { key: \"b2\", label: \"Pairing hub\", qty: \"×1\" },\n        { key: \"b3\", label: \"Network kit + 4G backup\", qty: \"×1\" },\n      ] },\n      { label: \"Spray cans\", items: [\n        { key: \"c0\", label: \"Spray cans\", qty: \"×12\" },\n        { key: \"c1\", label: \"Charge dock\", qty: \"×1\" },\n        { key: \"c2\", label: \"Charger bricks\", qty: \"×2\" },\n        { key: \"c3\", label: \"Spare can\", qty: \"×1\" },\n      ] },\n    ];\n    const allKeys = invDefs.flatMap((g) => g.items.map((i) => i.key));\n    const checkedCount = allKeys.filter((k) => this.state.invChecked[k]).length;\n    const totalCount = allKeys.length;\n    const toggleItem = (k) => this.setState((s) => ({ invChecked: { ...s.invChecked, [k]: !s.invChecked[k] } }));\n    const invGroups = invDefs.map((g) => ({\n      label: g.label,\n      count: g.items.filter((i) => this.state.invChecked[i.key]).length + \"/\" + g.items.length,\n      items: g.items.map((i) => ({ label: i.label, qty: i.qty, checked: !!this.state.invChecked[i.key], notChecked: !this.state.invChecked[i.key], toggle: () => toggleItem(i.key) })),\n    }));\n\n    const screen = this.state.screen;\n    return {\n      isCall: screen === \"callsheet\",\n      isUpload: screen === \"upload\",\n      isReport: screen === \"report\",\n      isKb: screen === \"knowledge\",\n      isConey: screen === \"coney\",\n      isInventory: screen === \"inventory\",\n      tabCall: screen === \"callsheet\", tabCallOff: screen !== \"callsheet\",\n      tabKb: screen === \"knowledge\", tabKbOff: screen !== \"knowledge\",\n      tabConey: screen === \"coney\", tabConeyOff: screen !== \"coney\",\n      goUpload: () => this.setState({ screen: \"upload\" }),\n      goReport: () => this.setState({ screen: \"report\" }),\n      goCall: () => this.setState({ screen: \"callsheet\" }),\n      goKb: () => this.setState({ screen: \"knowledge\" }),\n      goConey: () => this.setState({ screen: \"coney\" }),\n      goInventory: () => this.setState({ screen: \"inventory\" }),\n      invGroups, invPct: Math.round((checkedCount / totalCount) * 100) + \"%\", invPackedLabel: checkedCount + \"/\" + totalCount,\n      shortcuts: [\n        { action: \"Play / pause the wall\", keys: \"Space\" },\n        { action: \"Clear the canvas\", keys: \"Shift + C\" },\n        { action: \"Next / previous scene\", keys: \"→ / ←\" },\n        { action: \"Toggle logo overlay\", keys: \"L\" },\n        { action: \"Save a snapshot\", keys: \"S\" },\n        { action: \"Reset session\", keys: \"Ctrl + R\" },\n        { action: \"Fullscreen / exit\", keys: \"F / Esc\" },\n      ],\n      inventoryDone: this.state.inventoryDone, invNotDone: !this.state.inventoryDone,\n      toggleInvDone: () => this.setState((s) => ({ inventoryDone: !s.inventoryDone })),\n      markPacked: () => { const all = {}; allKeys.forEach((k) => (all[k] = true)); this.setState({ invChecked: all, inventoryDone: true, screen: \"callsheet\" }); this.flash(\"Inventory marked packed (demo)\"); },\n      downloadPdf: () => { try { window.print(); } catch (e) { this.flash(\"Print dialog blocked\"); } },\n      text: () => this.flash(\"Texting (demo)\"),\n      copyKey: () => this.flash(\"License key copied (demo)\"),\n      issueTypes,\n      urgent: this.state.urgent,\n      notUrgent: !this.state.urgent,\n      toggleUrgent: () => this.setState((s) => ({ urgent: !s.urgent })),\n      toast: this.state.toast,\n      hasToast: !!this.state.toast,\n      openMaps: () => this.flash(\"Opening Maps (demo)\"),\n      call: () => this.flash(\"Calling (demo)\"),\n      pickCamera: () => this.flash(\"Camera (demo)\"),\n      pickLibrary: () => this.flash(\"Photo library (demo)\"),\n      addPhoto: () => this.flash(\"Attach photo (demo)\"),\n      kbArticles, kbFilters,\n      kbSearch: () => this.flash(\"Search the knowledge base (demo)\"),\n      noResults: kbArticles.length === 0,\n      chat, quickProblems,\n      resetChat: () => this.resetChat(),\n      sendDummy: () => this.flash(\"Type to Coney (demo) — pick a problem below\"),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
