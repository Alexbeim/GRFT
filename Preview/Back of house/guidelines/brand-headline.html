<!-- @dsCard group="Brand" viewport="700x230" subtitle="Sentence case · Archivo black · ink on paper · mono eyebrow" name="Headline grammar" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#FFFFFF;padding:32px 40px;color:#0A0B0C}
  .eyebrow{font-family:var(--gp-font-mono);font-size:13px;letter-spacing:.2em;text-transform:uppercase;
           color:#B07A00;margin-bottom:18px;display:inline-flex;align-items:center;gap:.6em}
  .dot{width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block}
  h1{font-family:var(--gp-font-display);font-weight:700;font-size:44px;line-height:1.04;
     letter-spacing:-0.01em;margin:0;text-wrap:balance}
  .vp{font-family:var(--gp-font-mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;
      color:#0A0B0C;display:inline-flex;align-items:center;gap:9px;margin-top:22px;padding-bottom:10px;
      border-bottom:2px solid #FEBD17}
  .vp .arr{color:#B07A00}
</style></head>
<body>
  <div class="eyebrow"><span class="dot"></span>The original</div>
  <h1>Two decades in, and still perfecting it — and we're still pushing.</h1>
  <span class="vp">View project <span class="arr">→</span></span>
</body></html>
