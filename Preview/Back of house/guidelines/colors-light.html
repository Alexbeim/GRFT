<!-- @dsCard group="Colors" viewport="700x180" subtitle="Paper grounds + ink scale on light" name="Light surface" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--gp-hairline-light);
        font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.06em}
  .sw{padding:18px 14px;min-height:108px;display:flex;flex-direction:column;justify-content:flex-end;gap:6px}
  .name{text-transform:uppercase;color:var(--gp-muted-light)}
</style></head>
<body>
  <div class="wrap">
    <div class="sw" style="background:#FFFFFF"><span class="name">Paper</span><span style="color:#0A0B0C">#FFFFFF</span></div>
    <div class="sw" style="background:#FAF9F6"><span class="name">Paper warm</span><span style="color:#0A0B0C">#FAF9F6</span></div>
    <div class="sw" style="background:#FFFFFF"><span class="name">Ink</span><span style="color:#0A0B0C">#0A0B0C</span></div>
    <div class="sw" style="background:#FFFFFF"><span class="name">Body</span><span style="color:#33333A">#33333A</span></div>
    <div class="sw" style="background:#FFFFFF"><span class="name">Muted</span><span style="color:#6B6B70">#6B6B70</span></div>
  </div>
</body></html>
