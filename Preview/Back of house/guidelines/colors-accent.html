<!-- @dsCard group="Colors" viewport="700x200" subtitle="Yellow is a note — text-safe on dark, fill-only on light" name="Accent — yellow discipline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--gp-hairline);
        font-family:var(--gp-font-mono);font-size:12px;letter-spacing:.04em}
  .cell{padding:20px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between}
  .dark{background:#0A0B0C;color:#F4F4F2}
  .light{background:#FFFFFF;color:#0A0B0C}
  .chip{display:inline-block;width:44px;height:44px}
  .row{display:flex;gap:12px;align-items:center}
  .ok{color:#FEBD17}.bad{text-decoration:line-through;opacity:.5}
  .lbl{text-transform:uppercase;color:var(--gp-mono-grey)}
</style></head>
<body>
  <div class="wrap">
    <div class="cell dark">
      <div class="row"><span class="chip" style="background:#FEBD17"></span><span class="chip" style="background:#B07A00"></span></div>
      <div>
        <div class="lbl">On dark · 13:1</div>
        <div style="font-family:var(--gp-font-display);font-weight:700;font-size:26px;margin-top:6px">Stays <span class="ok">forever.</span></div>
      </div>
      <div>Accent #FEBD17 · Accent deep #B07A00</div>
    </div>
    <div class="cell light">
      <div class="row"><span class="chip" style="background:#FEBD17"></span><span class="chip" style="background:#B07A00"></span></div>
      <div>
        <div class="lbl">On light · fill / underline only</div>
        <div style="font-family:var(--gp-font-display);font-weight:700;font-size:26px;margin-top:6px">Stays <span style="background:#FEBD17;padding:0 4px">forever.</span> <span style="color:#B07A00">link →</span></div>
      </div>
      <div><span class="bad">#FEBD17 text on white</span> → use #B07A00</div>
    </div>
  </div>
</body></html>
