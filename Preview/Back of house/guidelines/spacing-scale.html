<!-- @dsCard group="Spacing" viewport="700x170" subtitle="rem steps — 0.5 · 0.75 · 1 · 1.5 · 2 · 3 · 4 · 6 · 8" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#0A0B0C;padding:28px 40px;color:#F4F4F2;display:flex;align-items:flex-end;gap:16px;
       font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.08em;color:#8A8A86}
  .step{display:flex;flex-direction:column;align-items:center;gap:8px}
  .bar{background:#FEBD17;width:18px}
  .v{text-transform:uppercase}
</style></head>
<body>
  <div class="step"><div class="bar" style="height:8px"></div><span class="v">.5</span></div>
  <div class="step"><div class="bar" style="height:12px"></div><span class="v">.75</span></div>
  <div class="step"><div class="bar" style="height:16px"></div><span class="v">1</span></div>
  <div class="step"><div class="bar" style="height:24px"></div><span class="v">1.5</span></div>
  <div class="step"><div class="bar" style="height:32px"></div><span class="v">2</span></div>
  <div class="step"><div class="bar" style="height:48px"></div><span class="v">3</span></div>
  <div class="step"><div class="bar" style="height:64px"></div><span class="v">4</span></div>
  <div class="step"><div class="bar" style="height:80px"></div><span class="v">6</span></div>
  <div class="step"><div class="bar" style="height:96px"></div><span class="v">8</span></div>
</body></html>
