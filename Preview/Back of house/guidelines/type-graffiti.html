<!-- @dsCard group="Type" viewport="700x180" subtitle="Hand-drawn tag face for big numbers — Permanent Marker stand-in" name="Graffiti numbers" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{background:#FFFFFF;padding:26px 40px;color:#0A0B0C;display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--gp-hairline-light)}
  .cell{background:#FFFFFF;display:flex;flex-direction:column;gap:14px;padding:14px 0}
  .num{font-family:var(--gp-font-graffiti);font-size:64px;line-height:1}
  .unit{font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6B6B70}
</style></head>
<body>
  <div class="cell"><span class="num">18</span><span class="unit">Years</span></div>
  <div class="cell"><span class="num">500+</span><span class="unit">Activations</span></div>
  <div class="cell"><span class="num">6</span><span class="unit">Continents</span></div>
  <div class="cell"><span class="num">2008</span><span class="unit">Vancouver, BC</span></div>
</body></html>
