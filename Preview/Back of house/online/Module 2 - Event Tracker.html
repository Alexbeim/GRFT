"width:24px;height:24px;border-radius:50%;background:#16744B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px\">✓<\u002Fspan><span style=\"flex:1;font-family:var(--gp-font-body);font-size:15px;color:#0A0B0C\">Stencils, stickers &amp; backgrounds<\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:11px;color:#9A9A96\">8 assets<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px;border-top:1px solid var(--gp-hairline-light);border-bottom:1px solid var(--gp-hairline-light);padding:16px 0;margin-bottom:24px\"><span style=\"width:24px;height:24px;border-radius:50%;background:#16744B;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px\">✓<\u002Fspan><span style=\"flex:1;font-family:var(--gp-font-body);font-size:15px;color:#0A0B0C\">Wall overlay<\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:11px;color:#9A9A96\">Bottom-right<\u002Fspan><\u002Fdiv>\n            <div onclick=\"{{approveLock}}\" style=\"display:inline-flex;align-items:center;gap:10px;background:#FEBD17;color:#0A0B0C;border-radius:2px;padding:15px 26px;font-family:var(--gp-font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer\">Approve &amp; lock assets →<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- AI assistant -->\n    <div style=\"position:absolute;right:24px;bottom:74px;display:flex;align-items:flex-end;gap:10px;z-index:5\">\n      <img src=\"8764f0d9-68bf-494f-a336-935bca8a45d2\" alt=\"Coney, AI assistant\" style=\"height:92px;width:auto;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.20))\">\n      <div onclick=\"{{askConey}}\" style=\"margin-bottom:12px;background:#0A0B0C;border-radius:20px;padding:9px 16px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,0.18)\">\n        <span style=\"width:6px;height:6px;border-radius:50%;background:#FEBD17;display:inline-block\"><\u002Fspan>\n        <span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#F4F4F2\">Ask Coney<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- toast -->\n    <sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n      <div style=\"position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:50;background:#0A0B0C;color:#F4F4F2;border-radius:4px;padding:12px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.28)\">\n        <span style=\"width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block;flex:none\"><\u002Fspan>\n        <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.06em;color:#F4F4F2\">{{toast}}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <!-- footer -->\n    <div style=\"height:62px;flex:none;border-top:1px solid var(--gp-hairline-light);display:flex;align-items:center;justify-content:space-between;padding:0 24px\">\n      <span onclick=\"{{back}}\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#6B6B70;cursor:pointer\">← Back<\u002Fspan>\n      <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96\">Step {{stepLabel}} / 08<\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:10px\">\n        <sc-if value=\"{{curDone}}\" hint-placeholder-val=\"{{false}}\"><span onclick=\"{{toggleComplete}}\" style=\"border:1px solid #16744B;color:#16744B;border-radius:2px;padding:11px 18px;font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer\">✓ Completed<\u002Fspan><\u002Fsc-if>\n        <sc-if value=\"{{curNotDone}}\" hint-placeholder-val=\"{{true}}\"><span onclick=\"{{toggleComplete}}\" style=\"border:1px solid #0A0B0C;color:#0A0B0C;border-radius:2px;padding:11px 18px;font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer\">Mark complete<\u002Fspan><\u002Fsc-if>\n        <span onclick=\"{{next}}\" style=\"background:#FEBD17;color:#0A0B0C;border-radius:2px;padding:12px 22px;font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer\">Continue →<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    step: 1,\n    completed: (() => { try { return JSON.parse(localStorage.getItem(\"gp-m1-completed\") || \"[]\"); } catch (e) { return []; } })(),\n    assetTab: \"stencils\",\n    assetSource: \"premade\",\n    assetSel: { stencils: [0, 3], stickers: [], backgrounds: [] },\n    canSize: \"regular\",\n    artSource: \"uploads\",\n    artTile: 0,\n    canColor: 1,\n    gradientOn: true,\n    locked: [0, 1],\n    toast: null,\n  };\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: null }), 1900);\n  }\n  renderVals() {\n    const cur = this.state.step;\n    const defs = [\n      { n: \"01\", label: \"Welcome\" },\n      { n: \"02\", label: \"Logo upload\" },\n      { n: \"03\", label: \"Color management\" },\n      { n: \"04\", label: \"Spray can label\" },\n      { n: \"05\", label: \"Asset builder\" },\n      { n: \"06\", label: \"Wall overlay\" },\n      { n: \"07\", label: \"Test area\" },\n      { n: \"08\", label: \"Approve & lock\" },\n    ];\n    const steps = defs.map((d, i) => {\n      const idx = i + 1;\n      return {\n        n: d.n,\n        label: d.label,\n        active: idx === cur,\n        notActive: idx !== cur,\n        done: this.state.completed.includes(idx),\n        todo: !this.state.completed.includes(idx),\n        go: () => this.setState({ step: idx }),\n      };\n    });\n    const completed = this.state.completed;\n    const welcomeDefs = [\n      { idx: 2, n: \"02\", label: \"Logo upload\", desc: \"Drop your logos, we check them\" },\n      { idx: 3, n: \"03\", label: \"Colors\", desc: \"Your exact brand palette\" },\n      { idx: 4, n: \"04\", label: \"Spray can label\", desc: \"Design the cans guests paint with\" },\n      { idx: 5, n: \"05\", label: \"Stencils, stickers & backgrounds\", desc: \"Pick, upload, or generate\" },\n      { idx: 6, n: \"06\", label: \"Wall overlay\", desc: \"Your logo on the live 4K wall\" },\n      { idx: 7, n: \"07\", label: \"Test drive\", desc: \"Try it all before launch\" },\n      { idx: 8, n: \"08\", label: \"Approve & lock\", desc: \"Freeze it and you're set\" },\n    ];\n    const welcomeItems = welcomeDefs.map((w) => ({ n: w.n, label: w.label, desc: w.desc, done: completed.includes(w.idx), todo: !completed.includes(w.idx), go: () => this.setState({ step: w.idx }) }));\n    const curDone = completed.includes(cur);\n    const toggleComplete = () => this.setState((s) => {\n      const set = s.completed.includes(cur) ? s.completed.filter((x) => x !== cur) : [...s.completed, cur];\n      try { localStorage.setItem(\"gp-m1-completed\", JSON.stringify(set)); } catch (e) {}\n      return { completed: set };\n    });\n    // ---- Asset builder (step 5) ----\n    const assetTab = this.state.assetTab;\n    const assetSource = this.state.assetSource;\n    const tabDefs = [\n      { key: \"stencils\", label: \"Stencils\", count: 10 },\n      { key: \"stickers\", label: \"Stickers\", count: 8 },\n      { key: \"backgrounds\", label: \"Backgrounds\", count: 6 },\n    ];\n    const assetTabs = tabDefs.map((t) => ({\n      label: t.label,\n      active: assetTab === t.key,\n      notActive: assetTab !== t.key,\n      go: () => this.setState({ assetTab: t.key }),\n    }));\n    const sourceDefs = [\n      { key: \"premade\", label: \"Premade\" },\n      { key: \"upload\", label: \"Upload new\" },\n      { key: \"ai\", label: \"Make with AI\" },\n    ];\n    const assetSources = sourceDefs.map((s) => ({\n      label: s.label,\n      active: assetSource === s.key,\n      notActive: assetSource !== s.key,\n      go: () => this.setState({ assetSource: s.key }),\n    }));\n    const curCount = (tabDefs.find((t) => t.key === assetTab) || {}).count || 10;\n    const selectedNow = this.state.assetSel[assetTab] || [];\n    const toggleTile = (i) => this.setState((s) => {\n      const arr = s.assetSel[assetTab] || [];\n      const next = arr.includes(i) ? arr.filter((x) => x !== i) : [...arr, i];\n      return { assetSel: { ...s.assetSel, [assetTab]: next } };\n    });\n    const assetTiles = Array.from({ length: curCount }, (_, i) => ({\n      selected: selectedNow.includes(i),\n      notSelected: !selectedNow.includes(i),\n      toggle: () => toggleTile(i),\n    }));\n    const assetSelCount = selectedNow.length;\n\n    // ---- Spray can label (step 4) ----\n    const seg = (cur, opts, key) => opts.map((o) => ({\n      label: o.label,\n      active: cur === o.key,\n      notActive: cur !== o.key,\n      go: () => this.setState({ [key]: o.key }),\n    }));\n    const canSizes = seg(this.state.canSize, [{ key: \"regular\", label: \"Regular\" }, { key: \"kids\", label: \"Kids\" }], \"canSize\");\n    const artSources = seg(this.state.artSource, [{ key: \"uploads\", label: \"From uploads\" }, { key: \"upload\", label: \"Upload new\" }, { key: \"fullwrap\", label: \"Full wrap\" }], \"artSource\");\n    const canPalette = [\"#0A0B0C\", \"#FEBD17\", \"#C7402F\", \"#2A6FDB\", \"#1F8A5B\"].map((hex, i) => ({\n      hex, selected: this.state.canColor === i, notSelected: this.state.canColor !== i, pick: () => this.setState({ canColor: i }),\n    }));\n    const artThumbs = [0, 1].map((i) => ({ selected: this.state.artTile === i, notSelected: this.state.artTile !== i, pick: () => this.setState({ artTile: i }) }));\n    const gradientOn = this.state.gradientOn;\n    const toggleGradient = () => this.setState((s) => ({ gradientOn: !s.gradientOn }));\n\n    // ---- Color palette locks (step 3) ----\n    const colorDefs = [\n      { hex: \"#0A0B0C\", name: \"Brand Black\" },\n      { hex: \"#FEBD17\", name: \"Signal Yellow\" },\n      { hex: \"#C7402F\", name: \"Brick Red\" },\n      { hex: \"#2A6FDB\", name: \"Cobalt\" },\n      { hex: \"#1F8A5B\", name: \"Pine\" },\n    ];\n    const palette = colorDefs.map((c, i) => ({\n      hex: c.hex, name: c.name,\n      locked: this.state.locked.includes(i),\n      unlocked: !this.state.locked.includes(i),\n      toggleLock: () => this.setState((s) => ({ locked: s.locked.includes(i) ? s.locked.filter((x) => x !== i) : [...s.locked, i] })),\n      remove: () => this.flash(\"Removed \" + c.name + \" (demo)\"),\n    }));\n\n    return {\n      steps,\n      welcomeItems,\n      assetTabs, assetSources, assetTiles, assetSelCount,\n      canSizes, artSources, canPalette, artThumbs, gradientOn, gradientOff: !gradientOn, toggleGradient,\n      palette,\n      toast: this.state.toast,\n      hasToast: !!this.state.toast,\n      saveExit: () => this.flash(\"Progress saved (demo)\"),\n      askConey: () => this.flash(\"Coney is a demo — no chat yet\"),\n      approveLock: () => this.flash(\"Assets approved & locked (demo)\"),\n      browseFiles: () => this.flash(\"File picker is a demo\"),\n      is1: cur === 1, is2: cur === 2, is3: cur === 3, is4: cur === 4,\n      is5: cur === 5, is6: cur === 6, is7: cur === 7, is8: cur === 8,\n      stepLabel: (\"0\" + cur).slice(-2),\n      pct: Math.round((completed.length / 8) * 100) + \"%\",\n      curDone: curDone, curNotDone: !curDone, toggleComplete: toggleComplete,\n      next: () => this.setState((s) => ({ step: Math.min(8, s.step + 1) })),\n      back: () => this.setState((s) => ({ step: Math.max(1, s.step - 1) })),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>","wireframes/Module 3 - Call Sheet.dc":"<!DOCTYPE html>\n<html><head>\n<meta ch n  --gp-ground:        #0A0B0C; /* primary background on every surface */\n  --gp-ground-alt:    #000D10; /* deepest black, photo overlays */\n  --gp-ink:           #F4F4F2; /* primary type on dark */\n  --gp-ink-dim:       #E0E0DC; /* body / supporting copy on dark */\n  --gp-muted:         #9A9A96; /* secondary copy, second headline line */\n  --gp-mono-grey:     #8A8A86; /* eyebrow + metadata labels */\n  --gp-accent:        #FEBD17; /* signature yellow — rules, numerals, one word */\n  --gp-accent-deep:   #B07A00; /* dark-gold shadow / pressed / yellow text on light */\n  --gp-hairline:      rgba(244, 244, 242, 0.16); /* dividers, grid lines, borders */\n\n  /* — Light surface (long-form web, documents) — */\n  --gp-paper:         #FFFFFF; /* primary light ground */\n  --gp-paper-warm:    #FAF9F6; /* softer light ground, large fields */\n  --gp-ink-on-light:  #0A0B0C; /* headlines + primary type on light */\n  --gp-body:          #33333A; /* body copy on light */\n  --gp-muted-light:   #6B6B70; /* second headline line, secondary copy on light */\n  --gp-hairline-light: rgba(10, 11, 12, 0.12); /* dividers / grid lines on light */\n\n  /* — Photo scrim (directional, lands where copy sits) — */\n  --gp-scrim-strong:  rgba(10, 11, 12, 0.96);\n  --gp-scrim-soft:    rgba(10, 11, 12, 0.90);\n\n  /* — Semantic aliases — */\n  --surface:          var(--gp-ground);\n  --surface-light:    var(--gp-paper);\n  --text:             var(--gp-ink);\n  --text-light:       var(--gp-ink-on-light);\n  --text-muted:       var(--gp-muted);\n  --label:            var(--gp-mono-grey);\n  --accent:           var(--gp-accent);\n  --accent-text-light: var(--gp-accent-deep); /* yellow-toned text on light — never raw accent */\n  --rule:             var(--gp-hairline);\n  --rule-light:       var(--gp-hairline-light);\n}\n\n/* Graffiti+ typography.\n   Grotesk display (Archivo) + mono labels (Space Mono). Mono is for labels ONLY —\n   eyebrows, captions, stat tickers, metadata. Never body or headlines. */\n:root {\n  /* Families */\n  --gp-font-display: \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-body:    \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-mono:    \"Space Mono\", \"Courier New\", ui-monospace, monospace;\n  --gp-font-graffiti: \"Permanent Marker\", \"Comic Sans MS\", cursive; /* big stat numbers / tagged accents */\n\n  /* Weights — the live site sets headlines around bold, not black */\n  --gp-weight-body:    400;\n  --gp-weight-medium:  500;\n  --gp-weight-display: 700;\n  --gp-weight-black:   800;\n\n  /* Display metrics */\n  --gp-display-tracking: -0.01em; /* neutral grotesque needs little negative tracking */\n  --gp-display-leading:  0.92;    /* 0.84–0.98 */\n  --gp-body-leading:     1.5;     /* 1.3–1.5 */\n  --gp-mono-tracking:    0.18em;  /* 0.12–0.22em, UPPERCASE */\n\n  /* Fluid web scale — clamp(min, preferred, max), base 1rem = 16px */\n  --gp-hero:      clamp(3rem, 9vw, 7.5rem);        /* 900 */\n  --gp-title:     clamp(2rem, 5vw, 4rem);          /* 800 */\n  --gp-subhead:   clamp(1.4rem, 2.6vw, 2.25rem);   /* 800 */\n  --gp-body-size: clamp(1rem, 1.2vw, 1.25rem);     /* 400 */\n  --gp-stat:      clamp(2.75rem, 7vw, 6rem);       /* 900 */\n  --gp-eyebrow:   0.875rem;                          /* 0.8125–0.9375rem */\n\n  /* Slide scale (1920×1080, px) — 24px floor */\n  --gp-slide-hero:    185px;  /* 160–210 / 900 */\n  --gp-slide-title:   84px;   /* 72–96 / 800 */\n  --gp-slide-subhead: 38px;   /* 34–44 / 800 */\n  --gp-slide-body:    32px;   /* 28–38 / 400–500 */\n  --gp-slide-stat:    104px;  /* 88–120 / 900 */\n  --gp-slide-eyebrow: 24px;   /* 22–26 */\n}\n\n/* Graffiti+ spacing & layout.\n   Use these steps only. Hairline grids structure cells — borders divide, don't contain. */\n:root {\n  /* Spacing scale (rem) */\n  --gp-space-1:  0.5rem;\n  --gp-space-2:  0.75rem;\n  --gp-space-3:  1rem;\n  --gp-space-4:  1.5rem;\n  --gp-space-5:  2rem;\n  --gp-space-6:  3rem;\n  --gp-space-7:  4rem;\n  --gp-space-8:  6rem;\n  --gp-space-9:  8rem;\n\n  /* Section rhythm + measure */\n  --gp-section-pad:  clamp(4rem, 10vw, 9rem); /* vertical section padding */\n  --gp-content-max:  1240px;                  /* max content width */\n  --gp-gutter:       clamp(1.25rem, 5vw, 4rem);\n  --gp-measure:      70ch;                     /* body line length */\n\n  /* Slide canvas */\n  --gp-slide-w: 1920px;\n  --gp-slide-h: 1080px;\n  --gp-slide-pad: 80px 96px;\n\n  /* Radius — none / minimal. No rounded accent cards. */\n  --gp-radius: 0px;\n  --gp-radius-btn: 2px;\n\n  /* Border / hairline weight */\n  --gp-hairline-w: 1px;\n\n  /* Motion */\n  --gp-ease: cubic-bezier(0.2, 0.0, 0.0, 1.0);\n  --gp-dur-fast: 160ms;\n  --gp-dur: 200ms;\n  --gp-dur-reveal: 400ms;\n}\n\n<\u002Fstyle>\n  <style>\n    *{box-sizing:border-box}\n    body{margin:0;background:#e7e5df}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#e7e5df;padding:48px;font-family:var(--gp-font-body)\">\n\n  <div style=\"max-width:900px;margin:0 auto 30px\">\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px\">\n      <a href=\"#/wireframes/Module 1 - Asset Manager.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2px;text-decoration:none;display:inline-block;background:#fff;color:#6B6B70;border:1px solid var(--gp-hairline-light)\">1 · Asset Manager<\u002Fa>\n      <a href=\"#/wireframes/Module 2 - Event Tracker.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2px;text-decoration:none;display:inline-block;background:#fff;color:#6B6B70;border:1px solid var(--gp-hairline-light)\">2 · Event Tracker<\u002Fa>\n      <a href=\"#/wireframes/Module 3 - Call Sheet.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2p eight=\"16\" rx=\"2\"><\u002Frect><rect x=\"9\" y=\"3\" width=\"6\" height=\"3.2\" rx=\"1\" fill=\"#7A7A78\" stroke=\"none\"><\u002Frect><path d=\"M8.5 11h7M8.5 15h4.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7A7A78\">Call sheet<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 20px;cursor:pointer\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FEBD17\" stroke-width=\"1.6\"><path d=\"M12 6.2C10 4.9 7.5 4.7 5 5.2v12c2.5-.5 5-.3 7 1 2-1.3 4.5-1.5 7-1v-12c-2.5-.5-5-.3-7 1z\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M12 6.2V18\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#FEBD17;font-weight:700\">Knowledge<\u002Fspan>\n            <\u002Fdiv>\n            <div onclick=\"{{goConey}}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 20px;cursor:pointer\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7A7A78\" stroke-width=\"1.6\"><path d=\"M5 6h14v9H10l-4 3.5V15H5z\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7A7A78\">Coney<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SCREEN · CONEY (TROUBLESHOOTING) ============ -->\n      <sc-if value=\"{{isConey}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"background:#FAF9F6;min-height:100%;font-family:var(--gp-font-body);display:flex;flex-direction:column\">\n          <div style=\"background:#0A0B0C;color:#F4F4F2;padding:56px 18px 18px;display:flex;align-items:center;gap:13px\">\n            <span style=\"width:42px;height:42px;border-radius:50%;background:#FEBD17;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--gp-font-display);font-weight:700;font-size:18px;color:#0A0B0C\">C<\u002Fspan>\n            <div style=\"flex:1\">\n              <div style=\"font-family:var(--gp-font-display);font-weight:700;font-size:19px;letter-spacing:-0.01em\">Coney<\u002Fdiv>\n              <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#FEBD17;display:flex;align-items:center;gap:6px\"><span style=\"width:6px;height:6px;border-radius:50%;background:#16744B;display:inline-block\"><\u002Fspan>Troubleshooting assistant<\u002Fdiv>\n            <\u002Fdiv>\n            <span onclick=\"{{resetChat}}\" style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#9A9A96;border:1px solid rgba(244,244,242,0.2);border-radius:2px;padding:6px 9px;cursor:pointer\">Reset<\u002Fspan>\n          <\u002Fdiv>\n\n          <div style=\"flex:1;padding:16px 12px 8px;display:flex;flex-direction:column;gap:12px\">\n            <sc-for list=\"{{chat}}\" as=\"m\" hint-placeholder-count=\"1\">\n              <sc-if value=\"{{m.isConey}}\" hint-placeholder-val=\"{{true}}\">\n                <div style=\"display:flex;gap:9px;align-items:flex-start\">\n                  <span style=\"width:28px;height:28px;border-radius:50%;background:#FEBD17;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--gp-font-display);font-weight:700;font-size:12px;color:#0A0B0C\">C<\u002Fspan>\n                  <div style=\"flex:1;background:#fff;border:1px solid var(--gp-hairline-light);border-radius:4px 12px 12px 12px;padding:12px 14px\">\n                    <div style=\"font-family:var(--gp-font-body);font-size:14px;line-height:1.5;color:#1B1B1F\">{{m.text}}<\u002Fdiv>\n                    <sc-if value=\"{{m.hasSteps}}\" hint-placeholder-val=\"{{false}}\">\n                      <div style=\"margin-top:11px;display:flex;flex-direction:column;gap:9px\">\n                        <sc-for list=\"{{m.steps}}\" as=\"st\" hint-placeholder-count=\"3\">\n                          <div style=\"display:flex;gap:10px;align-items:flex-start\">\n                            <span style=\"width:20px;height:20px;border-radius:50%;background:#FEF1CE;color:#B07A00;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--gp-font-mono);font-size:11px;font-weight:700\">{{st.n}}<\u002Fspan>\n                            <span style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.45;color:#33333A\">{{st.text}}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{m.escalate}}\" hint-placeholder-val=\"{{false}}\">\n                      <div onclick=\"{{goReport}}\" style=\"margin-top:13px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:#FAF9F6;border:1px solid var(--gp-hairline-light);border-radius:4px;padding:11px 13px;cursor:pointer\" style-hover=\"border-color:#c2bfb6\">\n                        <span style=\"font-family:var(--gp-font-body);font-size:13px;color:#33333A\">Still stuck? Escalate this.<\u002Fspan>\n                        <span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#B07A00;font-weight:700;white-space:nowrap\">Report an issue →<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{m.isUser}}\" hint-placeholder-val=\"{{false}}\">\n                <div style=\"display:flex;justify-content:flex-end\">\n                  <div style=\"max-width:80%;background:#0A0B0C;color:#F4F4F2;border-radius:12px 4px 12px 12px;padding:11px 14px;font-family:var(--gp-font-body);font-size:14px;line-height:1.45\">{{m.text}}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fsc-for>\n\n            <div style=\"margin-top:4px\">\n              <div style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#9A9A96;margin-bottom:9px\">Common problems<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{quickProblems}}\" as=\"q\" hint-placeholder-count=\"5\">\n                  <span onclick=\"{{q.ask}}\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.02em;padding:9px 13px;border-radius:16px;background:#fff;border:1px solid var(--gp-hairline-light);color:#1B1B1F;cursor:pointer\" style-hover=\"border-color:#FEBD17;background:#FEF8E6\">{{q.label}}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"position:sticky;bottom:0;margin-top:auto;background:#0A0B0C\">\n            <div style=\"padding:11px 12px;display:flex;gap:9px;align-items:center;border-top:1px solid rgba(244,244,242,0.14)\">\n              <div onclick=\"{{sendDummy}}\" style=\"flex:1;background:#16181b;border:1px solid rgba(244,244,242,0.14);border-radius:18px;padding:11px 15px;font-family:var(--gp-font-body);font-size:13px;color:#6B6B70;cursor:pointer\">Describe the problem…<\u002Fdiv>\n              <span onclick=\"{{sendDummy}}\" style=\"width:38px;height:38px;border-radius:50%;background:#FEBD17;color:#0A0B0C;display:flex;align-items:center;justify-content:center;flex:none;font-size:17px;cursor:pointer\">↑<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border-top:1px solid rgba(244,244,242,0.14);display:flex\">\n              <div onclick=\"{{goCall}}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 20px;cursor:pointer\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7A7A78\" stroke-width=\"1.6\"><rect x=\"5\" y=\"4.5\" width=\"14\" height=\"16\" rx=\"2\"><\u002Frect><rect x=\"9\" y=\"3\" width=\"6\" height=\"3.2\" rx=\"1\" fill=\"#7A7A78\" stroke=\"none\"><\u002Frect><path d=\"M8.5 11h7M8.5 15h4.5\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7A7A78\">Call sheet<\u002Fspan>\n              <\u002Fdiv>\n              <div onclick=\"{{goKb}}\" style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 20px;cursor:pointer\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7A7A78\" stroke-width=\"1.6\"><path d=\"M12 6.2C10 4.9 7.5 4.7 5 5.2v12c2.5-.5 5-.3 7 1 2-1.3 4.5-1.5 7-1v-12c-2.5-.5-5-.3-7 1z\" stroke-linejoin=\"round\"><\u002Fpath><path d=\"M12 6.2V18\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7A7A78\">Knowledge<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 0 20px;cursor:pointer\">\n                <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#FEBD17\" stroke-width=\"1.6\"><path d=\"M5 6h14v9H10l-4 3.5V15H5z\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-family:var(--gp-font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#FEBD17;font-weight:700\">Coney<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"position:absolute;bottom:96px;left:50%;transform:translateX(-50%);z-index:50;background:#0A0B0C;color:#F4F4F2;border-radius:4px;padding:11px 18px;display:flex;align-items:center;gap:9px;box-shadow:0 8px 24px rgba(0,0,0,0.32);white-space:nowrap\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block;flex:none\"><\u002Fspan>\n          <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.04em;color:#F4F4F2\">{{toast}}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fx-import>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: \"callsheet\",\n    issueType: \"equipment\",\n    urgent: false,\n    toast: null,\n    kbFilter: \"all\",\n    chat: null,\n  };\n  flash(msg) {\n    this.setState({ toast: msg });\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.setState({ toast: null }), 1900);\n  }\n  // ---- Coney troubleshooting knowledge ----\n  problemBank() {\n    return [\n      {\n        key: \"power\",\n        label: \"Wall won't power on\",\n        reply: \"Let's get the wall live. Most no-power calls are a circuit or sequence issue.\",\n        steps: [\n          \"Confirm both legs are on a dedicated 20A circuit — share nothing else on it.\",\n          \"Check the breaker at the compute case (it trips on inrush). Reset and hold 3s.\",\n          \"Power up in order: mains → compute unit → panels. Wait for the green hub LED before the panels.\",\n        ],\n        escalate: true,\n      },\n      {\n        key: \"cans\",\n        label: \"Spray cans not pairing\",\n        reply: \"Pairing drops are almost always charge or dock-handshake. Try this:\",\n        steps: [\n          \"Re-dock the can fully for 5s — listen for the double chirp.\",\n          \"Check the charge ring: below 15% it won't hold a pairing.\",\n          \"If two+ cans are stuck, power-cycle the pairing hub (hold the side button 6s).\",\n        ],\n        escalate: true,\n      },\n      {\n        key: \"network\",\n        label: \"Network drops mid-event\",\n        reply: \"Mid-event drops usually mean RF congestion at a busy venue.\",\n        steps: [\n          \"Switch the compute unit to the wired uplink if a drop is available.\",\n          \"Move the router off the floor and away from LED walls / large metal.\",\n          \"In the wall app, set the band to 5GHz-only to dodge crowded 2.4GHz.\",\n        ],\n        escalate: true,\n      },\n      {\n        key: \"latency\",\n        label: \"Paint lag / latency\",\n        reply: \"Lag is a load issue — the wall is rendering more than the compute can keep up with.\",\n        steps: [\n          \"Cap active cans at 8 for a single 4K wall.\",\n          \"Lower the brush particle density one notch in the wall app.\",\n          \"Restart the wall app between sessions to clear the render buffer.\",\n        ],\n        escalate: true,\n      },\n      {\n        key: \"panel\",\n        label: \"Dead panel / artifacts\",\n        reply: \"A dark block or flicker is nearly always a seated-cable fault.\",\n        steps: [\n          \"Reseat the ribbon cable on the back of the affected panel.\",\n          \"Swap in a spare panel from Case E if it persists.\",\n          \"Flag the panel ID so it's pulled from the next kit.\",\n        ],\n        escalate: true,\n      },\n    ];\n  }\n  send(p) {\n    const userMsg = { from: \"user\", text: p.label };\n    const coneyMsg = { from: \"coney\", text: p.reply, steps: p.steps || [], escalate: !!p.escalate };\n    this.setState((s) => ({ chat: [...(s.chat || this.intro()), userMsg, coneyMsg] }));\n  }\n  intro() {\n    return [{ from: \"coney\", text: \"Hey, I'm Coney — your on-site troubleshooting buddy. Pick a problem below or describe what the wall's doing.\", steps: [], escalate: false }];\n  }\n  resetChat() { this.setState({ chat: this.intro() }); }\n  renderVals() {\n    const typeDefs = [\"Technical\", \"Logistics\", \"Client\", \"Equipment\", \"Feedback\"];\n    const issueTypes = typeDefs.map((label) => ({\n      label,\n      active: this.state.issueType === label.toLowerCase(),\n      notActive: this.state.issueType !== label.toLowerCase(),\n      pick: () => this.setState({ issueType: label.toLowerCase() }),\n    }));\n\n    // ---- Knowledge base ----\n    const articles = [\n      { cat: \"install\", catLabel: \"Install\", title: \"Rigging the wall frame\", summary: \"Frame assembly order, torque spec, and the two-person lift for a 4K wall.\" },\n      { cat: \"install\", catLabel: \"Install\", title: \"Power & circuit requirements\", summary: \"Two dedicated 20A legs, no shared loads. Inrush, breakers, and the power-up sequence.\" },\n      { cat: \"install\", catLabel: \"Install\", title: \"Connecting the compute unit\", summary: \"Cabling from compute case to the panel chain and the green-LED handshake.\" },\n      { cat: \"install\", catLabel: \"Install\", title: \"Pairing the spray cans\", summary: \"Docking handshake, charge thresholds, and bringing a full set of 12 online.\" },\n      { cat: \"trouble\", catLabel: \"Troubleshoot\", title: \"Wall won't power on\", summary: \"Circuit, breaker, and sequence checks — the three causes behind most no-power calls.\" },\n      { cat: \"trouble\", catLabel: \"Troubleshoot\", title: \"Spray cans not pairing\", summary: \"Re-dock, charge ring, and a hub power-cycle when multiple cans drop.\" },\n      { cat: \"trouble\", catLabel: \"Troubleshoot\", title: \"Network drops mid-event\", summary: \"Wired uplink, router placement, and forcing 5GHz in crowded venues.\" },\n      { cat: \"trouble\", catLabel: \"Troubleshoot\", title: \"Paint lag / latency\", summary: \"Cap active cans, lower particle density, restart the app to clear the buffer.\" },\n      { cat: \"best\", catLabel: \"Best practice\", title: \"Pre-event load-in checklist\", summary: \"The 12-point check to run before doors so nothing surfaces live.\" },\n      { cat: \"best\", catLabel: \"Best practice\", title: \"Spray-can battery rotation\", summary: \"Rotate cans through the dock in thirds to keep a full set always charged.\" },\n      { cat: \"best\", catLabel: \"Best practice\", title: \"Wall placement & crowd flow\", summary: \"Sightlines, throw distance, and keeping a clear paint lane in busy rooms.\" },\n      { cat: \"best\", catLabel: \"Best practice\", title: \"Lighting for best visibility\", summary: \"Keep direct light off the wall face; aim for even, indirect ambient levels.\" },\n    ];\n    const filt = this.state.kbFilter;\n    const catColors = { install: \"#2A6FDB\", trouble: \"#C7402F\", best: \"#1F8A5B\" };\n    const kbArticles = articles\n      .filter((a) => filt === \"all\" || a.cat === filt)\n      .map((a) => ({ ...a, catColor: catColors[a.cat], open: () => this.flash(\"Opens “\" + a.title + \"” (demo)\") }));\n    const kbFilters = [\n      { key: \"all\", label: \"All\" },\n      { key: \"install\", label: \"Installation\" },\n      { key: \"trouble\", label: \"Troubleshooting\" },\n      { key: \"best\", label: \"Best practices\" },\n    ].map((f) => ({ label: f.label, active: filt === f.key, notActive: filt !== f.key, go: () => this.setState({ kbFilter: f.key }) }));\n\n    // ---- Coney chat ----\n    const chat = (this.state.chat || this.intro()).map((m, i) => ({\n      isConey: m.from === \"coney\",\n      isUser: m.from === \"user\",\n      text: m.text,\n      steps: (m.steps || []).map((s, j) => ({ n: j + 1, text: s })),\n      hasSteps: (m.steps || []).length > 0,\n      escalate: !!m.escalate,\n    }));\n    const quickProblems = this.problemBank().map((p) => ({ label: p.label, ask: () => this.send(p) }));\n\n    const screen = this.state.screen;\n    return {\n      isCall: screen === \"callsheet\",\n      isUpload: screen === \"upload\",\n      isReport: screen === \"report\",\n      isKb: screen === \"knowledge\",\n      isConey: screen === \"coney\",\n      tabCall: screen === \"callsheet\", tabCallOff: screen !== \"callsheet\",\n      tabKb: screen === \"knowledge\", tabKbOff: screen !== \"knowledge\",\n      tabConey: screen === \"coney\", tabConeyOff: screen !== \"coney\",\n      goUpload: () => this.setState({ screen: \"upload\" }),\n      goReport: () => this.setState({ screen: \"report\" }),\n      goCall: () => this.setState({ screen: \"callsheet\" }),\n      goKb: () => this.setState({ screen: \"knowledge\" }),\n      goConey: () => this.setState({ screen: \"coney\" }),\n      issueTypes,\n      urgent: this.state.urgent,\n      notUrgent: !this.state.urgent,\n      toggleUrgent: () => this.setState((s) => ({ urgent: !s.urgent })),\n      toast: this.state.toast,\n      hasToast: !!this.state.toast,\n      openMaps: () => this.flash(\"Opening Maps (demo)\"),\n      call: () => this.flash(\"Calling (demo)\"),\n      pickCamera: () => this.flash(\"Camera (demo)\"),\n      pickLibrary: () => this.flash(\"Photo library (demo)\"),\n      addPhoto: () => this.flash(\"Attach photo (demo)\"),\n      kbArticles, kbFilters,\n      kbSearch: () => this.flash(\"Search the knowledge base (demo)\"),\n      noResults: kbArticles.length === 0,\n      chat, quickProblems,\n      resetChat: () => this.resetChat(),\n      sendDummy: () => this.flash(\"Type to Coney (demo) — pick a problem below\"),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"},"entry":"wireframes/Module 2 - Event Tracker.dc"}
  </script>
