document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    const templateData = JSON.parse(templateEl.textContent);
    const pages = templateData.pages;
    const entryId = templateData.entry;
    const pageIds = Object.keys(pages);

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : {};

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    // Per-page prep: substitute UUIDs, strip SRI/crossorigin (blob URLs from a
    // file:// document inherit a null origin, so crossorigin forces a CORS
    // fetch that SRI then rejects — the manifest bytes are ours; SRI protects
    // against CDN compromise, not this), and inject the page's own
    // window.__resources + the click interceptor into <head>. slice() rather
    // than replace() keeps us clear of $-pattern substitution.
    function resourcesFor(id) {
      var map = {};
      var list = extResources[id] || [];
      for (var k = 0; k < list.length; k++) {
        if (blobUrls[list[k].uuid]) map[list[k].id] = blobUrls[list[k].uuid];
      }
      return map;
    }
    for (const id of pageIds) {
      let t = pages[id];
      for (const uuid of uuids) t = t.split(uuid).join(blobUrls[uuid]);
      t = t.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');
      // The click interceptor owns every anchor click (not a <base target>):
      // a blanket <base target="_parent"> would also redirect form submissions
      // and tear down the wrapper. Non-# links navigate the parent to the
      // anchor's resolved href; #/… routes forward to the parent's hash only
      // when the id is one of this bundle's own pages (author #/… links from
      // an in-page hash router are left to the scroll path so they don't yank
      // the user to the entry page); plain #frag scrolls in place.
      // composedPath + getAttribute('target') handle SVG <a> and shadow-DOM
      // anchors, which closest()/IDL .target get wrong.
      var headContent = 'window.__resources = ' + JSON.stringify(resourcesFor(id)) + ';' +
        (pageIds.length > 1 ?

            'if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.defaultPrevented) return;' +
            'var a = null, p = e.composedPath ? e.composedPath() : [e.target];' +

            '}' +
            'if (!a && e.target.closest) a = e.target.closest("a, area");' +
            'if (!a || a.hasAttribute("download")) return;' +
            'var tg = a.getAttribute("target");' +
            'if (tg && tg !== "_self") return;' +
            'var h = a.getAttribute("href") || a.getAttribute("xlink:href");' +
            'if (!h || /^javascript:/i.test(h)) return;' +
            'if (h.charAt(0) !== "#") {' +
              'if (!tg) { var b = document.querySelector("base[target]"); if (b && b.getAttribute("target") !== "_self") return; }' +
              'e.preventDefault();' +
              'if (/^(?:[a-z][a-z0-9+.-]*:|\\/\\/)/i.test(h)) parent.location.assign(h);' +
              'return;' +
            '}' +
            'e.preventDefault();' +
            'if (h.slice(0, 2) === "#/") {' +
              'var c = h.indexOf(":", 2);' +
              'var pid = c < 0 ? h.slice(2) : h.slice(2, c);' +
              'try { pid = decodeURIComponent(pid); } catch(err) {}' +
              'if (window.__bundler_pages.indexOf(pid) >= 0) { parent.location.hash = h; return; }' +
            '}' +
            'var t = h.length > 1 ? document.getElementById(h.slice(1)) : null;' +
            'if (t) t.scrollIntoView({behavior:"smooth"});' +
            'else scrollTo({top:0, behavior:"smooth"});' +
          '});' : '');
      // Defuse any script end-tag sequence in the content (resource ids, page
      // ids) before wrapping — same escape level as every sibling JSON island.
      var headScript = '<script>' +
        headContent.split('</' + 'script').join('<\\/' + 'script') +
        '</' + 'script>';
      // Inject after <head> so the DOCTYPE stays first; prepending the script
      // would push the parser into quirks mode. DOMParser always emits a <head>
      // (synthesizing one if the source HTML omitted it) but may carry
      // attributes through, so match the full opening tag.
      var headOpen = t.match(/<head[^>]*>/i);
      if (headOpen) {
        var hi = headOpen.index + headOpen[0].length;
        t = t.slice(0, hi) + headScript + t.slice(hi);
      }
      pages[id] = t;
    }

    setStatus('Rendering...');

    if (pageIds.length === 1) {
      // Single page: the pre-crawl render path. Parse the template and swap the
      // root element. Scripts inserted via DOMParser/replaceWith are inert per
      // spec — re-create each with createElement so they execute, awaiting
      // onload for src scripts to preserve ordering (React before ReactDOM
      // before Babel before text/babel).
      var template = pages[entryId];
      const doc = new DOMParser().parseFromString(template, 'text/html');
      document.documentElement.replaceWith(doc.documentElement);
      const dead = Array.from(document.scripts);
      for (const old of dead) {
        const s = document.createElement('script');
        for (const a of old.attributes) s.setAttribute(a.name, a.value);
        s.textContent = old.textContent;
        // text/babel scripts with a src: fetch and inline. transformScriptTags
        // does XHR against the src, but blob:null/ from a file:// origin is
        // silently dropped. Inlining makes it a plain inline babel script,
        // which transformScriptTags handles unconditionally.
        if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
          try {
            const r = await fetch(s.src);
            s.textContent = await r.text();
            s.removeAttribute('src');
          } catch (e) {}
        }
        // Non-executable script types (text/babel, application/json, …) are
        // data blocks per spec: the browser never fetches src and never fires
        // load/error, so awaiting would hang forever.
        const exec = !s.type || s.type === 'module' || /(java|ecma)script/i.test(s.type);
        const p = (s.src && exec) ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
        old.replaceWith(s);
        if (p) await p;
      }
      // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
      // which fired before we swapped the document. Trigger manually if present.
      if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
        window.Babel.transformScriptTags();
      }
      return;
    }

    // Multi-page: render into a full-viewport srcdoc iframe so each page runs
    // in its own realm while staying same-origin with the parent (so asset
    // blob URLs load and parent.location is writable).
    var frame = document.createElement('iframe');
    frame.id = '__bundler_frame';
    frame.setAttribute('style', 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff');
    document.body.appendChild(frame);

    function decode(s) {
      try { return decodeURIComponent(s); } catch (e) { return s; }
    }
    function route() {
      var h = (location.hash || '');
      if (h.slice(0, 2) !== '#/') return { id: entryId, anchor: '' };
      h = h.slice(2);
      var i = h.indexOf(':');
      return i < 0 ? { id: decode(h), anchor: '' }
                   : { id: decode(h.slice(0, i)), anchor: decode(h.slice(i + 1)) };
    }

    var current = null;
    var navGen = 0;
    function navigate() {
      var r = route();
      var id = Object.prototype.hasOwnProperty.call(pages, r.id) ? r.id : entryId;
      if (current === id) {
        // Same-page anchor change: the iframe's own hash handles this, so
        // normally we don't reach here. If we do (e.g. a programmatic
        // parent.location.hash change), nudge the iframe.
        var cw = frame.contentWindow;
        if (!cw) return;
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView({ behavior: 'smooth' });
        else cw.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }
      current = id;
      var gen = ++navGen;
      frame.onload = function() {
        // One-shot: an iframe-internal navigation (form submit, page JS
        // location.href=) re-fires onload with the same gen; after that the
        // iframe may be cross-origin, and cw.* access would throw.
        frame.onload = null;
        if (gen !== navGen) return;
        var cw = frame.contentWindow;
        try { cw.document.title && (document.title = cw.document.title); } catch (e) {}
        var splash = document.getElementById('__bundler_thumbnail') ||
                     document.getElementById('__bundler_placeholder');
        if (splash) splash.remove();
        if (loading) loading.remove();
        var el = r.anchor && cw.document.getElementById(r.anchor);
        if (el) el.scrollIntoView();
        else cw.scrollTo(0, 0);
      };
      frame.srcdoc = pages[id];
    }

    window.addEventListener('hashchange', navigate);
    navigate();
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"776e602c-4a35-4e92-b6aa-f9973ce345a0\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"4c8d942f-4476-464f-a628-1d72dd82540f\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Space Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"b8ddb5b8-2be3-46ef-a2f0-3fc664431126\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Graffiti display face — big stat numbers + the occasional tagged word\n   (\"18 · 500+ · 6 · 2008\" on the homepage). The live site uses a custom\n   hand-drawn tag; Permanent Marker is the closest free stand-in.\n   SUBSTITUTION — replace with the licensed face if you have it. */\n/* latin */\n@font-face {\n  font-family: 'Permanent Marker';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0f8cb675-3c11-49b6-b3de-54d2c195bd04\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Graffiti+ colour system.\n   Rule: black ground, photography is the colour, yellow is a single accent — never a flood.\n   Ratio discipline ≈ 70% black ground / 25% ink + photo / 5% yellow. */\n:root {\n  /* — Dark surface (stage / hero / covers) — */\n  --gp-ground:        #0A0B0C; /* primary background on every surface */\n  --gp-ground-alt:    #000D10; /* deepest black, photo overlays */\n  --gp-ink:           #F4F4F2; /* primary type on dark */\n  --gp-ink-dim:       #E0E0DC; /* body / supporting copy on dark */\n  --gp-muted:         #9A9A96; /* secondary copy, second headline line */\n  --gp-mono-grey:     #8A8A86; /* eyebrow + metadata labels */\n  --gp-accent:        #FEBD17; /* signature yellow — rules, numerals, one word */\n  --gp-accent-deep:   #B07A00; /* dark-gold shadow / pressed / yellow text on light */\n  --gp-hairline:      rgba(244, 244, 242, 0.16); /* dividers, grid lines, borders */\n\n  /* — Light surface (long-form web, documents) — */\n  --gp-paper:         #FFFFFF; /* primary light ground */\n  --gp-paper-warm:    #FAF9F6; /* softer light ground, large fields */\n  --gp-ink-on-light:  #0A0B0C; /* headlines + primary type on light */\n  --gp-body:          #33333A; /* body copy on light */\n  --gp-muted-light:   #6B6B70; /* second headline line, secondary copy on light */\n  --gp-hairline-light: rgba(10, 11, 12, 0.12); /* dividers / grid lines on light */\n\n  /* — Photo scrim (directional, lands where copy sits) — */\n  --gp-scrim-strong:  rgba(10, 11, 12, 0.96);\n  --gp-scrim-soft:    rgba(10, 11, 12, 0.90);\n\n  /* — Semantic aliases — */\n  --surface:          var(--gp-ground);\n  --surface-light:    var(--gp-paper);\n  --text:             var(--gp-ink);\n  --text-light:       var(--gp-ink-on-light);\n  --text-muted:       var(--gp-muted);\n  --label:            var(--gp-mono-grey);\n  --accent:           var(--gp-accent);\n  --accent-text-light: var(--gp-accent-deep); /* yellow-toned text on light — never raw accent */\n  --rule:             var(--gp-hairline);\n  --rule-light:       var(--gp-hairline-light);\n}\n\n/* Graffiti+ typography.\n   Grotesk display (Archivo) + mono labels (Space Mono). Mono is for labels ONLY —\n   eyebrows, captions, stat tickers, metadata. Never body or headlines. */\n:root {\n  /* Families */\n  --gp-font-display: \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-body:    \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-mono:    \"Space Mono\", \"Courier New\", ui-monospace, monospace;\n  --gp-font-graffiti: \"Permanent Marker\", \"Comic Sans MS\", cursive; /* big stat numbers / tagged accents */\n\n  /* Weights — the live site sets headlines around bold, not black */\n  --gp-weight-body:    400;\n  --gp-weight-medium:  500;\n  --gp-weight-display: 700;\n  --gp-weight-black:   800;\n\n  /* Display metrics */\n  --gp-display-tracking: -0.01em; /* neutral grotesque needs little negative tracking */\n  --gp-display-leading:  0.92;    /* 0.84–0.98 */\n  --gp-body-leading:     1.5;     /* 1.3–1.5 */\n  --gp-mono-tracking:    0.18em;  /* 0.12–0.22em, UPPERCASE */\n\n  /* Fluid web scale — clamp(min, preferred, max), base 1rem = 16px */\n  --gp-hero:      clamp(3rem, 9vw, 7.5rem);        /* 900 */\n  --gp-title:     clamp(2rem, 5vw, 4rem);          /* 800 */\n  --gp-subhead:   clamp(1.4rem, 2.6vw, 2.25rem);   /* 800 */\n  --gp-body-size: clamp(1rem, 1.2vw, 1.25rem);     /* 400 */\n  --gp-stat:      clamp(2.75rem, 7vw, 6rem);       /* 900 */\n  --gp-eyebrow:   0.875rem;                          /* 0.8125–0.9375rem */\n\n  /* Slide scale (1920×1080, px) — 24px floor */\n  --gp-slide-hero:    185px;  /* 160–210 / 900 */\n  --gp-slide-title:   84px;   /* 72–96 / 800 */\n  --gp-slide-subhead: 38px;   /* 34–44 / 800 */\n  --gp-slide-body:    32px;   /* 28–38 / 400–500 */\n  --gp-slide-stat:    104px;  /* 88–120 / 900 */\n  --gp-slide-eyebrow: 24px;   /* 22–26 */\n}\n\n/* Graffiti+ spacing & layout.\n   Use these steps only. Hairline grids structure cells — borders divide, don't contain. */\n:root {\n  /* Spacing scale (rem) */\n  --gp-space-1:  0.5rem;\n  --gp-space-2:  0.75rem;\n  --gp-space-3:  1rem;\n  --gp-space-4:  1.5rem;\n  --gp-space-5:  2rem;\n  --gp-space-6:  3rem;\n  --gp-space-7:  4rem;\n  --gp-space-8:  6rem;\n  --gp-space-9:  8rem;\n\n  /* Section rhythm + measure */\n  --gp-section-pad:  clamp(4rem, 10vw, 9rem); /* vertical section padding */\n  --gp-content-max:  1240px;                  /* max content width */\n  --gp-gutter:       clamp(1.25rem, 5vw, 4rem);\n  --gp-measure:      70ch;                     /* body line length */\n\n  /* Slide canvas */\n  --gp-slide-w: 1920px;\n  --gp-slide-h: 1080px;\n  --gp-slide-pad: 80px 96px;\n\n  /* Radius — none / minimal. No rounded accent cards. */\n  --gp-radius: 0px;\n  --gp-radius-btn: 2px;\n\n  /* Border / hairline weight */\n  --gp-hairline-w: 1px;\n\n  /* Motion */\n  --gp-ease: cubic-bezier(0.2, 0.0, 0.0, 1.0);\n  --gp-dur-fast: 160ms;\n  --gp-dur: 200ms;\n  --gp-dur-reveal: 400ms;\n}\n\n<\u002Fstyle>\n  <style>\n    *{box-sizing:border-box}\n    body{margin:0;background:#e7e5df}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#e7e5df;padding:40px;font-family:var(--gp-font-body)\">\n\n  <div style=\"max-width:1320px;margin:0 auto 22px\">\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px\">\n      <a href=\"#/wireframes/Module 1 - Asset Manager.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2px;text-decoration:none;display:inline-block;background:#fff;color:#6B6B70;border:1px solid var(--gp-hairline-light)\">1 · Asset Manager<\u002Fa>\n      <a href=\"#/wireframes/Module 2 - Event Tracker.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2px;text-decoration:none;display:inline-block;background:#FEBD17;color:#0A0B0C;font-weight:700\">2 · Event Tracker<\u002Fa>\n      <a href=\"#/wireframes/Module 3 - Call Sheet.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spa \"><span style=\"color:#6B6B70;font-size:12px\">⌕<\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.06em;color:#6B6B70\">Search<\u002Fspan><\u002Fdiv>\n        <div style=\"width:26px;height:26px;border-radius:50%;background:#2a2c2f\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;display:flex;min-height:0\">\n      <!-- left nav -->\n      <div style=\"width:208px;flex:none;border-right:1px solid var(--gp-hairline-light);padding:18px 12px;background:#FAF9F6;display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{nav}}\" as=\"n\" hint-placeholder-count=\"6\">\n          <sc-if value=\"{{n.active}}\" hint-placeholder-val=\"{{true}}\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 10px;background:#fff;border:1px solid var(--gp-hairline-light);border-radius:2px\"><span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#0A0B0C;font-weight:700\">{{n.label}}<\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:10px;color:#9A9A96\">{{n.count}}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{n.notActive}}\" hint-placeholder-val=\"{{false}}\">\n            <div onclick=\"{{n.go}}\" style=\"display:flex;align-items:center;justify-content:space-between;padding:10px 10px;cursor:pointer;border-radius:2px\" style-hover=\"background:#fff\"><span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B6B70\">{{n.label}}<\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:10px;color:#9A9A96\">{{n.count}}<\u002Fspan><\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <!-- main -->\n      <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n\n        <!-- ============ EVENTS ============ -->\n        <sc-if value=\"{{showEventsBoard}}\" hint-placeholder-val=\"{{true}}\">\n          <div style=\"flex:none;height:60px;border-bottom:1px solid var(--gp-hairline-light);display:flex;align-items:center;justify-content:space-between;padding:0 24px\">\n            <div style=\"display:flex;align-items:center;gap:14px\"><h2 style=\"font-family:var(--gp-font-display);font-weight:700;font-size:22px;letter-spacing:-0.01em;color:#0A0B0C;margin:0\">All events<\u002Fh2><span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.06em;color:#9A9A96\">8 active<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:14px\">\n              <div style=\"display:inline-flex;border:1px solid var(--gp-hairline-light);border-radius:2px;overflow:hidden\">\n                <span onclick=\"{{showBoard}}\" style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;cursor:pointer;color:#0A0B0C;background:#FEBD17;font-weight:700\">Board<\u002Fspan>\n                <span onclick=\"{{showList}}\" style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:8px 14px;cursor:pointer;border-left:1px solid var(--gp-hairline-light);color:#6B6B70\">List<\u002Fspan>\n              <\u002Fdiv>\n              <div onclick=\"{{filter}}\" style=\"height:32px;border:1px solid var(--gp-hairline-light);border-radius:2px;display:flex;align-items:center;padding:0 12px;font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#6B6B70;cursor:pointer\">Filter ▾<\u002Fdiv>\n              <span onclick=\"{{newEvent}}\" style=\"background:#FEBD17;color:#0A0B0C;border-radius:2px;padding:9px 16px;font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer\">+ New event<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex:1;min-height:0;overflow:auto;padding:20px 24px;display:flex;gap:16px;align-items:flex-start\">\n            <sc-for list=\"{{columns}}\" as=\"col\" hint-placeholder-count=\"6\">\n              <div ondragover=\"{{allowDrop}}\" ondrop=\"{{col.drop}}\" style=\"flex:none;width:248px;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;align-items:center;gap:9px;padding-bottom:10px;border-bottom:1px solid var(--gp-hairline-light)\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{col.dot}};display:inline-block\"><\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#0A0B0C;font-weight:700\">{{col.label}}<\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:10px;color:#9A9A96;margin-left:auto\">{{col.count}}<\u002Fspan><\u002Fdiv>\n                <sc-for list=\"{{col.items}}\" as=\"ev\" hint-placeholder-count=\"2\">\n                  <div onclick=\"{{ev.open}}\" draggable=\"true\" ondragstart=\"{{ev.onDragStart}}\" style=\"background:#fff;border:1px solid var(--gp-hairline-light);border-radius:2px;padding:14px;cursor:grab;display:flex;flex-direction:column;gap:9px\" style-hover=\"border-color:#0A0B0C\">\n                    <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#B07A00\">{{ev.client}}<\u002Fdiv>\n                    <div style=\"font-family:var(--gp-font-display);font-weight:700;font-size:15px;letter-spacing:-0.01em;color:#0A0B0C;line-height:1.1\">{{ev.title}}<\u002Fdiv>\n                    <div style=\"font-family:var(--gp-font-mono);font-size:11px;color:#9A9A96\">{{ev.date}} · {{ev.loc}}<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--gp-hairline-light);padding-top:9px;margin-top:2px\"><span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;color:#6B6B70\">{{ev.techLabel}}<\u002Fspan><spa -size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer\" onclick=\"{{newCase}}\">+ New case<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-height:0;overflow:auto;padding:8px 24px 24px\">\n            <div style=\"display:flex;gap:16px;padding:14px 14px;border-bottom:1px solid var(--gp-hairline-light);font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9A9A96\"><span style=\"flex:1\">Case<\u002Fspan><span style=\"flex:2\">Contents<\u002Fspan><span style=\"width:90px\">Weight<\u002Fspan><span style=\"width:120px\">Status<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{cases}}\" as=\"k\" hint-placeholder-count=\"5\">\n              <div onclick=\"{{k.open}}\" style=\"display:flex;gap:16px;align-items:center;padding:14px 14px;border-bottom:1px solid var(--gp-hairline-light);cursor:pointer\" style-hover=\"background:#FAF9F6\"><span style=\"flex:1;font-family:var(--gp-font-display);font-weight:700;font-size:15px;color:#0A0B0C\">{{k.name}}<\u002Fspan><span style=\"flex:2;font-family:var(--gp-font-mono);font-size:12px;color:#33333A\">{{k.contents}}<\u002Fspan><span style=\"width:90px;font-family:var(--gp-font-mono);font-size:12px;color:#33333A\">{{k.weight}}<\u002Fspan><span style=\"width:120px;font-family:var(--gp-font-mono);font-size:11px;color:#6B6B70\">{{k.status}}<\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- ============ TASKS ============ -->\n        <sc-if value=\"{{showTasks}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"flex:none;height:60px;border-bottom:1px solid var(--gp-hairline-light);display:flex;align-items:center;justify-content:space-between;padding:0 24px\"><div style=\"display:flex;align-items:center;gap:14px\"><h2 style=\"font-family:var(--gp-font-display);font-weight:700;font-size:22px;letter-spacing:-0.01em;color:#0A0B0C;margin:0\">Tasks<\u002Fh2><span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.06em;color:#9A9A96\">31 total<\u002Fspan><\u002Fdiv><span style=\"background:#FEBD17;color:#0A0B0C;border-radius:2px;padding:9px 16px;font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer\">+ New task<\u002Fspan><\u002Fdiv>\n          <div style=\"flex:1;min-height:0;overflow:auto;padding:8px 24px 24px\">\n            <div style=\"display:flex;gap:16px;padding:14px 14px;border-bottom:1px solid var(--gp-hairline-light);font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#9A9A96\"><span style=\"width:26px\"><\u002Fspan><span style=\"flex:2\">Task<\u002Fspan><span style=\"flex:1\">Event<\u002Fspan><span style=\"width:110px\">Assignee<\u002Fspan><span style=\"width:80px\">Due<\u002Fspan><span style=\"width:120px\">Status<\u002Fspan><\u002Fdiv>\n            <sc-for list=\"{{tasks}}\" as=\"t\" hint-placeholder-count=\"6\">\n              <div style=\"display:flex;gap:16px;align-items:center;padding:14px 14px;border-bottom:1px solid var(--gp-hairline-light)\"><span onclick=\"{{t.toggle}}\" style=\"width:26px;flex:none;cursor:pointer\"><sc-if value=\"{{t.checked}}\" hint-placeholder-val=\"{{false}}\"><span style=\"width:16px;height:16px;background:#16744B;border:1px solid #16744B;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px\">✓<\u002Fspan><\u002Fsc-if><sc-if value=\"{{t.notChecked}}\" hint-placeholder-val=\"{{true}}\"><span style=\"width:16px;height:16px;border:1px solid #c2bfb6;border-radius:2px;display:inline-block\"><\u002Fspan><\u002Fsc-if><\u002Fspan><span style=\"flex:2;font-family:var(--gp-font-body);font-size:14px;color:#0A0B0C\">{{t.task}}<\u002Fspan><span style=\"flex:1;font-family:var(--gp-font-mono);font-size:11px;color:#B07A00\">{{t.event}}<\u002Fspan><span style=\"width:110px;font-family:var(--gp-font-mono);font-size:11px;color:#33333A\">{{t.who}}<\u002Fspan><span style=\"width:80px;font-family:var(--gp-font-mono);font-size:11px;color:#33333A\">{{t.due}}<\u002Fspan><span style=\"width:120px;display:flex;align-items:center;gap:8px\"><span style=\"width:8px;height:8px;border-radius:50%;background:{{t.dot}};display:inline-block\"><\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:11px;color:#33333A\">{{t.status}}<\u002Fspan><\u002Fspan><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{hasToast}}\" hint-placeholder-val=\"{{false}}\">\n  <div style=\"position:fixed;bottom:32px;left:50%;transform:translateX(-50%);z-index:50;background:#0A0B0C;color:#F4F4F2;border-radius:4px;padding:12px 20px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,0.28)\">\n    <span style=\"width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block;flex:none\"><\u002Fspan>\n    <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.06em;color:#F4F4F2\">{{toast}}<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    section: \"events\", layout: \"board\", open: null, draggedId: null, toast: null, checkedTasks: [],\n    events: [\n      { id: 1, client: \"Stanley Park Brewing\", title: \"Brewery Launch Party\", date: \"Jun 14\", loc: \"Vancouver\", status: \"In prep\", techs: 3, asset: \"Assets locked\" },\n      { id: 2, client: \"Nike Jordan\", title: \"All-Star Activation\", date: \"Feb 16\", loc: \"San Francisco\", status: \"Confirmed\", techs: 4, asset: \"Assets pending\" },\n      { id: 3, client: \"Hennessy\", title: \"Flagship Opening\", date: \"Mar 02\", loc: \"New York\", status: \"Confirmed\", techs: 2, asset: \"Assets pending\" },\n      { id: 4, client: \"Red Bull\", title: \"Rampage\", date: \"Oct 11\", loc: \"Virgin, UT\", status: \"On site\", techs: 5, asset: \"Assets locked\" },\n      { id: 5, client: \"Samsung\", title: \"Unpacked Lounge\", date: \"Jul 20\", loc: \"Seoul\", status: \"Confirmed\", techs: 4, asset: \"Assets pending\" },\n      { id: 6, client: \"Google\", title: \"I/O Wall\", date: \"May 14\", loc: \"Mountain View\", status: \"Done\", techs: 3, asset: \"Assets locked\" },\n      { id: 7, client: \"Disney\", title: \"D23 Wall\", date: \"Aug 09\", loc: \"Anaheim\", status: \"Done\", techs: 2, asset: \"Archived\" },\n      { id: 8, client: \"Chanel\", title: \"Beauty Pop-up\", date: \"Apr 05\", loc: \"Miami\", status: \"In prep\", techs: 3, asset: \"Assets pending\" },\n    ],\n  };\n  renderVals() {\n    const { section, layout, open } = this.state;\n    const setSection = (s) => this.setState({ section: s, open: null });\n    const openRecord = () => this.setState({ open: \"record\" });\n    const back = () => this.setState({ open: null });\n    const flash = (msg) => {\n      this.setState({ toast: msg });\n      clearTimeout(this._t);\n      this._t = setTimeout(() => this.setState({ toast: null }), 1900);\n    };\n    const toggleTask = (id) => this.setState((s) => ({\n      checkedTasks: s.checkedTasks.includes(id) ? s.checkedTasks.filter((x) => x !== id) : [...s.checkedTasks, id],\n    }));\n\n    const navDefs = [\n      { key: \"events\", label: \"Events\", count: 8 },\n      { key: \"clients\", label: \"Clients\", count: 24 },\n      { key: \"technicians\", label: \"Technicians\", count: 12 },\n      { key: \"systems\", label: \"Systems\", count: 6 },\n      { key: \"cases\", label: \"Cases\", count: 18 },\n    ];\n    const nav = navDefs.map((n) => ({\n      label: n.label, count: n.count,\n      active: section === n.key, notActive: section !== n.key,\n      go: () => setSection(n.key),\n    }));\n\n    const statuses = [\n      { label: \"Confirmed\", dot: \"#2A6FDB\" },\n      { label: \"In prep\", dot: \"#FEBD17\" },\n      { label: \"On site\", dot: \"#16744B\" },\n      { label: \"Done\", dot: \"#6B6B70\" },\n    ];\n    const dotFor = (s) => (statuses.find((x) => x.label === s) || {}).dot || \"#9A9A96\";\n    const events = this.state.events.map((e) => ({ ...e, dot: dotFor(e.status), techLabel: e.techs ? e.techs + \" techs\" : \"Unstaffed\", open: openRecord, onDragStart: () => this.setState({ draggedId: e.id }) }));\n    const moveTo = (label) => this.setState((s) => ({ events: s.events.map((e) => (e.id === s.draggedId ? { ...e, status: label } : e)), draggedId: null }));\n    const columns = statuses.map((s) => {\n      const items = events.filter((e) => e.status === s.label);\n      return { label: s.label, dot: s.dot, count: items.length, items, drop: () => moveTo(s.label) };\n    });\n\n    const clients = [\n      { name: \"Stanley Park Brewing Co.\", events: 3, contact: \"Dana Whitfield\", status: \"Active\", dot: \"#16744B\" },\n      { name: \"Nike Jordan\", events: 6, contact: \"M. Alvarez\", status: \"Active\", dot: \"#16744B\" },\n      { name: \"Hennessy\", events: 1, contact: \"C. Dubois\", status: \"Inquiry\", dot: \"#9A9A96\" },\n      { name: \"Red Bull\", events: 4, contact: \"T. Hoffmann\", status: \"Active\", dot: \"#16744B\" },\n      { name: \"Samsung\", events: 2, contact: \"J. Lee\", status: \"Active\", dot: \"#16744B\" },\n      { name: \"Google\", events: 5, contact: \"P. Nair\", status: \"Active\", dot: \"#16744B\" },\n    ].map((c) => ({ ...c, open: openRecord }));\n\n    const technicians = [\n      { name: \"M. Okafor\", role: \"Lead technician\", base: \"Vancouver\", status: \"On event\", dot: \"#FEBD17\" },\n      { name: \"A. Reyes\", role: \"Technician\", base: \"Los Angeles\", status: \"Available\", dot: \"#16744B\" },\n      { name: \"J. Park\", role: \"Technician\", base: \"Seattle\", status: \"On event\", dot: \"#FEBD17\" },\n      { name: \"S. Nguyen\", role: \"AV engineer\", base: \"Vancouver\", status: \"Available\", dot: \"#16744B\" },\n      { name: \"D. Cole\", role: \"Technician\", base: \"Toronto\", status: \"Travel\", dot: \"#9A9A96\" },\n      { name: \"R. Mbeki\", role: \"Lead technician\", base: \"London\", status: \"Available\", dot: \"#16744B\" },\n    ].map((t) => ({ ...t, open: openRecord }));\n\n    const systems = [\n      { name: \"GRFT+ Wall v4\", type: \"4K wall\", status: \"Deployed\", service: \"May 2026\", dot: \"#FEBD17\" },\n      { name: \"GRFT+ Wall v4 · #2\", type: \"4K wall\", status: \"Available\", service: \"Apr 2026\", dot: \"#16744B\" },\n      { name: \"GRFT+ Wall v3\", type: \"HD wall\", status: \"Available\", service: \"Jan 2026\", dot: \"#16744B\" },\n      { name: \"Mini Wall\", type: \"Compact\", status: \"Deployed\", service: \"Mar 2026\", dot: \"#FEBD17\" },\n      { name: \"Dual Wall Rig\", type: \"2× 4K\", status: \"Available\", service: \"Feb 2026\", dot: \"#16744B\" },\n      { name: \"Legacy v2\", type: \"HD wall\", status: \"Retired\", service: \"—\", dot: \"#9A9A96\" },\n    ].map((s) => ({ ...s, open: () => flash(\"Opening \" + s.name + \" (demo)\") }));\n    const cases = [\n      { name: \"Case A · Wall\", contents: \"Panels, frame\", weight: \"48 kg\", status: \"Packed\" },\n      { name: \"Case B · Compute\", contents: \"Server, cabling\", weight: \"22 kg\", status: \"Packed\" },\n      { name: \"Case C · Cans\", contents: \"12 cans, chargers\", weight: \"14 kg\", status: \"Prep\" },\n      { name: \"Case D · AV\", contents: \"Projector, audio\", weight: \"30 kg\", status: \"Storage\" },\n      { name: \"Case E · Spares\", contents: \"Spare panels\", weight: \"18 kg\", status: \"Storage\" },\n    ].map((k) => ({ ...k, open: () => flash(\"Opening \" + k.name + \" (demo)\") }));\n    const tasksRaw = [\n      { task: \"Confirm power drop with venue\", event: \"Brewery Launch Party\", who: \"M. Okafor\", due: \"Jun 10\", status: \"Open\", dot: \"#9A9A96\" },\n      { task: \"Ship cases by Jun 10\", event: \"Brewery Launch Party\", who: \"Logistics\", due: \"Jun 10\", status: \"Open\", dot: \"#9A9A96\" },\n      { task: \"Chase signed SOW\", event: \"Unpacked Lounge\", who: \"P. Nair\", due: \"Jun 18\", status: \"Open\", dot: \"#9A9A96\" },\n      { task: \"Asset review\", event: \"All-Star Activation\", who: \"Design\", due: \"Jun 22\", status: \"In progress\", dot: \"#FEBD17\" },\n      { task: \"Book flights LAX→SFO\", event: \"All-Star Activation\", who: \"Travel\", due: \"Jun 24\", status: \"Open\", dot: \"#9A9A96\" },\n      { task: \"Recap video edit\", event: \"I/O Wall\", who: \"Post\", due: \"May 20\", status: \"Done\", dot: \"#16744B\" },\n    ];\n    const tasks = tasksRaw.map((t, i) => {\n      const checked = this.state.checkedTasks.includes(\"t\" + i);\n      return { ...t, checked, notChecked: !checked, toggle: () => toggleTask(\"t\" + i) };\n    });\n    const recTaskDefs = [\n      { label: \"Confirm power drop with venue\", meta: \"M. Okafor · Jun 10\" },\n      { label: \"Ship cases to venue\", meta: \"Logistics · Jun 10\" },\n      { label: \"Brief crew on brand assets\", meta: \"M. Okafor · Jun 13\" },\n    ];\n    const recTasks = recTaskDefs.map((t, i) => {\n      const checked = this.state.checkedTasks.includes(\"r\" + i);\n      return { ...t, checked, notChecked: !checked, toggle: () => toggleTask(\"r\" + i) };\n    });\n\n    return {\n      nav, columns, listEvents: events, clients, technicians, systems, cases, tasks, recTasks,\n      toast: this.state.toast, hasToast: !!this.state.toast,\n      newEvent: () => flash(\"New event form (demo)\"),\n      newClient: () => flash(\"New client form (demo)\"),\n      newTech: () => flash(\"New technician form (demo)\"),\n      newSystem: () => flash(\"New system form (demo)\"),\n      newCase: () => flash(\"New case form (demo)\"),\n      newTask: () => flash(\"New task (demo)\"),\n      filter: () => flash(\"Filters (demo)\"),\n      search: () => flash(\"Search (demo)\"),\n      edit: () => flash(\"Edit mode (demo)\"),\n      openAssets: () => flash(\"Opens the locked asset set in Asset Manager\"),\n      allowDrop: (e) => e.preventDefault(),\n      showEventsBoard: section === \"events\" && !open && layout === \"board\",\n      showEventsList: section === \"events\" && !open && layout === \"list\",\n      showEventRecord: section === \"events\" && open === \"record\",\n      showClientsList: section === \"clients\" && !open,\n      showClientRecord: section === \"clients\" && open === \"record\",\n      showTechList: section === \"technicians\" && !open,\n      showTechRecord: section === \"technicians\" && open === \"record\",\n      showSystems: section === \"systems\",\n      showCases: section === \"cases\",\n      showBoard: () => this.setState({ layout: \"board\" }),\n      showList: () => this.setState({ layout: \"list\" }),\n      back,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>","wireframes/Module 1 - Asset Manager.dc":"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0e82c085-d88f-4dc0-824e-48736273397b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n<x-dc>\n<helmet>\n  <style>/* Graffiti+ Design System — global entry point.\n   Consumers link this one file. Keep it as @import lines only. */\n/* Graffiti+ webfonts.\n   Source deck used Arial + Courier New; Archivo + Space Mono are the web-stack\n   equivalents — grotesk-display + mono-label split. Loaded from Google Fonts.\n   If you have licensed binaries, replace these @imports with local @font-face. */\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"ec3f715d-42c5-4603-843e-acc40f915c97\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"024ed27c-1ee2-4979-b9cd-13db \n\n/* Graffiti display face — big stat numbers + the occasional tagged word\n   (\"18 · 500+ · 6 · 2008\" on the homepage). The live site uses a custom\n   hand-drawn tag; Permanent Marker is the closest free stand-in.\n   SUBSTITUTION — replace with the licensed face if you have it. */\n/* latin */\n@font-face {\n  font-family: 'Permanent Marker';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"0f8cb675-3c11-49b6-b3de-54d2c195bd04\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n/* Graffiti+ colour system.\n   Rule: black ground, photography is the colour, yellow is a single accent — never a flood.\n   Ratio discipline ≈ 70% black ground / 25% ink + photo / 5% yellow. */\n:root {\n  /* — Dark surface (stage / hero / covers) — */\n  --gp-ground:        #0A0B0C; /* primary background on every surface */\n  --gp-ground-alt:    #000D10; /* deepest black, photo overlays */\n  --gp-ink:           #F4F4F2; /* primary type on dark */\n  --gp-ink-dim:       #E0E0DC; /* body / supporting copy on dark */\n  --gp-muted:         #9A9A96; /* secondary copy, second headline line */\n  --gp-mono-grey:     #8A8A86; /* eyebrow + metadata labels */\n  --gp-accent:        #FEBD17; /* signature yellow — rules, numerals, one word */\n  --gp-accent-deep:   #B07A00; /* dark-gold shadow / pressed / yellow text on light */\n  --gp-hairline:      rgba(244, 244, 242, 0.16); /* dividers, grid lines, borders */\n\n  /* — Light surface (long-form web, documents) — */\n  --gp-paper:         #FFFFFF; /* primary light ground */\n  --gp-paper-warm:    #FAF9F6; /* softer light ground, large fields */\n  --gp-ink-on-light:  #0A0B0C; /* headlines + primary type on light */\n  --gp-body:          #33333A; /* body copy on light */\n  --gp-muted-light:   #6B6B70; /* second headline line, secondary copy on light */\n  --gp-hairline-light: rgba(10, 11, 12, 0.12); /* dividers / grid lines on light */\n\n  /* — Photo scrim (directional, lands where copy sits) — */\n  --gp-scrim-strong:  rgba(10, 11, 12, 0.96);\n  --gp-scrim-soft:    rgba(10, 11, 12, 0.90);\n\n  /* — Semantic aliases — */\n  --surface:          var(--gp-ground);\n  --surface-light:    var(--gp-paper);\n  --text:             var(--gp-ink);\n  --text-light:       var(--gp-ink-on-light);\n  --text-muted:       var(--gp-muted);\n  --label:            var(--gp-mono-grey);\n  --accent:           var(--gp-accent);\n  --accent-text-light: var(--gp-accent-deep); /* yellow-toned text on light — never raw accent */\n  --rule:             var(--gp-hairline);\n  --rule-light:       var(--gp-hairline-light);\n}\n\n/* Graffiti+ typography.\n   Grotesk display (Archivo) + mono labels (Space Mono). Mono is for labels ONLY —\n   eyebrows, captions, stat tickers, metadata. Never body or headlines. */\n:root {\n  /* Families */\n  --gp-font-display: \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-body:    \"Manrope\", \"Helvetica Neue\", Arial, sans-serif;\n  --gp-font-mono:    \"Space Mono\", \"Courier New\", ui-monospace, monospace;\n  --gp-font-graffiti: \"Permanent Marker\", \"Comic Sans MS\", cursive; /* big stat numbers / tagged accents */\n\n  /* Weights — the live site sets headlines around bold, not black */\n  --gp-weight-body:    400;\n  --gp-weight-medium:  500;\n  --gp-weight-display: 700;\n  --gp-weight-black:   800;\n\n  /* Display metrics */\n  --gp-display-tracking: -0.01em; /* neutral grotesque needs little negative tracking */\n  --gp-display-leading:  0.92;    /* 0.84–0.98 */\n  --gp-body-leading:     1.5;     /* 1.3–1.5 */\n  --gp-mono-tracking:    0.18em;  /* 0.12–0.22em, UPPERCASE */\n\n  /* Fluid web scale — clamp(min, preferred, max), base 1rem = 16px */\n  --gp-hero:      clamp(3rem, 9vw, 7.5rem);        /* 900 */\n  --gp-title:     clamp(2rem, 5vw, 4rem);          /* 800 */\n  --gp-subhead:   clamp(1.4rem, 2.6vw, 2.25rem);   /* 800 */\n  --gp-body-size: clamp(1rem, 1.2vw, 1.25rem);     /* 400 */\n  --gp-stat:      clamp(2.75rem, 7vw, 6rem);       /* 900 */\n  --gp-eyebrow:   0.875rem;                          /* 0.8125–0.9375rem */\n\n  /* Slide scale (1920×1080, px) — 24px floor */\n  --gp-slide-hero:    185px;  /* 160–210 / 900 */\n  --gp-slide-title:   84px;   /* 72–96 / 800 */\n  --gp-slide-subhead: 38px;   /* 34–44 / 800 */\n  --gp-slide-body:    32px;   /* 28–38 / 400–500 */\n  --gp-slide-stat:    104px;  /* 88–120 / 900 */\n  --gp-slide-eyebrow: 24px;   /* 22–26 */\n}\n\n/* Graffiti+ spacing & layout.\n   Use these steps only. Hairline grids structure cells — borders divide, don't contain. */\n:root {\n  /* Spacing scale (rem) */\n  --gp-space-1:  0.5rem;\n  --gp-space-2:  0.75rem;\n  --gp-space-3:  1rem;\n  --gp-space-4:  1.5rem;\n  --gp-space-5:  2rem;\n  --gp-space-6:  3rem;\n  --gp-space-7:  4rem;\n  --gp-space-8:  6rem;\n  --gp-space-9:  8rem;\n\n  /* Section rhythm + measure */\n  --gp-section-pad:  clamp(4rem, 10vw, 9rem); /* vertical section padding */\n  --gp-content-max:  1240px;                  /* max content width */\n  --gp-gutter:       clamp(1.25rem, 5vw, 4rem);\n  --gp-measure:      70ch;                     /* body line length */\n\n  /* Slide canvas */\n  --gp-slide-w: 1920px;\n  --gp-slide-h: 1080px;\n  --gp-slide-pad: 80px 96px;\n\n  /* Radius — none / minimal. No rounded accent cards. */\n  --gp-radius: 0px;\n  --gp-radius-btn: 2px;\n\n  /* Border / hairline weight */\n  --gp-hairline-w: 1px;\n\n  /* Motion */\n  --gp-ease: cubic-bezier(0.2, 0.0, 0.0, 1.0);\n  --gp-dur-fast: 160ms;\n  --gp-dur: 200ms;\n  --gp-dur-reveal: 400ms;\n}\n\n<\u002Fstyle>\n  <style>\n    *{box-sizing:border-box}\n    body{margin:0;background:#e7e5df}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:#e7e5df;padding:40px;font-family:var(--gp-font-body)\">\n\n  <div style=\"max-width:1280px;margin:0 auto 22px\">\n    <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px\">\n      <a href=\"#/wireframes/Module 1 - Asset Manager.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2px;text-decoration:none;display:inline-block;background:#FEBD17;color:#0A0B0C;font-weight:700\">1 · Asset Manager<\u002Fa>\n      <a href=\"#/wireframes/Module 2 - Event Tracker.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2px;text-decoration:none;display:inline-block;background:#fff;color:#6B6B70;border:1px solid var(--gp-hairline-light)\">2 · Event Tracker<\u002Fa>\n      <a href=\"#/wireframes/Module 3 - Call Sheet.dc\" style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:2px;text-decoration:none;display:inline-block;background:#fff;color:#6B6B70;border:1px solid var(--gp-hairline-light)\">3 · Call Sheet<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-family:var(--gp-font-mono);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#B07A00;display:flex;align-items:center;gap:.6em;margin-bottom:10px\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block\"><\u002Fspan>Module 1 · Direction A · Client self-serve<\u002Fdiv>\n    <div style=\"font-family:var(--gp-font-mono);font-size:12px;letter-spacing:.04em;color:#6B6B70\">Clickable — use the left rail or Continue to walk all eight steps. Happy path.<\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- app frame -->\n  <div style=\"max-width:1280px;margin:0 auto;height:880px;background:#fff;border-radius:2px;box-shadow:0 1px 3px rgba(0,0,0,.10);overflow:hidden;display:flex;flex-direction:column;position:relative\">\n    <!-- app bar -->\n    <div style=\"height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#0A0B0C;border-bottom:1px solid rgba(244,244,242,0.14)\">\n      <div style=\"display:flex;align-items:center;gap:18px\">\n        <img src=\"420b16e2-8048-48d1-8517-4775abb833b4\" alt=\"GRFT+\" style=\"height:20px;filter:brightness(0) invert(1)\">\n        <span style=\"width:1px;height:22px;background:rgba(244,244,242,0.18);display:inline-block\"><\u002Fspan>\n        <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96\">Stanley Park Brewing · Client<\u002Fspan>\n      <\u002Fdiv>\n      <div onclick=\"{{saveExit}}\" style=\"display:flex;align-items:center;gap:14px;cursor:pointer\"><div style=\"width:26px;height:26px;border-radius:50%;background:#2a2c2f\"><\u002Fdiv><span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#C9C9C5\">Save &amp; exit<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;display:flex;min-height:0\">\n      <!-- rail -->\n      <div style=\"width:262px;flex:none;border-right:1px solid var(--gp-hairline-light);padding:22px 16px;background:#FAF9F6;display:flex;flex-direction:column;gap:2px\">\n        <sc-for list=\"{{steps}}\" as=\"step\" hint-placeholder-count=\"8\">\n          <sc-if value=\"{{step.active}}\" hint-placeholder-val=\"{{true}}\">\n            <div style=\"display:flex;align-items:center;gap:12px;padding:11px 8px;background:#fff;border:1px solid var(--gp-hairline-light);border-radius:2px\">\n              <span style=\"width:26px;height:26px;flex:none;border-radius:50%;background:#FEBD17;color:#0A0B0C;display:flex;align-items:center;justify-content:center;font-family:var(--gp-font-mono);font-size:12px\">{{step.n}}<\u002Fspan>\n              <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#0A0B0C;font-weight:700\">{{step.label}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{step.notActive}}\" hint-placeholder-val=\"{{false}}\">\n            <div onclick=\"{{step.go}}\" style=\"display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:2px;cursor:pointer\" style-hover=\"background:#fff\">\n              <sc-if value=\"{{step.done}}\" hint-placeholder-val=\"{{false}}\"><span style=\"width:26px;height:26px;flex:none;border-radius:50%;background:#0A0B0C;color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--gp-font-mono);font-size:12px\">✓<\u002Fspan><\u002Fsc-if>\n              <sc-if value=\"{{step.todo}}\" hint-placeholder-val=\"{{true}}\"><span style=\"width:26px;height:26px;flex:none;border-radius:50%;border:1px solid var(--gp-hairline-light);color:#9A9A96;display:flex;align-items:center;justify-content:center;font-family:var(--gp-font-mono);font-size:12px\">{{step.n}}<\u002Fspan><\u002Fsc-if>\n              <span style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#6B6B70\">{{step.label}}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-for>\n        <div style=\"margin-top:auto;height:6px;background:var(--gp-hairline-light);border-radius:3px;overflow:hidden\"><div style=\"width:{{pct}};height:100%;background:#FEBD17\"><\u002Fdiv><\u002Fdiv>\n        <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9A9A96;margin-top:8px\">{{pct}} complete<\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- canvas -->\n      <div style=\"flex:1;padding:30px 34px;min-width:0;overflow:auto\">\n\n        <!-- STEP 1 · WELCOME -->\n        <sc-if value=\"{{is1}}\" hint-placeholder-val=\"{{true}}\">\n          <div style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#B07A00;margin-bottom:10px;display:flex;align-items:center;gap:.6em\"><span style=\"width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block\"><\u002Fspan>Step 01 · First time here<\u002Fdiv>\n          <h2 style=\"font-family:var(--gp-font-display);font-weight:700;font-size:38px;letter-spacing:-0.02em;color:#0A0B0C;margin:0 0 16px;max-width:20ch\">Welcome. Let's build your wall.<\u002Fh2>\n          <p style=\"font-size:16px;line-height:1.6;color:#33333A;margin:0 0 14px;max-width:64ch\">You're setting up the interactive graffiti wall for the Brewery Launch Party. Everything your guests will paint with — your logo, your colors, your spray cans, your stencils — gets built right here, by you.<\u002Fp>\n          <p style=\"font-size:16px;line-height:1.6;color:#33333A;margin:0 0 26px;max-width:64ch\">It takes about ten minutes. Eight steps, in order. Nothing goes live until you approve it at the end, and you can jump back to any step before then. No design software, no back-and-forth — what you build is what lands on the wall.<\u002Fp>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:12px\">What we'll cover<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--gp-hairline-light);border:1px solid var(--gp-hairline-light);border-radius:2px;max-width:660px;margin-bottom:26px\">\n            <sc-for list=\"{{welcomeItems}}\" as=\"item\" hint-placeholder-count=\"7\">\n              <div onclick=\"{{item.go}}\" style=\"background:#fff;padding:15px 18px;display:flex;gap:14px;cursor:pointer;align-items:flex-start\" style-hover=\"background:#FAF9F6\">\n                <sc-if value=\"{{item.done}}\" hint-placeholder-val=\"{{false}}\"><span style=\"font-family:var(--gp-font-mono);font-size:13px;color:#16744B;flex:none;margin-top:1px\">✓<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{item.todo}}\" hint-placeholder-val=\"{{true}}\"><span style=\"font-family:var(--gp-font-mono);font-size:13px;color:#B07A00;flex:none\">{{item.n}}<\u002Fspan><\u002Fsc-if>\n                <div style=\"flex:1\"><div style=\"font-family:var(--gp-font-display);font-weight:700;font-size:15px;color:#0A0B0C;margin-bottom:3px\">{{item.label}}<\u002Fdiv><div style=\"font-family:var(--gp-font-body);font-size:13px;line-height:1.45;color:#6B6B70\">{{item.desc}}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px;max-width:660px;background:#FAF9F6;border:1px solid var(--gp-hairline-light);border-radius:2px;padding:14px 16px\">\n            <img src=\"8764f0d9-68bf-494f-a336-935bca8a45d2\" alt=\"Coney\" style=\"height:42px;width:auto;flex:none\">\n            <span style=\"font-family:var(--gp-font-body);font-size:14px;line-height:1.5;color:#33333A\">Stuck on anything, ask Coney in the corner. Hit <span style=\"font-weight:700\">Continue<\u002Fspan> when you're ready.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- STEP 2 · LOGO UPLOAD -->\n        <sc-if value=\"{{is2}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#B07A00;margin-bottom:8px\">Step 02<\u002Fdiv>\n          <h2 style=\"font-family:var(--gp-font-display);font-weight:700;font-size:30px;letter-spacing:-0.01em;color:#0A0B0C;margin:0 0 6px\">Logo upload<\u002Fh2>\n          <p style=\"font-size:14px;line-height:1.5;color:#6B6B70;margin:0 0 24px;max-width:62ch\">Upload one or more logos. We validate resolution, dimensions, transparency and format, and check vectors for embedded raster, unoutlined fonts and complex paths. Remove anything added by mistake.<\u002Fp>\n          <div style=\"border:2px dashed #c2bfb6;border-radius:3px;background:#FAF9F6;padding:40px;display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:24px\">\n            <div style=\"width:52px;height:52px;border-radius:50%;background:#ECEAE4;display:flex;align-items:center;justify-content:center;font-size:22px;color:#9A9A96\">↑<\u002Fdiv>\n            <div style=\"font-family:var(--gp-font-body);font-size:15px;color:#33333A\">Drop logos here, or <span style=\"color:#B07A00;border-bottom:2px solid #FEBD17\">browse<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex;gap:8px;align-items:center\"><span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#9A9A96\">PNG · SVG · AI · EPS<\u002Fspan><span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#0A0B0C;background:#FEBD17;border-radius:2px;padding:3px 8px\">Vector preferred<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:12px\">2 uploaded<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;border-top:1px solid var(--gp-hairline-light);padding:14px 0\">\n            <div style=\"width:48px;height:48px;flex:none;border-radius:2px;background:#ECEAE4\"><\u002Fdiv>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-family:var(--gp-font-mono);font-size:13px;color:#0A0B0C\">brewing-primary.svg<\u002Fdiv><div style=\"font-family:var(--gp-font-mono);font-size:11px;color:#9A9A96;margin-top:3px\">SVG · 1.2 MB · transparent<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#16744B;background:#E3F1EA;border-radius:2px;padding:6px 10px\">✓ Vector · fonts outlined<\u002Fspan>\n            <span style=\"width:28px;height:28px;flex:none;border-radius:2px;border:1px solid var(--gp-hairline-light);display:flex;align-items:center;justify-content:center;font-family:var(--gp-font-mono);font-size:15px;color:#9A9A96;cursor:pointer\" style-hover=\"color:#C7402F;border-color:#C7402F\">×<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:16px;border-top:1px solid var(--gp-hairline-light);padding:14px 0\">\n            <div style=\"width:48px;height:48px;flex:none;border-radius:2px;background:#ECEAE4\"><\u002Fdiv>\n            <div style=\"flex:1;min-width:0\"><div style=\"font-family:var(--gp-font-mono);font-size:13px;color:#0A0B0C\">brewing-mark.eps<\u002Fdiv><div style=\"font-family:var(--gp-font-mono);font-size:11px;color:#9A9A96;margin-top:3px\">EPS · vector · CMYK spot<\u002Fdiv><\u002Fdiv>\n            <span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:#16744B;background:#E3F1EA;border-radius:2px;padding:6px 10px\">✓ Print-ready<\u002Fspan>\n            <span style=\"width:28px;height:28px;flex:none;border-radius:2px;border:1px solid var(--gp-hairline-light);display:flex;align-items:center;justify-content:center;font-family:var(--gp-font-mono);font-size:15px;color:#9A9A96;cursor:pointer\" style-hover=\"color:#C7402F;border-color:#C7402F\">×<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- STEP 2 · COLOR MANAGEMENT -->\n        <sc-if value=\"{{is3}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#B07A00;margin-bottom:8px\">Step 03<\u002Fdiv>\n          <h2 style=\"font-family:var(--gp-font-display);font-weight:700;font-size:30px;letter-spacing:-0.01em;color:#0A0B0C;margin:0 0 6px\">Color management<\u002Fh2>\n          <p style=\"font-size:14px;line-height:1.5;color:#6B6B70;margin:0 0 24px;max-width:62ch\">Build the palette the wall will use. Add colors from an image, or enter them by hand in any format — we convert everything to HEX. Name, lock or remove each swatch.<\u002Fp>\n          <div style=\"display:flex;gap:36px\">\n            <!-- add colors -->\n            <div style=\"width:360px;flex:none;display:flex;flex-direction:column;gap:24px\">\n              <div>\n                <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:10px\">Add from image<\u002Fdiv>\n                <div style=\"border:2px dashed #c2bfb6;border-radius:3px;background:#FAF9F6;padding:22px;display:flex;flex-direction:column;align-items:center;gap:8px\">\n                  <div style=\"width:38px;height:38px;border-radius:50%;background:#ECEAE4;display:flex;align-items:center;justify-content:center;font-size:17px;color:#9A9A96\">↑<\u002Fdiv>\n                  <div style=\"font-family:var(--gp-font-body);font-size:13px;color:#33333A\">Drop an image to extract colors<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:10px\">Enter manually<\u002Fdiv>\n                <div style=\"display:flex;gap:8px;margin-bottom:10px\">\n                  <div style=\"width:108px;height:40px;border:1px solid var(--gp-hairline-light);border-radius:2px;background:#FAF9F6;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-family:var(--gp-font-mono);font-size:11px;color:#6B6B70\">HEX <span style=\"color:#9A9A96\">▾<\u002Fspan><\u002Fdiv>\n                  <div style=\"flex:1;height:40px;border:1px solid var(--gp-hairline-light);border-radius:2px;background:#fff;display:flex;align-items:center;padding:0 10px;font-family:var(--gp-font-mono);font-size:12px;color:#0A0B0C\">#C7402F<\u002Fdiv>\n                  <div style=\"width:40px;height:40px;border-radius:2px;background:#C7402F;flex:none\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;color:#9A9A96\">Formats: HEX · RGB · CMYK · Pantone — all converted to HEX<\u002Fdiv>\n                <div style=\"height:42px;margin-top:14px;border:1px solid #0A0B0C;border-radius:2px;display:flex;align-items:center;justify-content:center;font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#0A0B0C\">+ Add to palette<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <!-- palette -->\n            <div style=\"flex:1;min-width:0\">\n              <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:6px\">Your palette · 5 colors<\u002Fdiv>\n              <sc-for list=\"{{palette}}\" as=\"c\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex;align-items:center;gap:14px;border-top:1px solid var(--gp-hairline-light);padding:12px 0\">\n                  <div style=\"width:30px;height:30px;border-radius:2px;background:{{c.hex}};flex:none\"><\u002Fdiv>\n                  <span style=\"flex:1;font-family:var(--gp-font-body);font-size:14px;color:#0A0B0C\">{{c.name}}<\u002Fspan>\n                  <span style=\"font-family:var(--gp-font-mono);font-size:11px;color:#9A9A96\">{{c.hex}}<\u002Fspan>\n                  <sc-if value=\"{{c.locked}}\" hint-placeholder-val=\"{{true}}\"><span onclick=\"{{c.toggleLock}}\" style=\"font-family:var(--gp-font-mono);font-size:12px;color:#0A0B0C;cursor:pointer\">🔒<\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{c.unlocked}}\" hint-placeholder-val=\"{{false}}\"><span onclick=\"{{c.toggleLock}}\" style=\"font-family:var(--gp-font-mono);font-size:12px;color:#9A9A96;cursor:pointer\">🔓<\u002Fspan><\u002Fsc-if>\n                  <span onclick=\"{{c.remove}}\" style=\"font-family:var(--gp-font-mono);font-size:15px;color:#9A9A96;cursor:pointer\" style-hover=\"color:#C7402F\">×<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <!-- STEP 3 · SPRAY CAN DESIGNER -->\n        <sc-if value=\"{{is4}}\" hint-placeholder-val=\"{{false}}\">\n          <div style=\"font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#B07A00;margin-bottom:8px\">Step 04<\u002Fdiv>\n          <h2 style=\"font-family:var(--gp-font-display);font-weight:700;font-size:30px;letter-spacing:-0.01em;color:#0A0B0C;margin:0 0 6px\">Spray can label<\u002Fh2>\n          <p style=\"font-size:14px;line-height:1.5;color:#6B6B70;margin:0 0 22px;max-width:62ch\">Design the label that wraps each spray can — artwork, color, gradient, then position. Cans come in two sizes: regular, with kids optional.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap\">\n            <span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96\">Can size<\u002Fspan>\n            <div style=\"display:inline-flex;border:1px solid var(--gp-hairline-light);border-radius:2px;overflow:hidden\">\n              <sc-for list=\"{{canSizes}}\" as=\"o\" hint-placeholder-count=\"2\">\n                <sc-if value=\"{{o.active}}\" hint-placeholder-val=\"{{true}}\"><span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#0A0B0C;background:#FEBD17;padding:9px 14px;font-weight:700;cursor:pointer;border-left:1px solid var(--gp-hairline-light)\">{{o.label}}<\u002Fspan><\u002Fsc-if>\n                <sc-if value=\"{{o.notActive}}\" hint-placeholder-val=\"{{false}}\"><span onclick=\"{{o.go}}\" style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#6B6B70;padding:9px 14px;border-left:1px solid var(--gp-hairline-light);cursor:pointer\" style-hover=\"color:#0A0B0C\">{{o.label}}<\u002Fspan><\u002Fsc-if>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;color:#9A9A96\">Add the kids size only if you want a smaller can on the floor<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:28px\">\n            <div style=\"width:348px;flex:none;display:flex;flex-direction:column;gap:22px\">\n              <!-- 1 artwork -->\n              <div>\n                <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:10px\">1 · Artwork<\u002Fdiv>\n                <div style=\"display:inline-flex;border:1px solid var(--gp-hairline-light);border-radius:2px;overflow:hidden;margin-bottom:12px\">\n                  <sc-for list=\"{{artSources}}\" as=\"o\" hint-placeholder-count=\"3\">\n                    <sc-if value=\"{{o.active}}\" hint-placeholder-val=\"{{true}}\"><span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#0A0B0C;background:#FEBD17;padding:8px 12px;font-weight:700;cursor:pointer;border-left:1px solid var(--gp-hairline-light)\">{{o.label}}<\u002Fspan><\u002Fsc-if>\n                    <sc-if value=\"{{o.notActive}}\" hint-placeholder-val=\"{{false}}\"><span onclick=\"{{o.go}}\" style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:#6B6B70;padding:8px 12px;border-left:1px solid var(--gp-hairline-light);cursor:pointer\" style-hover=\"color:#0A0B0C\">{{o.label}}<\u002Fspan><\u002Fsc-if>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:10px;margin-bottom:8px\">\n                  <sc-for list=\"{{artThumbs}}\" as=\"th\" hint-placeholder-count=\"2\">\n                    <sc-if value=\"{{th.selected}}\" hint-placeholder-val=\"{{true}}\"><div onclick=\"{{th.pick}}\" style=\"width:60px;height:60px;border-radius:2px;background:#ECEAE4;border:2px solid #FEBD17;cursor:pointer\"><\u002Fdiv><\u002Fsc-if>\n                    <sc-if value=\"{{th.notSelected}}\" hint-placeholder-val=\"{{false}}\"><div onclick=\"{{th.pick}}\" style=\"width:60px;height:60px;border-radius:2px;background:#ECEAE4;border:2px solid transparent;cursor:pointer\" style-hover=\"border-color:#c2bfb6\"><\u002Fdiv><\u002Fsc-if>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;color:#9A9A96\">Full wrap requires 2480 × 1040 px @ 300 dpi<\u002Fdiv>\n              <\u002Fdiv>\n              <!-- 2 can color -->\n              <div style=\"border-top:1px solid var(--gp-hairline-light);padding-top:18px\">\n                <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:10px\">2 · Can color<\u002Fdiv>\n                <div style=\"display:flex;gap:10px;align-items:center\">\n                  <sc-for list=\"{{canPalette}}\" as=\"o\" hint-placeholder-count=\"5\">\n                    <sc-if value=\"{{o.selected}}\" hint-placeholder-val=\"{{false}}\"><div onclick=\"{{o.pick}}\" style=\"width:34px;height:34px;border-radius:50%;background:{{o.hex}};outline:2px solid #0A0B0C;outline-offset:2px;cursor:pointer\"><\u002Fdiv><\u002Fsc-if>\n                    <sc-if value=\"{{o.notSelected}}\" hint-placeholder-val=\"{{true}}\"><div onclick=\"{{o.pick}}\" style=\"width:34px;height:34px;border-radius:50%;background:{{o.hex}};cursor:pointer\"><\u002Fdiv><\u002Fsc-if>\n                  <\u002Fsc-for>\n                  <div onclick=\"{{browseFiles}}\" style=\"width:34px;height:34px;border-radius:50%;border:1px dashed #c2bfb6;display:flex;align-items:center;justify-content:center;color:#9A9A96;font-size:16px;cursor:pointer\">+<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;color:#9A9A96;margin-top:8px\">From palette, or + a new color<\u002Fdiv>\n              <\u002Fdiv>\n              <!-- 3 gradient -->\n              <div style=\"border-top:1px solid var(--gp-hairline-light);padding-top:18px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px\"><span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96\">3 · Gradient<\u002Fspan>\n                  <sc-if value=\"{{gradientOn}}\" hint-placeholder-val=\"{{true}}\"><span onclick=\"{{toggleGradient}}\" style=\"width:32px;height:18px;border-radius:9px;background:#FEBD17;position:relative;cursor:pointer\"><span style=\"position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#0A0B0C\"><\u002Fspan><\u002Fspan><\u002Fsc-if>\n                  <sc-if value=\"{{gradientOff}}\" hint-placeholder-val=\"{{false}}\"><span onclick=\"{{toggleGradient}}\" style=\"width:32px;height:18px;border-radius:9px;background:#e2dfd8;position:relative;cursor:pointer\"><span style=\"position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,0.2)\"><\u002Fspan><\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{gradientOn}}\" hint-placeholder-val=\"{{true}}\"><div style=\"height:30px;border-radius:2px;background:linear-gradient(90deg,#FEBD17,#C7402F);margin-bottom:10px\"><\u002Fdiv><\u002Fsc-if>\n                <div style=\"display:flex;gap:10px;align-items:center\"><div style=\"width:26px;height:26px;border-radius:50%;background:#FEBD17;border:1px solid #d8d5cd\"><\u002Fdiv><span style=\"font-family:var(--gp-font-mono);font-size:10px;color:#9A9A96\">→<\u002Fspan><div style=\"width:26px;height:26px;border-radius:50%;background:#C7402F;border:1px solid #d8d5cd\"><\u002Fdiv><span style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.04em;color:#9A9A96;margin-left:6px\">Palette or new colors<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <!-- 4 placement (last, sliders) -->\n              <div style=\"border-top:1px solid var(--gp-hairline-light);padding-top:18px\">\n                <div style=\"font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#9A9A96;margin-bottom:14px\">4 · Placement<\u002Fdiv>\n                <div style=\"margin-bottom:14px\"><div style=\"display:flex;justify-content:space-between;font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#9A9A96;margin-bottom:7px\"><span>Horizontal<\u002Fspan><span>42%<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:3px;background:#e2dfd8;position:relative\"><div style=\"position:absolute;left:42%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#0A0B0C\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div style=\"margin-bottom:14px\"><div style=\"display:flex;justify-content:space-between;font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#9A9A96;margin-bottom:7px\"><span>Vertical<\u002Fspan><span>60%<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:3px;background:#e2dfd8;position:relative\"><div style=\"position:absolute;left:60%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#0A0B0C\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div style=\"margin-bottom:14px\"><div style=\"display:flex;justify-content:space-between;font-family:var(--gp-font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:#9A9A96;margin-bottom:7px\"><span>Scale<\u002Fspan><span>78%<\u002Fspan><\u002Fdiv><div style=\"height:6px;border-radius:3px;background:#e2dfd8;position:relative\"><div style=\"position:absolute;left:78%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:#0A0B0C\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n                <div><div s
