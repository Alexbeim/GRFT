<!-- @dsCard group="Components" viewport="700x280" subtitle="Graffiti-number stat row + logo wall — proof, not bullets" name="Stat row + Logo wall" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:#FFFFFF;padding:30px 40px;color:#0A0B0C;display:flex;flex-direction:column;gap:34px}
  .row{display:grid;grid-template-columns:repeat(4,1fr)}
  .stat{display:flex;flex-direction:column;gap:12px;padding-right:22px;border-right:1px solid var(--gp-hairline-light)}
  .stat:last-child{border-right:none}
  .stat:not(:first-child){padding-left:22px}
  .fig{font-family:var(--gp-font-graffiti);font-size:52px;line-height:1}
  .unit{font-family:var(--gp-font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6B6B70}
  .lbl{font-family:var(--gp-font-mono);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#8A8A86;margin-bottom:16px}
  .wall{display:flex;flex-wrap:wrap;gap:14px 40px}
  .wall span{font-family:var(--gp-font-mono);font-size:18px;letter-spacing:.06em;color:#6B6B70}
</style></head>
<body>
  <div class="row">
    <div class="stat"><span class="fig">18</span><span class="unit">Years</span></div>
    <div class="stat"><span class="fig">500+</span><span class="unit">Activations</span></div>
    <div class="stat"><span class="fig">6</span><span class="unit">Continents</span></div>
    <div class="stat"><span class="fig">2008</span><span class="unit">Vancouver, BC</span></div>
  </div>
  <div>
    <div class="lbl">Trusted by world-class brands</div>
    <div class="wall"><span>NIKE</span><span>ADIDAS</span><span>JORDAN</span><span>PORSCHE</span><span>SAMSUNG</span><span>GOOGLE</span><span>DISNEY</span><span>CHANEL</span></div>
  </div>
</body></html>
