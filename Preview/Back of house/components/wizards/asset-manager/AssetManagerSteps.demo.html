<script type="text/plain" id="src-step5">
import React, { useState, useRef, useCallback, useEffect } from "react";

/**
 * Asset Manager — Step 5: Asset builder.
 * Three libraries (stencils / stickers / backgrounds): premade items plus the
 * client's own creations, multi-selected onto the wall from one grid per tab.
 *
 * "Upload & convert" opens a guided maker that walks the client through turning
 * any image into a production-ready asset, entirely client-side (canvas):
 *   - Stencil → 1024×1024 PNG, artwork becomes the TRANSPARENT paintable cut-out,
 *     everything else is the opaque sheet. Threshold + invert controls.
 *   - Sticker → 1024×1024 transparent PNG: background removed (from alpha if the
 *     upload has it, else edge flood-fill with a tolerance slider), then a small
 *     white die-cut padding ring + micro drop shadow are added automatically.
 *   - Background → cover-cropped to the 16:9 wall.
 * "Make with AI" is a placeholder panel for now — prompt UI, disabled generate.
 *
 * Exported asset `src` values are data: URLs — the host app should upload them to
 * real storage on save (see onChange). Fully standalone — no wizard shell.
 */

const FONT_MONO = "var(--gp-font-mono, 'Space Mono', 'Courier New', monospace)";
const FONT_BODY = "var(--gp-font-body, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const FONT_DISPLAY = "var(--gp-font-display, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const YELLOW = "#FEBD17";
const INK = "#0A0B0C";
const HAIRLINE = "var(--gp-hairline-light, rgba(10,11,12,0.12))";
const MUTED = "#9A9A96";

const ASSET_SIZE = 1024;              // stencils + stickers export at 1024×1024
const BG_W = 1920, BG_H = 1080;       // backgrounds export at the 16:9 wall aspect

const CHECKERBOARD = {
  backgroundColor: "#fff",
  backgroundImage:
    "linear-gradient(45deg, #e2dfd8 25%, transparent 25%), linear-gradient(-45deg, #e2dfd8 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e2dfd8 75%), linear-gradient(-45deg, transparent 75%, #e2dfd8 75%)",
  backgroundSize: "16px 16px",
  backgroundPosition: "0 0, 0 8px, 8px -8px, -8px 0px",
};

// Dark wall + spray blobs — placed BEHIND a stencil PNG so its transparent
// cut-outs read as "this is where the paint lands."
const PAINT_BEHIND = {
  background:
    "radial-gradient(circle at 35% 38%, #FEBD17 0%, rgba(254,189,23,0) 52%), radial-gradient(circle at 68% 62%, #E85D9A 0%, rgba(232,93,154,0) 55%), #1a1c1f",
};

/* ---------------------------------------------------------------- premade art
   Placeholder libraries, generated as inline SVG data URLs so every tile is a
   real image following the same conventions as converted uploads (stencils:
   opaque sheet + transparent cut-out; stickers: white edge + soft shadow).
   Swap for the real installation libraries when they exist. */

function svgUrl(inner, w, h) {
  return (
    "data:image/svg+xml;utf8," +
    encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w || ASSET_SIZE} ${h || ASSET_SIZE}">${inner}</svg>`)
  );
}

function starPts(cx, cy, R, r, n) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const rad = i % 2 === 0 ? R : r;
    const a = (Math.PI / n) * i - Math.PI / 2;
    pts.push(`${(cx + rad * Math.cos(a)).toFixed(1)},${(cy + rad * Math.sin(a)).toFixed(1)}`);
  }
  return pts;
}
function toPath(pts) { return "M" + pts.join("L") + "Z"; }

const HEART_PATH = "M512,880C240,660 96,470 96,320C96,180 205,88 322,88C402,88 478,140 512,224C546,140 622,88 702,88C819,88 928,180 928,320C928,470 784,660 512,880Z";
const STENCIL_SHAPES = [
  { id: "st-star", name: "Star", path: toPath(starPts(512, 532, 420, 176, 5)) },
  { id: "st-heart", name: "Heart", path: HEART_PATH },
  { id: "st-bolt", name: "Bolt", path: toPath(["600,64", "252,568", "462,568", "380,960", "780,420", "560,420", "704,64"]) },
  { id: "st-arrow", name: "Arrow", path: toPath(["104,420", "580,420", "580,248", "920,512", "580,776", "580,604", "104,604"]) },
  { id: "st-crown", name: "Crown", path: toPath(["140,772", "140,340", "336,540", "512,264", "688,540", "884,340", "884,772"]) },
  { id: "st-circle", name: "Ring", path: "M512,132A380,380 0 1 0 512.01,132Z M512,320A192,192 0 1 1 511.99,320Z" },
  { id: "st-diamond", name: "Diamond", path: toPath(["512,96", "912,512", "512,928", "112,512"]) },
  { id: "st-cross", name: "Cross", path: toPath(["388,120", "636,120", "636,388", "904,388", "904,636", "636,636", "636,904", "388,904", "388,636", "120,636", "120,388", "388,388"]) },
];
const PREMADE_STENCILS = STENCIL_SHAPES.map((s) => ({
  id: s.id, name: s.name, type: "stencils", origin: "premade",
  src: svgUrl(`<path d="M0,0H1024V1024H0Z ${s.path}" fill="#0A0B0C" fill-rule="evenodd"/>`),
}));

const STICKER_FILTER = `<filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity="0.28"/></filter>`;
function stickerSvg(inner) { return svgUrl(`${STICKER_FILTER}<g filter="url(#sh)">${inner}</g>`); }
const PREMADE_STICKERS = [
  { id: "sk-star", name: "Star pop", fill: "#FEBD17", path: toPath(starPts(512, 532, 400, 168, 5)) },
  { id: "sk-heart", name: "Heart", fill: "#E0362C", path: HEART_PATH },
  { id: "sk-bolt", name: "Bolt", fill: "#2660C4", path: toPath(["600,84", "268,568", "468,568", "390,940", "768,428", "560,428", "700,84"]) },
  { id: "sk-flower", name: "Flower", fill: "#E85D9A", path: [0, 1, 2, 3, 4, 5].map((i) => { const a = (Math.PI / 3) * i; const x = 512 + 240 * Math.cos(a), y = 500 + 240 * Math.sin(a); return `M${x},${y}m-190,0a190,190 0 1,0 380,0a190,190 0 1,0 -380,0`; }).join(" ") + ` M512,500m-170,0a170,170 0 1,0 340,0a170,170 0 1,0 -340,0` },
  { id: "sk-smile", name: "Smiley", fill: "#FEBD17", path: "M512,92A420,420 0 1 0 512.01,92Z", extra: `<circle cx="380" cy="420" r="52" fill="#0A0B0C"/><circle cx="644" cy="420" r="52" fill="#0A0B0C"/><path d="M330,610Q512,780 694,610" stroke="#0A0B0C" stroke-width="46" fill="none" stroke-linecap="round"/>` },
  { id: "sk-diamond", name: "Gem", fill: "#1FA588", path: toPath(["512,110", "900,512", "512,914", "124,512"]) },
  { id: "sk-peace", name: "Peace", fill: "#0A0B0C", path: "M512,92A420,420 0 1 0 512.01,92Z", extra: `<g stroke="#fff" stroke-width="52" fill="none"><line x1="512" y1="130" x2="512" y2="894"/><line x1="512" y1="512" x2="262" y2="762"/><line x1="512" y1="512" x2="762" y2="762"/><circle cx="512" cy="512" r="330"/></g>` },
  { id: "sk-fresh", name: "Fresh tag", fill: "#0A0B0C", path: "M132,382h760a60,60 0 0 1 60,60v140a60,60 0 0 1-60,60H132a60,60 0 0 1-60-60V442a60,60 0 0 1 60-60Z", extra: `<text x="512" y="548" font-family="'Courier New',monospace" font-size="150" font-weight="700" text-anchor="middle" fill="#FEBD17" letter-spacing="8">FRESH</text>` },
].map((s) => ({
  id: s.id, name: s.name, type: "stickers", origin: "premade",
  src: stickerSvg(`<path d="${s.path}" fill="${s.fill}" stroke="#fff" stroke-width="30" stroke-linejoin="round"/>${s.extra || ""}`),
}));

const PREMADE_BACKGROUNDS = [
  { id: "bg-brick", name: "Brick wall", inner: `<rect width="1920" height="1080" fill="#8a4a3b"/>${Array.from({ length: 10 }, (_, r) => Array.from({ length: 9 }, (_, c) => `<rect x="${c * 220 + (r % 2 ? -110 : 0)}" y="${r * 112}" width="208" height="100" rx="4" fill="#a05744"/>`).join("")).join("")}` },
  { id: "bg-concrete", name: "Concrete", inner: `<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2"/><feColorMatrix type="matrix" values="0 0 0 0 0.62 0 0 0 0 0.62 0 0 0 0 0.6 0 0 0 0.5 0.3"/></filter><rect width="1920" height="1080" fill="#9b9b96"/><rect width="1920" height="1080" filter="url(#n)"/>` },
  { id: "bg-sunset", name: "Sunset wash", inner: `<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b1a4d"/><stop offset="0.55" stop-color="#c4356b"/><stop offset="1" stop-color="#FEBD17"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#g)"/>` },
  { id: "bg-halftone", name: "Halftone", inner: `<rect width="1920" height="1080" fill="#111317"/>${Array.from({ length: 14 }, (_, r) => Array.from({ length: 24 }, (_, c) => `<circle cx="${c * 80 + 40}" cy="${r * 80 + 40}" r="${(4 + ((r + c) % 6) * 4.4).toFixed(1)}" fill="#2e3138"/>`).join("")).join("")}` },
  { id: "bg-stripes", name: "Stripes", inner: `<rect width="1920" height="1080" fill="#F4F1EA"/>${Array.from({ length: 16 }, (_, i) => `<rect x="${i * 240 - 500}" y="-200" width="90" height="1600" fill="${i % 3 === 0 ? "#FEBD17" : i % 3 === 1 ? "#0A0B0C" : "#DAD5C8"}" transform="rotate(18 960 540)"/>`).join("")}` },
  { id: "bg-night", name: "Night wall", inner: `<defs><radialGradient id="v" cx="0.5" cy="0.42" r="0.75"><stop offset="0" stop-color="#2a2d33"/><stop offset="1" stop-color="#0c0d10"/></radialGradient></defs><rect width="1920" height="1080" fill="url(#v)"/>` },

/* ------------------------------------------------------------- image helpers */

function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("image failed to load"));
    img.src = src;
  });
}

// Draw `img` contained + centered into a size×size canvas with a margin
// fraction, and return {canvas, ctx}.
function containDraw(img, size, margin) {
  const cv = document.createElement("canvas");
  cv.width = size; cv.height = size;
  const ctx = cv.getContext("2d");
  const box = size * (1 - margin * 2);
  const scale = Math.min(box / img.naturalWidth, box / img.naturalHeight);
  const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
  const x = (size - w) / 2, y = (size - h) / 2;
  ctx.drawImage(img, x, y, w, h);
  return { cv, ctx, rect: { x0: Math.max(0, Math.floor(x)), y0: Math.max(0, Math.floor(y)), x1: Math.min(size - 1, Math.ceil(x + w) - 1), y1: Math.min(size - 1, Math.ceil(y + h) - 1) } };
}

function imgHasAlpha(img) {
  const N = 64;
  const cv = document.createElement("canvas");
  cv.width = N; cv.height = N;
  const ctx = cv.getContext("2d");
  ctx.drawImage(img, 0, 0, N, N);
  const d = ctx.getImageData(0, 0, N, N).data;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) return true;
  return false;
}

/* Stencil: artwork pixels (dark by default, flipped by `invert`) become fully
   TRANSPARENT — the paintable cut-out — everything else becomes the opaque
   ink-colored sheet. Only the alpha channel matters to the paint engine. */
function makeStencilDataUrl(img, { threshold, invert }) {
  const { cv, ctx } = containDraw(img, ASSET_SIZE, 0.07);
  const id = ctx.getImageData(0, 0, ASSET_SIZE, ASSET_SIZE);
  const d = id.data;
  const cut = (threshold / 100) * 255;
  for (let i = 0; i < d.length; i += 4) {
    const isArt = d[i + 3] >= 60 && ((0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2] < cut) !== invert);
    if (isArt) {
      d[i + 3] = 0;
    } else {
      d[i] = 10; d[i + 1] = 11; d[i + 2] = 12; d[i + 3] = 255;
    }
  }
  ctx.putImageData(id, 0, 0);
  return cv.toDataURL("image/png");
}

// Remove the background by flood-filling inward from the border of the DRAWN
// image rectangle (the canvas margin around it is already transparent, so
// seeding from the canvas edge would stall there and never reach the image).
// Clears anything within `tolerance` color distance of the seeding border
// pixel's color; already-transparent pixels pass the flood through.
function floodRemoveBackground(ctx, size, tolerance, rect) {
  const { x0, y0, x1, y1 } = rect;
  const id = ctx.getImageData(0, 0, size, size);
  const d = id.data;
  const tol2 = Math.pow((tolerance / 100) * 150, 2);
  const visited = new Uint8Array(size * size);
  const stack = [];
  const push = (x, y, r, g, b) => {
    if (x < x0 || x > x1 || y < y0 || y > y1) return;
    const p = y * size + x;
    if (visited[p]) return;
    const i = p * 4;
    if (d[i + 3] >= 10) {
      const dr = d[i] - r, dg = d[i + 1] - g, db = d[i + 2] - b;
      if (dr * dr + dg * dg + db * db > tol2) return;
      d[i + 3] = 0;
    }
    visited[p] = 1;
    stack.push(x, y, r, g, b);
  };
  const seed = (x, y) => {
    const i = (y * size + x) * 4;
    push(x, y, d[i], d[i + 1], d[i + 2]);
  };
  for (let x = x0; x <= x1; x++) { seed(x, y0); seed(x, y1); }
  for (let y = y0; y <= y1; y++) { seed(x0, y); seed(x1, y); }
  while (stack.length) {
    const b = stack.pop(), g = stack.pop(), r = stack.pop(), y = stack.pop(), x = stack.pop();
    push(x - 1, y, r, g, b);
    push(x + 1, y, r, g, b);
    push(x, y - 1, r, g, b);
    push(x, y + 1, r, g, b);
  }
  ctx.putImageData(id, 0, 0);
}

// Tint every opaque pixel of `srcCv` a flat color (for building the white
// die-cut ring and the shadow silhouette).
function tinted(srcCv, color) {
  const cv = document.createElement("canvas");
  cv.width = srcCv.width; cv.height = srcCv.height;
  const ctx = cv.getContext("2d");
  ctx.drawImage(srcCv, 0, 0);
  ctx.globalCompositeOperation = "source-in";
  ctx.fillStyle = color;
  ctx.fillRect(0, 0, cv.width, cv.height);
  return cv;
}

// Cheap dilation: stamp the silhouette around a circle of radius `r`.
function dilate(silhouetteCv, r) {
  const cv = document.createElement("canvas");
  cv.width = silhouetteCv.width; cv.height = silhouetteCv.height;
  const ctx = cv.getContext("2d");
  for (const radius of [r, r * 0.66, r * 0.33]) {
    const steps = Math.max(12, Math.ceil(radius * 2.5));
    for (let i = 0; i < steps; i++) {
      const a = (Math.PI * 2 * i) / steps;
      ctx.drawImage(silhouetteCv, Math.cos(a) * radius, Math.sin(a) * radius);
    }
  }
  ctx.drawImage(silhouetteCv, 0, 0);
  return cv;
}

/* Sticker: (optional) background removal, then white die-cut padding ring and
   a micro drop shadow, centered in a transparent 1024×1024 PNG. */
function makeStickerDataUrl(img, { removeBg, tolerance, padding, shadow }) {
  const margin = 0.06 + (padding + 18) / ASSET_SIZE;
  const { cv: art, ctx: artCtx, rect } = containDraw(img, ASSET_SIZE, margin);
  if (removeBg) floodRemoveBackground(artCtx, ASSET_SIZE, tolerance, rect);

  const whiteRing = dilate(tinted(art, "#ffffff"), padding);
  const out = document.createElement("canvas");
  out.width = ASSET_SIZE; out.height = ASSET_SIZE;
  const ctx = out.getContext("2d");
  if (shadow) {
    const shadowSil = tinted(whiteRing, "#000000");
    ctx.save();
    ctx.filter = "blur(7px)";
    ctx.globalAlpha = 0.3;
    ctx.drawImage(shadowSil, 0, 7);
    ctx.restore();
  }
  ctx.drawImage(whiteRing, 0, 0);
  ctx.drawImage(art, 0, 0);
  return out.toDataURL("image/png");
}

// Background: cover-crop into the 16:9 wall frame.
function makeBackgroundDataUrl(img) {
  const cv = document.createElement("canvas");
  cv.width = BG_W; cv.height = BG_H;
  const ctx = cv.getContext("2d");
  const scale = Math.max(BG_W / img.naturalWidth, BG_H / img.naturalHeight);
  const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
  ctx.drawImage(img, (BG_W - w) / 2, (BG_H - h) / 2, w, h);
  return cv.toDataURL("image/jpeg", 0.9);
}

function useToast() {
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);
  const flash = useCallback((msg) => {
    setToast(msg);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setToast(null), 2100);
  }, []);
  return [toast, flash];
}

/* Guided maker: Upload → Adjust → Review (backgrounds skip Adjust). All
   processing is live and client-side; the result the client approves is
   byte-for-byte what gets added to the library. */
function MakerModal({ type, onClose, onAdd }) {
  const steps = type === "backgrounds" ? ["Upload", "Review"] : ["Upload", "Adjust", "Review"];
  const [stepIdx, setStepIdx] = useState(0);
  const [img, setImg] = useState(null);
  const [hasAlpha, setHasAlpha] = useState(false);
  const [name, setName] = useState("");
  const [params, setParams] = useState({ threshold: 55, invert: false, removeBg: false, tolerance: 40, padding: 10, shadow: true });
  const [resultUrl, setResultUrl] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const inputRef = useRef(null);
  const copy = MAKER_COPY[type];
  const isAdjust = steps[stepIdx] === "Adjust";
  const isReview = steps[stepIdx] === "Review";

  const acceptFile = async (file) => {
    if (!file) return;
    try {
      const url = URL.createObjectURL(file);
      const el = await loadImageEl(url);
      const alpha = imgHasAlpha(el);
      setImg(el);
      setHasAlpha(alpha);
      setParams((p) => ({ ...p, removeBg: type === "stickers" && !alpha }));
      setName(file.name.replace(/\.[^.]+$/, ""));
      setStepIdx(1);
    } catch (e) {
      setResultUrl(null);
    }
  };

  // Recompute the preview whenever the image or its settings change (debounced
  // — the pixel passes are fast but slider drags fire continuously).
  useEffect(() => {
    if (!img) return;
    const t = setTimeout(() => {
      if (type === "stencils") setResultUrl(makeStencilDataUrl(img, params));
      else if (type === "stickers") setResultUrl(makeStickerDataUrl(img, params));
      else setResultUrl(makeBackgroundDataUrl(img));
    }, 120);
    return () => clearTimeout(t);
  }, [img, params, type]);

  const previewFrame = (url) => {
    if (type === "stencils") {
      return (
        <div style={{ position: "relative", aspectRatio: "1", borderRadius: 3, overflow: "hidden", ...PAINT_BEHIND }}>
          {url && <img src={url} alt="stencil preview" style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />}
        </div>
      );
    }
    if (type === "stickers") {
      return (
        <div style={{ position: "relative", aspectRatio: "1", borderRadius: 3, overflow: "hidden", ...CHECKERBOARD }}>
          {url && <img src={url} alt="sticker preview" style={{ position: "absolute", inset: 0, width: "100%", height: "100%" }} />}
        </div>
      );
    }
    return (
      <div style={{ position: "relative", aspectRatio: "16/9", borderRadius: 3, overflow: "hidden", background: "#111" }}>
        {url && <img src={url} alt="background preview" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />}
      </div>
    );
  };

  return (
    <div style={{ position: "fixed", inset: 0, zIndex: 60, background: "rgba(10,11,12,0.55)", display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} style={{ background: "#fff", borderRadius: 4, width: "100%", maxWidth: 860, maxHeight: "92vh", overflowY: "auto", padding: 28, fontFamily: FONT_BODY }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
          <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 20, color: INK }}>{copy.title}</span>
          <span onClick={onClose} style={{ fontFamily: FONT_MONO, fontSize: 16, color: MUTED, cursor: "pointer", padding: 4 }}>✕</span>
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 22 }}>
          {steps.map((s, i) => (
            <React.Fragment key={s}>
              {i > 0 && <span style={{ width: 22, height: 1, background: HAIRLINE }} />}
              <span style={{ display: "flex", alignItems: "center", gap: 6 }}>
                <span style={{ width: 18, height: 18, borderRadius: "50%", background: i <= stepIdx ? YELLOW : "#ECEAE4", color: INK, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT_MONO, fontSize: 10, fontWeight: 700 }}>{i + 1}</span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: i === stepIdx ? INK : MUTED, fontWeight: i === stepIdx ? 700 : 400 }}>{s}</span>
              </span>
            </React.Fragment>
          ))}
          <span style={{ marginLeft: "auto", fontFamily: FONT_MONO, fontSize: 10, color: MUTED }}>{copy.spec}</span>
        </div>

        {stepIdx === 0 && (
          <>
            <p style={{ fontSize: 14, lineHeight: 1.55, color: "#6B6B70", margin: "0 0 18px", maxWidth: "58ch" }}>{copy.uploadHint}</p>
            <div
              onClick={() => inputRef.current?.click()}
              onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
              onDragLeave={() => setDragOver(false)}
              onDrop={(e) => { e.preventDefault(); setDragOver(false); acceptFile(e.dataTransfer.files && e.dataTransfer.files[0]); }}
              style={{ border: `2px dashed ${dragOver ? INK : "#c2bfb6"}`, borderRadius: 3, background: dragOver ? "#F0EEE8" : "#FAF9F6", padding: 44, display: "flex", flexDirection: "column", alignItems: "center", gap: 12, cursor: "pointer" }}
            >
              <span style={{ width: 46, height: 46, borderRadius: "50%", background: "#ECEAE4", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20, color: MUTED }}>↑</span>
              <span style={{ fontSize: 14, color: "#33333A" }}>Drop an image here, or <span style={{ color: "#B07A00", borderBottom: `2px solid ${YELLOW}` }}>browse</span></span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", color: MUTED }}>PNG · JPG · SVG</span>
              <input ref={inputRef} type="file" accept="image/*" onChange={(e) => { acceptFile(e.target.files && e.target.files[0]); e.target.value = ""; }} style={{ display: "none" }} />
            </div>
          </>
        )}

        {img && (isAdjust || isReview) && (
          <div style={{ display: "flex", gap: 26, flexWrap: "wrap" }}>
            <div style={{ flex: 1.2, minWidth: 300 }}>
              {previewFrame(resultUrl)}
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: MUTED, marginTop: 8 }}>
                {type === "stencils" ? "Color shows through wherever guests can paint." : type === "stickers" ? "Checkerboard = transparent in the final file." : "Cropped to fill the wall."}
              </div>
            </div>

            <div style={{ flex: 1, minWidth: 260 }}>
              {isAdjust && type === "stencils" && (
                <>
                  <ControlSlider label="Artwork darkness cutoff" value={params.threshold} min={5} max={95} suffix="%" onChange={(v) => setParams((p) => ({ ...p, threshold: v }))} />
                  <ToggleRow label="Invert" note="Paint the background instead of the artwork" on={params.invert} onToggle={() => setParams((p) => ({ ...p, invert: !p.invert }))} />
                  <p style={{ fontSize: 12.5, lineHeight: 1.5, color: MUTED, margin: "6px 0 0" }}>Slide until only the shape you want painted shows color. Light backgrounds disappear into the sheet automatically.</p>
                </>
              )}
              {isAdjust && type === "stickers" && (
                <>
                  {hasAlpha && !params.removeBg && (
                    <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: "#16744B", background: "#E3F1EA", borderRadius: 2, padding: "8px 10px", marginBottom: 14 }}>✓ Transparent background detected — no cleanup needed</div>
                  )}
                  <ToggleRow label="Remove background" note={hasAlpha ? "Already transparent — leave off unless needed" : "Clears the flat background around your subject"} on={params.removeBg} onToggle={() => setParams((p) => ({ ...p, removeBg: !p.removeBg }))} />
                  {params.removeBg && (
                    <ControlSlider label="Removal strength" value={params.tolerance} min={5} max={95} suffix="%" onChange={(v) => setParams((p) => ({ ...p, tolerance: v }))} />
                  )}
                  <ControlSlider label="White edge padding" value={params.padding} min={4} max={22} suffix="px" onChange={(v) => setParams((p) => ({ ...p, padding: v }))} />
                  <ToggleRow label="Micro shadow" note="Soft lift so the sticker pops off the wall" on={params.shadow} onToggle={() => setParams((p) => ({ ...p, shadow: !p.shadow }))} />
                </>
              )}
              {isReview && (
                <>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", color: MUTED, marginBottom: 8 }}>Name</div>
                  <input
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    style={{ width: "100%", boxSizing: "border-box", height: 40, border: `1px solid ${HAIRLINE}`, borderRadius: 2, padding: "0 12px", fontFamily: FONT_BODY, fontSize: 14, color: INK, outline: "none", marginBottom: 14 }}
                  />
                  <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: MUTED, lineHeight: 1.8, marginBottom: 18 }}>{copy.spec}</div>
                  {resultUrl && (
                    <a href={resultUrl} download={`${name || type}-preview.png`} style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: "#6B6B70", borderBottom: `2px solid ${YELLOW}`, textDecoration: "none" }}>
                      ↓ Download to inspect
                    </a>
                  )}
                </>
              )}
            </div>
          </div>
        )}

        {stepIdx > 0 && (
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginTop: 24, paddingTop: 18, borderTop: `1px solid ${HAIRLINE}` }}>
            <span onClick={() => setStepIdx((s) => s - 1)} style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: "#6B6B70", cursor: "pointer" }}>← Back</span>
            {isReview ? (
              <span
                onClick={() => resultUrl && onAdd({ name: name || copy.title, src: resultUrl })}
                style={{ background: resultUrl ? YELLOW : "#ECEAE4", color: INK, borderRadius: 2, padding: "12px 22px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, cursor: resultUrl ? "pointer" : "default" }}
              >
                Add to library
              </span>
            ) : (
              <span onClick={() => setStepIdx((s) => s + 1)} style={{ background: YELLOW, color: INK, borderRadius: 2, padding: "12px 22px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, cursor: "pointer" }}>
                Looks right →
              </span>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

}

      <div style={{ display: "grid", gridTemplateColumns: isBg ? "repeat(3,1fr)" : "repeat(5,1fr)", gap: 12 }}>
        {allItems.map((item) => {
          const isSel = selectedNow.includes(item.id);
          const isCustom = item.origin === "upload";
          return (
            <div key={item.id} style={{ position: "relative" }}>

                style={{ aspectRatio: isBg ? "16/9" : "1", borderRadius: 2, overflow: "hidden", position: "relative", border: `2px solid ${isSel ? YELLOW : "transparent"}`, boxShadow: isSel ? "none" : `inset 0 0 0 1px ${HAIRLINE}`, cursor: "pointer", ...tileBg(item) }}

                {isSel && (
                  <span style={{ position: "absolute", top: 6, right: 6, width: 18, height: 18, borderRadius: "50%", background: YELLOW, color: INK, display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT_MONO, fontSize: 10 }}>✓</span>
                )}
                {isCustom && (
                  <span style={{ position: "absolute", bottom: 6, left: 6, fontFamily: FONT_MONO, fontSize: 8, letterSpacing: "0.08em", textTransform: "uppercase", color: "#fff", background: "rgba(10,11,12,0.72)", borderRadius: 2, padding: "2px 6px" }}>Yours</span>

              {isCustom && (

                  style={{ position: "absolute", top: -7, left: -7, width: 20, height: 20, borderRadius: "50%", background: "#fff", border: `1px solid ${HAIRLINE}`, color: "#6B6B70", display: "flex", alignItems: "center", justifyContent: "center", fontFamily: FONT_MONO, fontSize: 11, cursor: "pointer", boxShadow: "0 1px 3px rgba(0,0,0,0.15)" }}
                >
                  ×
                </span>
              )}

          );
        })}
      </div>

      <StepFooter stepNumber={stepNumber} totalSteps={totalSteps} completed={completed} onToggleComplete={onToggleComplete} onBack={onBack} onNext={onNext} />

  );
}

export default AssetManagerStep5AssetBuilder;

<script type="text/plain" id="src-step6">
import React, { useState, useRef, useCallback } from "react";

/**
 * Asset Manager — Step 6: Wall overlay.
 * Composite one or more real logo images onto a live wall preview — anchor to a
 * fixed position with padding, or drag freely with snap guides (wall center + other
 * logos) — then export the whole overlay as a single transparent PNG at the wall's
 * actual pixel resolution, logos only, ready to composite onto the live paint canvas
 * in production.
 * Fully standalone — own local state, no wizard shell dependency.
 *
 * Screen size: `wallWidth`/`wallHeight` (default 3840×2160, 16:9) drive both the
 * preview's aspect ratio and the exported PNG's pixel dimensions. For now these are
 * a fixed 16:9 default — the intent is for the host app to eventually pass the
 * actual screen dimensions configured for the event (the same source of truth as
 * the setup diagram's screen sizing) once that's wired up, so the overlay and the
 * physical screen always agree on resolution and aspect ratio.
 */

const FONT_MONO = "var(--gp-font-mono, 'Space Mono', 'Courier New', monospace)";
const FONT_BODY = "var(--gp-font-body, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const FONT_DISPLAY = "var(--gp-font-display, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const YELLOW = "#FEBD17";
const INK = "#0A0B0C";
const HAIRLINE = "var(--gp-hairline-light, rgba(10,11,12,0.12))";
const MUTED = "#9A9A96";

// Two sample logos with different aspect ratios (1:1 and 3:1), inlined as SVG data
// URLs so the seed rows below preview and export correctly without a real upload.
const SAMPLE_MARK_SVG =
  "data:image/svg+xml;utf8," +
  encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><circle cx="100" cy="100" r="92" fill="#0A0B0C"/><circle cx="100" cy="70" r="30" fill="#FEBD17"/></svg>');
const SAMPLE_WORDMARK_SVG =
  "data:image/svg+xml;utf8," +
  encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160"><rect x="4" y="4" width="472" height="152" rx="12" fill="#fff"/><text x="240" y="98" font-family="monospace" font-size="52" font-weight="700" text-anchor="middle" fill="#0A0B0C">SPONSOR</text></svg>');

const DEFAULT_LOGOS = [
  { id: "seed-1", name: "Brand logo", kind: "From assets", src: SAMPLE_MARK_SVG, naturalW: 200, naturalH: 200, mode: "anchored", anchor: "br", padding: 6, size: 14 },
  { id: "seed-2", name: "Sponsor mark", kind: "From assets", src: SAMPLE_WORDMARK_SVG, naturalW: 480, naturalH: 160, mode: "anchored", anchor: "tl", padding: 6, size: 22 },
];
const ANCHOR_KEYS = ["tl", "tc", "tr", "ml", "mc", "mr", "bl", "bc", "br"];

// anchor math in percentages of wall width/height, given each logo's own true
// half-width/half-height (so padding touches the actual image edge, not a guess).
function axy(anchor, padding, halfWPct, halfHPct) {
  const xs = { l: padding + halfWPct, c: 50, r: 100 - padding - halfWPct };
  const ys = { t: padding + halfHPct, m: 50, b: 100 - padding - halfHPct };
  const vy = anchor[0] === "t" ? "t" : anchor[0] === "b" ? "b" : "m";
  const hx = anchor[1] === "l" ? "l" : anchor[1] === "r" ? "r" : "c";
  return { x: xs[hx], y: ys[vy] };
}

function aspectOf(lg) { return lg.naturalW && lg.naturalH ? lg.naturalW / lg.naturalH : 1; }

// A logo's width is a % of wall width; its height in % of wall height depends on
// both its own image aspect ratio and the wall's aspect ratio.
function heightPctOf(lg, wallAR) { return (lg.size * wallAR) / aspectOf(lg); }

function getXY(lg, wallAR) {
  if (lg.mode === "free") return { x: lg.x, y: lg.y };
  const halfH = heightPctOf(lg, wallAR) / 2;
  return axy(lg.anchor, lg.padding, lg.size / 2, halfH);
}

function loadImageEl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    if (!src.startsWith("blob:") && !src.startsWith("data:")) img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error("image failed to load"));
    img.src = src;
  });
}

// Renders logos only, at full wall resolution, on a transparent canvas — no wall
// background — so the export is a straight composite layer for production.
async function exportOverlayPng(logos, wallWidth, wallHeight) {
  const wallAR = wallWidth / wallHeight;
  const canvas = document.createElement("canvas");
  canvas.width = wallWidth;
  canvas.height = wallHeight;
  const ctx = canvas.getContext("2d");
  for (const lg of logos) {
    if (!lg.src) continue;
    const img = await loadImageEl(lg.src);
    const xy = getXY(lg, wallAR);
    const wPx = (lg.size / 100) * wallWidth;
    const hPx = wPx / aspectOf(lg);
    const cx = (xy.x / 100) * wallWidth;
    const cy = (xy.y / 100) * wallHeight;
    ctx.drawImage(img, cx - wPx / 2, cy - hPx / 2, wPx, hPx);
  }
  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => (blob ? resolve(blob) : reject(new Error("toBlob failed"))), "image/png");
  });
}

function useToast() {
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);
  const flash = useCallback((msg) => {
    setToast(msg);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setToast(null), 1900);
  }, []);
  return [toast, flash];
}

function Toast({ message }) {
  if (!message) return null;
  return (
    <div style={{ position: "fixed", bottom: 32, left: "50%", transform: "translateX(-50%)", zIndex: 50, background: INK, color: "#F4F4F2", borderRadius: 4, padding: "12px 20px", display: "flex", alignItems: "center", gap: 10, boxShadow: "0 8px 24px rgba(0,0,0,0.28)" }}>
      <span style={{ width: 7, height: 7, borderRadius: "50%", background: YELLOW, display: "inline-block", flex: "none" }} />
      <span style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.06em", color: "#F4F4F2" }}>{message}</span>
    </div>
  );
}

function StepFooter({ stepNumber, totalSteps, completed, onToggleComplete, onBack, onNext, nextLabel }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderTop: `1px solid ${HAIRLINE}`, marginTop: 32, paddingTop: 20 }}>
      <span onClick={onBack} style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: onBack ? "#6B6B70" : "#c2bfb6", cursor: onBack ? "pointer" : "default" }}>← Back</span>
      <span style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", color: MUTED }}>
        Step {String(stepNumber).padStart(2, "0")} / {String(totalSteps).padStart(2, "0")}
      </span>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span onClick={onToggleComplete} style={{ border: `1px solid ${completed ? "#16744B" : INK}`, color: completed ? "#16744B" : INK, borderRadius: 2, padding: "11px 18px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: completed ? 700 : 400, cursor: "pointer" }}>
          {completed ? "✓ Completed" : "Mark complete"}
        </span>
        <span onClick={onNext} style={{ background: YELLOW, color: INK, borderRadius: 2, padding: "12px 22px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, cursor: "pointer" }}>
          {nextLabel || "Continue →"}
        </span>
      </div>
    </div>
  );
}

export function AssetManagerStep6WallOverlay({
  initialLogos = DEFAULT_LOGOS,
  onChange,
  onExport, // (blob) => void — fired in addition to the automatic local download, e.g. to also persist server-side
  wallWidth = 3840,
  wallHeight = 2160, // 16:9 default — swap for the event's real screen size once that's wired up
  completed = false,
  onToggleComplete,
  onBack,
  onNext,
  stepNumber = 6,
  totalSteps = 8,
}) {
  const [logos, setLogos] = useState(initialLogos);
  const [wallSel, setWallSel] = useState(0);
  const [drag, setDrag] = useState(null);
  const [guideX, setGuideX] = useState(null);
  const [guideY, setGuideY] = useState(null);
  const [exporting, setExporting] = useState(false);
  const [dragOverWall, setDragOverWall] = useState(false);
  const wallRef = useRef(null);
  const addInputRef = useRef(null);
  const replaceInputRef = useRef(null);
  const [toast, flash] = useToast();

  const WALL_AR = wallWidth / wallHeight;
  const commit = (next) => { setLogos(next); onChange?.(next); };

  const startDrag = (i) => (e) => {
    e.preventDefault?.();
    setWallSel(i);
    setDrag({ i });
    setLogos((prev) => {
      const next = prev.map((lg, idx) => (idx === i && lg.mode !== "free" ? { ...lg, ...getXY(lg, WALL_AR), mode: "free" } : lg));
      onChange?.(next);
      return next;
    });
  };
  const onMove = (e) => {
    if (!drag || !wallRef.current) return;
    const r = wallRef.current.getBoundingClientRect();
    let x = Math.max(0, Math.min(100, ((e.clientX - r.left) / r.width) * 100));
    let y = Math.max(0, Math.min(100, ((e.clientY - r.top) / r.height) * 100));
    const TH = 2.6;
    const others = logos.map((lg, idx) => (idx === drag.i ? null : getXY(lg, WALL_AR))).filter(Boolean);
    let gx = null, gy = null;
    for (const t of [50, ...others.map((o) => o.x)]) { if (Math.abs(x - t) < TH) { x = t; gx = t; break; } }
    for (const t of [50, ...others.map((o) => o.y)]) { if (Math.abs(y - t) < TH) { y = t; gy = t; break; } }
    setGuideX(gx); setGuideY(gy);
    setLogos((prev) => {
      const next = prev.map((lg, idx) => (idx === drag.i ? { ...lg, mode: "free", x, y } : lg));
      onChange?.(next);
      return next;
    });
  };
  const endDrag = () => { if (drag) { setDrag(null); setGuideX(null); setGuideY(null); } };

  const sel = logos[wallSel] || logos[0];
  const updateSel = (patch) => {
    const next = logos.map((lg, i) => (i === wallSel ? { ...lg, ...patch } : lg));
    commit(next);
  };
  const setFree = () => { const xy = getXY(sel, WALL_AR); updateSel({ mode: "free", x: xy.x, y: xy.y }); };
  const setAnchored = () => updateSel({ mode: "anchored" });

  const removeLogo = (i) => {
    const target = logos[i];
    if (target?.src?.startsWith("blob:")) URL.revokeObjectURL(target.src);
    const next = logos.filter((_, idx) => idx !== i);
    commit(next);
    setWallSel((s) => Math.max(0, Math.min(next.length - 1, s)));
    flash("Removed logo");
  };

  // Reads real files, loads each to get its true pixel dimensions (so aspect ratio
  // on the wall is correct), then either appends new logos or replaces one in place.
  const handleFiles = async (fileList, replaceIndex) => {
    const incoming = Array.from(fileList || []);
    if (!incoming.length) return;
    for (const file of incoming) {
      try {
        const src = URL.createObjectURL(file);
        const img = await loadImageEl(src);
        const meta = { src, naturalW: img.naturalWidth, naturalH: img.naturalHeight, file, name: file.name, kind: "Uploaded" };
        if (replaceIndex != null) {
          setLogos((prev) => {
            const old = prev[replaceIndex];
            if (old?.src?.startsWith("blob:")) URL.revokeObjectURL(old.src);
            const next = prev.map((lg, idx) => (idx === replaceIndex ? { ...lg, ...meta } : lg));
            onChange?.(next);
            return next;
          });
          flash(`Replaced with ${file.name}`);
        } else {
          let newIndex = 0;
          setLogos((prev) => {
            const next = [...prev, { id: `${file.name}-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, mode: "anchored", anchor: "mc", padding: 6, size: 18, x: 50, y: 50, ...meta }];
            newIndex = next.length - 1;
            onChange?.(next);
            return next;
          });
          setWallSel(newIndex);
          flash(`Added ${file.name}`);
        }
      } catch (e) {
        flash(`Couldn't load ${file.name}`);
      }
    }
  };

  const downloadOverlay = async () => {
    if (exporting) return;
    setExporting(true);
    try {
      const blob = await exportOverlayPng(logos, wallWidth, wallHeight);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `wall-overlay-${wallWidth}x${wallHeight}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      onExport?.(blob);
      flash(`Downloaded ${wallWidth}×${wallHeight} PNG`);
    } catch (e) {
      flash("Couldn't export the overlay — try again");
    } finally {
      setExporting(false);
    }
  };

  const selXY = getXY(sel, WALL_AR);
  const selX = Math.round(selXY.x);
  const selY = Math.round(selXY.y);

  return (

      <p style={{ fontSize: 14, lineHeight: 1.5, color: "#6B6B70", margin: "0 0 24px", maxWidth: "62ch" }}>
        Upload one or more logos — your brand mark, a sponsor, anything — composited onto the live wall. Anchor each to a fixed position with padding, or drag it where you want — it snaps to the wall center and lines up with your other logos. When you're happy with it, download the whole thing as a single transparent PNG.

      <div style={{ display: "flex", gap: 28, flexWrap: "wrap", alignItems: "flex-start" }}>
        <div style={{ flex: 1, minWidth: 380 }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>

              onPointerUp={endDrag}
              onPointerLeave={endDrag}
              onDragOver={(e) => { e.preventDefault(); setDragOverWall(true); }}
              onDragLeave={() => setDragOverWall(false)}
              onDrop={(e) => { e.preventDefault(); setDragOverWall(false); handleFiles(e.dataTransfer.files); }}
              style={{ aspectRatio: `${wallWidth}/${wallHeight}`, background: INK, borderRadius: 2, position: "relative", overflow: "hidden", touchAction: "none", outline: dragOverWall ? `2px dashed ${YELLOW}` : "none", outlineOffset: -2 }}

                const xy = getXY(lg, WALL_AR);

                  <div
                    key={lg.id ?? i}
                    onPointerDown={startDrag(i)}
                    onClick={() => setWallSel(i)}

                      position: "absolute", left: `${xy.x.toFixed(2)}%`, top: `${xy.y.toFixed(2)}%`, width: `${lg.size}%`, height: `${heightPct}%`,
                      transform: "translate(-50%,-50%)", cursor: "grab", touchAction: "none",

                  <span style={{ width: 34, height: 26, borderRadius: 2, background: "repeating-conic-gradient(#ECEAE4 0% 25%, #fff 0% 50%) 50% / 8px 8px", flex: "none", display: "flex", alignItems: "center", justifyContent: "center", overflow: "hidden" }}>

                    <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: INK, display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{lg.name}</span>
                    <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: MUTED }}>{lg.kind}</span>
                  </span>
                  {isSel && <span onClick={(e) => { e.stopPropagation(); removeLogo(i); }} style={{ fontFamily: FONT_MONO, fontSize: 15, color: MUTED, cursor: "pointer" }}>×</span>}
                </div>
              );
            })}
            <div style={{ display: "flex", gap: 8, marginTop: 2 }}>
              <span onClick={() => addInputRef.current?.click()} style={{ flex: 1, textAlign: "center", fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: INK, border: "1px dashed #c2bfb6", borderRadius: 2, padding: "9px 0", cursor: "pointer" }}>+ Upload logo</span>
              <span onClick={() => replaceInputRef.current?.click()} style={{ flex: 1, textAlign: "center", fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: "#6B6B70", border: `1px solid ${HAIRLINE}`, borderRadius: 2, padding: "9px 0", cursor: "pointer" }}>Replace image</span>
            </div>
            <input ref={addInputRef} type="file" accept="image/*" multiple onChange={(e) => { handleFiles(e.target.files); e.target.value = ""; }} style={{ display: "none" }} />
            <input ref={replaceInputRef} type="file" accept="image/*" onChange={(e) => { handleFiles(e.target.files, wallSel); e.target.value = ""; }} style={{ display: "none" }} />
          </div>

          {/* One grouped card — mode, anchor/free control, and both sliders all
              configure the same selected logo, so they read as a single unit. */}
          <div style={{ border: `1px solid ${HAIRLINE}`, borderRadius: 3, background: "#FAF9F6", padding: 16 }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
              <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: MUTED }}>Placement · {sel.name}</span>
              <div style={{ display: "inline-flex", border: `1px solid ${HAIRLINE}`, borderRadius: 2, overflow: "hidden", background: "#fff" }}>
                <span onClick={setAnchored} style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.04em", textTransform: "uppercase", color: sel.mode === "anchored" ? INK : "#6B6B70", background: sel.mode === "anchored" ? YELLOW : "transparent", padding: "7px 13px", fontWeight: sel.mode === "anchored" ? 700 : 400, cursor: "pointer" }}>Anchored</span>
                <span onClick={setFree} style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.04em", textTransform: "uppercase", color: sel.mode === "free" ? INK : "#6B6B70", background: sel.mode === "free" ? YELLOW : "transparent", padding: "7px 13px", fontWeight: sel.mode === "free" ? 700 : 400, cursor: "pointer", borderLeft: `1px solid ${HAIRLINE}` }}>Free</span>
              </div>
            </div>

            {sel.mode === "anchored" ? (
              <div style={{ display: "flex", gap: 20, marginBottom: 18 }}>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(3,1fr)", gap: 6, width: 108, flex: "none" }}>
                  {ANCHOR_KEYS.map((a) => {
                    const active = sel.anchor === a;
                    return <span key={a} onClick={() => updateSel({ anchor: a })} title={a} style={{ aspectRatio: "1", borderRadius: 2, background: active ? YELLOW : "#fff", border: `1px solid ${active ? YELLOW : HAIRLINE}`, cursor: "pointer" }} />;
                  })}
                </div>
                <div style={{ flex: 1, display: "flex", flexDirection: "column", justifyContent: "center" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, marginBottom: 7 }}><span>Padding</span><span>{sel.padding}%</span></div>
                  <input type="range" min="0" max="20" value={sel.padding} onChange={(e) => updateSel({ padding: Number(e.target.value) })} style={{ width: "100%", accentColor: YELLOW, cursor: "pointer" }} />
                </div>
              </div>
            ) : (
              <div style={{ marginBottom: 18 }}>
                <div style={{ display: "flex", justifyContent: "space-between", fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, marginBottom: 7 }}><span>Horizontal</span><span>{selX}%</span></div>
                <input type="range" min="0" max="100" value={selX} onChange={(e) => updateSel({ x: Number(e.target.value) })} style={{ width: "100%", accentColor: YELLOW, cursor: "pointer", marginBottom: 14 }} />
                <div style={{ display: "flex", justifyContent: "space-between", fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, marginBottom: 7 }}><span>Vertical</span><span>{selY}%</span></div>
                <input type="range" min="0" max="100" value={selY} onChange={(e) => updateSel({ y: Number(e.target.value) })} style={{ width: "100%", accentColor: YELLOW, cursor: "pointer" }} />
              </div>
            )}

            <div style={{ borderTop: `1px solid ${HAIRLINE}`, paddingTop: 16 }}>
              <div style={{ display: "flex", justifyContent: "space-between", fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, marginBottom: 7 }}><span>Size</span><span>{sel.size}%</span></div>
              <input type="range" min="4" max="50" value={sel.size} onChange={(e) => updateSel({ size: Number(e.target.value) })} style={{ width: "100%", accentColor: YELLOW, cursor: "pointer" }} />
            </div>
          </div>
        </div>
      </div>

      <StepFooter stepNumber={stepNumber} totalSteps={totalSteps} completed={completed} onToggleComplete={onToggleComplete} onBack={onBack} onNext={onNext} />
      <Toast message={toast} />
    </div>
  );
}

export default AssetManagerStep6WallOverlay;

</script>

  onLaunch,
  completed = false,
  onToggleComplete,
  onBack,
  onNext,
  stepNumber = 7,

  const [activeTool, setActiveTool] = useState("cans");

<script type="text/plain" id="src-step8">
import React, { useState } from "react";

/**
 * Asset Manager — Step 8: Approve & lock.
 * Final checklist recap and the approve/lock action that freezes assets and hands
 * off to production. Fully standalone — own local state, no wizard shell dependency.
 */

const FONT_MONO = "var(--gp-font-mono, 'Space Mono', 'Courier New', monospace)";
const FONT_BODY = "var(--gp-font-body, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const FONT_DISPLAY = "var(--gp-font-display, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const YELLOW = "#FEBD17";
const INK = "#0A0B0C";
const HAIRLINE = "var(--gp-hairline-light, rgba(10,11,12,0.12))";
const MUTED = "#9A9A96";

const DEFAULT_ITEMS = [
  { label: "Logos", meta: "2 files" },
  { label: "Color palette", meta: "5 swatches" },
  { label: "Can designs", meta: "2 placements" },
  { label: "Stencils, stickers & backgrounds", meta: "8 assets" },
  { label: "Wall overlay", meta: "Bottom-right" },
];

function StepFooter({ stepNumber, totalSteps, completed, onToggleComplete, onBack, onNext, nextLabel }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderTop: `1px solid ${HAIRLINE}`, marginTop: 32, paddingTop: 20 }}>
      <span onClick={onBack} style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: onBack ? "#6B6B70" : "#c2bfb6", cursor: onBack ? "pointer" : "default" }}>← Back</span>
      <span style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", color: MUTED }}>
        Step {String(stepNumber).padStart(2, "0")} / {String(totalSteps).padStart(2, "0")}
      </span>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span onClick={onToggleComplete} style={{ border: `1px solid ${completed ? "#16744B" : INK}`, color: completed ? "#16744B" : INK, borderRadius: 2, padding: "11px 18px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: completed ? 700 : 400, cursor: "pointer" }}>
          {completed ? "✓ Completed" : "Mark complete"}
        </span>
        <span onClick={onNext} style={{ background: YELLOW, color: INK, borderRadius: 2, padding: "12px 22px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, cursor: "pointer" }}>
          {nextLabel || "Continue →"}
        </span>
      </div>
    </div>
  );
}

export function AssetManagerStep8ApproveLock({
  items = DEFAULT_ITEMS,
  onApprove,
  completed = false,
  onToggleComplete,
  onBack,
  onNext,
  stepNumber = 8,
  totalSteps = 8,
}) {
  const [locked, setLocked] = useState(false);

  const approveLock = () => {
    setLocked(true);
    onApprove?.();
  };

  return (
    <div style={{ fontFamily: FONT_BODY, maxWidth: 620 }}>
      <div style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "#B07A00", marginBottom: 8 }}>Step 08</div>
      <h2 style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 30, letterSpacing: "-0.01em", color: INK, margin: "0 0 6px" }}>Approve &amp; lock</h2>
      <p style={{ fontSize: 14, lineHeight: 1.5, color: "#6B6B70", margin: "0 0 24px", maxWidth: "62ch" }}>
        Confirm your assets. On approval they freeze and flow into the event record — nothing changes after launch without a reopen.
      </p>

      <div style={{ maxWidth: 560 }}>
        {items.map((item, i) => (
          <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, borderTop: `1px solid ${HAIRLINE}`, borderBottom: i === items.length - 1 ? `1px solid ${HAIRLINE}` : "none", padding: "16px 0", marginBottom: i === items.length - 1 ? 24 : 0 }}>
            <span style={{ width: 24, height: 24, borderRadius: "50%", background: "#16744B", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 13 }}>✓</span>
            <span style={{ flex: 1, fontFamily: FONT_BODY, fontSize: 15, color: INK }}>{item.label}</span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: MUTED }}>{item.meta}</span>
          </div>
        ))}

        {locked ? (
          <div style={{ display: "inline-flex", alignItems: "center", gap: 10, background: "#E3F1EA", color: "#16744B", borderRadius: 2, padding: "15px 26px", fontFamily: FONT_MONO, fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700 }}>
            ✓ Assets approved & locked
          </div>
        ) : (
          <div onClick={approveLock} style={{ display: "inline-flex", alignItems: "center", gap: 10, background: YELLOW, color: INK, borderRadius: 2, padding: "15px 26px", fontFamily: FONT_MONO, fontSize: 12, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, cursor: "pointer" }}>
            Approve &amp; lock assets →
          </div>
        )}
      </div>

      <StepFooter stepNumber={stepNumber} totalSteps={totalSteps} completed={completed} onToggleComplete={onToggleComplete} onBack={onBack} onNext={onNext} />
    </div>
  );
