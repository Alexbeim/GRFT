<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AssetManagerStep3ColorManagement — live demo</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; background: #f0eee8; }
  #root { padding: 40px 20px; display: flex; justify-content: center; }
  .frame { background: #fff; border: 1px solid #E6E3DC; border-radius: 3px; padding: 32px; max-width: 1000px; width: 100%; }
  .note { font-family: -apple-system, sans-serif; font-size: 13px; color: #6B6B70; max-width: 1000px; margin: 0 auto 16px; }
</style>
</head>
<body>
<div class="note">Standalone demo of <code>AssetManagerStep3ColorManagement.jsx</code> — no backend needed, <code>onChange</code> logs the emitted <code>{ variant, extras, palette }</code> payload to the console.</div>
<div id="root">Loading…</div>

<script type="text/plain" id="src-step3">
import React, { useState, useRef, useCallback, useMemo } from "react";

/**
 * Asset Manager — Step 3: Color management.
 * Two organized GRFT+ wall palettes (Default / Pastel), each the same 8 hue-family
 * pairs × 5 shades (light ramp + dark ramp per family) — both shown at once, side by
 * side, so the client picks ONE WHOLE PALETTE (not individual colors) with a single
 * click. No tabs: both options are always visible for direct comparison.
 *
 * Colors entered manually (HEX/RGB/CMYK/Pantone) or pulled from an uploaded image are
 * kept in a standalone "Your colors" section — never merged into or rendered on top of
 * either palette card, since the client may want only their own colors with no starter
 * palette at all. Each is individually removable. The 80 base swatches per card are a
 * preview, not a picker — there's no one-by-one color selection.
 * Fully standalone — own local state, no wizard shell dependency.
 */

const FONT_MONO = "var(--gp-font-mono, 'Space Mono', 'Courier New', monospace)";
const FONT_BODY = "var(--gp-font-body, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const FONT_DISPLAY = "var(--gp-font-display, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const YELLOW = "#FEBD17";
const INK = "#0A0B0C";
const HAIRLINE = "var(--gp-hairline-light, rgba(10,11,12,0.12))";
const MUTED = "#9A9A96";

// Each pair = one hue neighborhood split into a light ramp (pale → vivid mid-tone)
// and a dark ramp (vivid → near-black), so no single row has to span 10 steps.
const FAMILY_PAIRS = [
  { light: { name: "Gray", hue: 213, neutral: true }, dark: { name: "Navy", hue: 213 } },
  { light: { name: "Pink", hue: 340 }, dark: { name: "Red", hue: 355 } },
  { light: { name: "Yellow", hue: 42 }, dark: { name: "Brown", hue: 26 } },
  { light: { name: "Lime", hue: 85 }, dark: { name: "Green", hue: 132 } },
  { light: { name: "Mint", hue: 160 }, dark: { name: "Teal", hue: 186 } },
  { light: { name: "Sky", hue: 200 }, dark: { name: "Blue", hue: 215 } },
  { light: { name: "Lavender", hue: 256 }, dark: { name: "Violet", hue: 268 } },
  { light: { name: "Orchid", hue: 300 }, dark: { name: "Magenta", hue: 316 } },
];

// Saturation/lightness curves per shade position (0–100), shared shape across variants
// so Default/Pastel stay organized the same way — only the mood changes.
const VARIANT_CURVES = {
  default: {
    label: "Default",
    light: { s: [14, 30, 48, 64, 78], l: [95, 88, 79, 68, 57] },
    dark: { s: [70, 66, 60, 54, 46], l: [46, 36, 26, 17, 9] },
    neutralSatCap: 8,
  },
  pastel: {
    label: "Pastel",
    light: { s: [10, 18, 26, 34, 42], l: [97, 93, 88, 83, 78] },
    dark: { s: [26, 28, 30, 30, 28], l: [70, 61, 52, 44, 36] },
    neutralSatCap: 5,
  },
};
const VARIANT_KEYS = ["default", "pastel"];

function hsl2hex(h, s, l) {
  const a = s * Math.min(l, 1 - l);
  const f = (n) => {
    const k = (n + h / 30) % 12;
    const c = l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1));
    return Math.round(255 * c).toString(16).padStart(2, "0");
  };
  return "#" + f(0) + f(8) + f(4);
}

function hx(n) { return Math.max(0, Math.min(255, Math.round(n))).toString(16).padStart(2, "0"); }

const PANTONE_MAP = {
  "185 C": "#E4002B", "186 C": "#C8102E", "286 C": "#0033A0", "021 C": "#FE5000", "021": "#FE5000",
  "123 C": "#FFC72C", "347 C": "#009A44", "2685 C": "#3A0CA3", "COOL GRAY 11 C": "#53565A",
  "COOL GRAY 11": "#53565A", "BLACK 6 C": "#101820", "426 C": "#25282A", "WARM RED C": "#F9423A",
};

function convertToHex(fmt, raw) {
  const v = (raw || "").trim();
  if (fmt === "hex") {
    const m = v.replace(/^#/, "");
    if (/^[0-9a-fA-F]{6}$/.test(m)) return "#" + m.toUpperCase();
    if (/^[0-9a-fA-F]{3}$/.test(m)) return "#" + m.split("").map((c) => c + c).join("").toUpperCase();
    return null;
  }
  if (fmt === "rgb") {
    const p = v.split(/[ ,]+/).filter(Boolean).map(Number);
    if (p.length === 3 && p.every((n) => n >= 0 && n <= 255)) return ("#" + hx(p[0]) + hx(p[1]) + hx(p[2])).toUpperCase();
    return null;
  }
  if (fmt === "cmyk") {
    const p = v.split(/[ ,%]+/).filter(Boolean).map(Number);
    if (p.length === 4 && p.every((n) => n >= 0 && n <= 100)) {
      const [c, m, y, k] = p.map((n) => n / 100);
      const r = 255 * (1 - c) * (1 - k), g = 255 * (1 - m) * (1 - k), b = 255 * (1 - y) * (1 - k);
      return ("#" + hx(r) + hx(g) + hx(b)).toUpperCase();
    }
    return null;
  }
  if (fmt === "pantone") {
    const key = v.toUpperCase().replace(/\s+/g, " ");
    return PANTONE_MAP[key] || null;
  }
  return null;
}

const CONV_PLACEHOLDER = { hex: "#C7402F", pantone: "185 C" };

function rgbToHex(r, g, b) { return ("#" + hx(r) + hx(g) + hx(b)).toUpperCase(); }
function cmykToHex(c, m, y, k) {
  const cc = c / 100, mm = m / 100, yy = y / 100, kk = k / 100;
  const r = 255 * (1 - cc) * (1 - kk), g = 255 * (1 - mm) * (1 - kk), b = 255 * (1 - yy) * (1 - kk);
  return rgbToHex(r, g, b);
}
function hexToRgb(hexVal) {
  const m = (hexVal || "").replace(/^#/, "");
  if (!/^[0-9a-fA-F]{6}$/.test(m)) return null;
  return { r: parseInt(m.slice(0, 2), 16), g: parseInt(m.slice(2, 4), 16), b: parseInt(m.slice(4, 6), 16) };
}

function buildRow(hue, curve, neutral, neutralSatCap) {
  return curve.s.map((sVal, i) => {
    const s = neutral ? Math.min(sVal, neutralSatCap) : sVal;
    return hsl2hex(hue, s / 100, curve.l[i] / 100).toUpperCase();
  });
}

// Flat, ordered list of {hex, family} — grid renders 5-per-row, so family rows read
// exactly like the reference sheets (one hue neighborhood per pair of rows).
function buildPalette(variantKey) {
  const curves = VARIANT_CURVES[variantKey] || VARIANT_CURVES.default;
  const swatches = [];
  for (const pair of FAMILY_PAIRS) {
    for (const [def, curve] of [[pair.light, curves.light], [pair.dark, curves.dark]]) {
      for (const hexVal of buildRow(def.hue, curve, !!def.neutral, curves.neutralSatCap)) {
        swatches.push({ hex: hexVal, family: def.name });
      }
    }
  }
  return swatches;
}

function useToast() {
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);
  const flash = useCallback((msg) => {
    setToast(msg);
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => setToast(null), 1900);
  }, []);
  return [toast, flash];
}

function Toast({ message }) {
  if (!message) return null;
  return (
    <div style={{ position: "fixed", bottom: 32, left: "50%", transform: "translateX(-50%)", zIndex: 50, background: INK, color: "#F4F4F2", borderRadius: 4, padding: "12px 20px", display: "flex", alignItems: "center", gap: 10, boxShadow: "0 8px 24px rgba(0,0,0,0.28)" }}>
      <span style={{ width: 7, height: 7, borderRadius: "50%", background: YELLOW, display: "inline-block", flex: "none" }} />
      <span style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.06em", color: "#F4F4F2" }}>{message}</span>
    </div>
  );
}

// A slider can't produce an invalid value, so RGB/CMYK entry never needs an error
// state — the live swatch + numeric readout are the confirmation.
function ChannelSlider({ label, value, max, suffix, onChange }) {
  return (
    <div style={{ marginBottom: 10 }}>
      <div style={{ display: "flex", justifyContent: "space-between", fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, marginBottom: 5 }}>
        <span>{label}</span>
        <span style={{ color: INK }}>{value}{suffix || ""}</span>
      </div>
      <input
        type="range" min={0} max={max} value={value}
        onChange={(e) => onChange(Number(e.target.value))}
        style={{ width: "100%", accentColor: YELLOW, cursor: "pointer" }}
      />
    </div>
  );
}

function StepFooter({ stepNumber, totalSteps, completed, onToggleComplete, onBack, onNext, nextLabel }) {
  return (
    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderTop: `1px solid ${HAIRLINE}`, marginTop: 32, paddingTop: 20 }}>
      <span onClick={onBack} style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase", color: onBack ? "#6B6B70" : "#c2bfb6", cursor: onBack ? "pointer" : "default" }}>← Back</span>
      <span style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.16em", textTransform: "uppercase", color: MUTED }}>
        Step {String(stepNumber).padStart(2, "0")} / {String(totalSteps).padStart(2, "0")}
      </span>
      <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
        <span onClick={onToggleComplete} style={{ border: `1px solid ${completed ? "#16744B" : INK}`, color: completed ? "#16744B" : INK, borderRadius: 2, padding: "11px 18px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: completed ? 700 : 400, cursor: "pointer" }}>
          {completed ? "✓ Completed" : "Mark complete"}
        </span>
        <span onClick={onNext} style={{ background: YELLOW, color: INK, borderRadius: 2, padding: "12px 22px", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", fontWeight: 700, cursor: "pointer" }}>
          {nextLabel || "Continue →"}
        </span>
      </div>
    </div>
  );
}

// Pure preview — the base 80 swatches only. Never mixes in the client's own colors,
// so a card never implies "these are part of Default/Pastel."
function PaletteCard({ variantKey, selected, onSelect }) {
  const swatches = useMemo(() => buildPalette(variantKey), [variantKey]);
  const label = VARIANT_CURVES[variantKey].label;
  return (
    <div style={{ flex: 1, minWidth: 240, border: `${selected ? 2 : 1}px solid ${selected ? INK : HAIRLINE}`, borderRadius: 3, padding: selected ? 15 : 16, background: "#fff" }}>
      <div onClick={onSelect} title={selected ? "Click to unselect this palette" : "Click to select this palette"} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", cursor: "pointer", marginBottom: 14 }}>
        <span style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ width: 16, height: 16, borderRadius: "50%", border: `2px solid ${selected ? INK : "#c2bfb6"}`, display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}>
            {selected && <span style={{ width: 8, height: 8, borderRadius: "50%", background: INK }} />}
          </span>
          <span style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 16, color: INK }}>{label}</span>
        </span>
        {selected && (
          <span style={{ fontFamily: FONT_MONO, fontSize: 9, letterSpacing: "0.08em", textTransform: "uppercase", color: "#16744B", background: "#E3F1EA", borderRadius: 2, padding: "3px 8px" }}>Selected</span>
        )}
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(5,1fr)", gap: 3 }}>
        {swatches.map((sw, i) => (
          <div
            key={i}
            title={`${sw.family} · ${sw.hex}`}
            style={{ aspectRatio: "2.4 / 1", borderRadius: 2, background: sw.hex, boxShadow: "inset 0 0 0 1px rgba(0,0,0,0.08)" }}
          />
        ))}
      </div>
    </div>
  );
}

export function AssetManagerStep3ColorManagement({
  initialVariant = "default",
  initialExtras = [], // array of hex strings the client has added on top of the base palette
  onChange,
  completed = false,
  onToggleComplete,
  onBack,
  onNext,
  stepNumber = 3,
  totalSteps = 8,
}) {
  const [variant, setVariant] = useState(initialVariant);
  const [extras, setExtras] = useState(() => initialExtras.map((h) => h.toUpperCase()));
  const [extracted, setExtracted] = useState([]);
  const [convertFmt, setConvertFmt] = useState("hex");
  const [hexInput, setHexInput] = useState("#C7402F");
  const [rgb, setRgb] = useState({ r: 199, g: 64, b: 47 });
  const [cmyk, setCmyk] = useState({ c: 0, m: 75, y: 82, k: 22 });
  const [pantoneInput, setPantoneInput] = useState("");
  const [toast, flash] = useToast();

  const extrasSet = useMemo(() => new Set(extras), [extras]);

  // variant can be null — the client unchecked both palettes and is building a
  // wall palette entirely from their own colors, no starter set included.
  const emit = (nextVariant, nextExtras) => {
    const base = nextVariant ? buildPalette(nextVariant).map((s) => s.hex) : [];
    const palette = Array.from(new Set([...nextExtras, ...base]));
    onChange?.({ variant: nextVariant, extras: nextExtras, palette });
  };

  // Clicking the already-selected palette unchecks it — both cards can be off at once.
  const selectVariant = (key) => {
    const next = variant === key ? null : key;
    setVariant(next);
    emit(next, extras);
  };

  const useOnlyMyColors = () => {
    setVariant(null);
    emit(null, extras);
  };

  const addExtra = (hexVal) => {
    const hexUp = hexVal.toUpperCase();
    if (extrasSet.has(hexUp)) { flash(`${hexUp} is already added`); return; }
    setExtras((prev) => {
      const next = [...prev, hexUp];
      emit(variant, next);
      return next;
    });
    flash(`Added ${hexUp}`);
  };

  const removeExtra = (hexVal) => {
    setExtras((prev) => {
      const next = prev.filter((h) => h !== hexVal);
      emit(variant, next);
      return next;
    });
  };

  // RGB/CMYK come from sliders, so they're always valid — only HEX (free text) and
  // Pantone (a name lookup) can fail to resolve.
  const convertHex =
    convertFmt === "hex" ? convertToHex("hex", hexInput) :
    convertFmt === "rgb" ? rgbToHex(rgb.r, rgb.g, rgb.b) :
    convertFmt === "cmyk" ? cmykToHex(cmyk.c, cmyk.m, cmyk.y, cmyk.k) :
    convertToHex("pantone", pantoneInput);

  const addConverted = () => {
    if (!convertHex) { flash(`Enter a valid ${convertFmt.toUpperCase()} value`); return; }
    addExtra(convertHex);
  };

  // Picking a native color also drives the RGB sliders, so switching to the RGB tab
  // afterward shows exactly what you picked instead of resetting.
  const onPickNativeColor = (hexVal) => {
    setHexInput(hexVal.toUpperCase());
    const asRgb = hexToRgb(hexVal);
    if (asRgb) setRgb(asRgb);
  };

  const onImage = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const img = new Image();
    img.onload = () => {
      const N = 48;
      const cv = document.createElement("canvas");
      cv.width = N; cv.height = N;
      const ctx = cv.getContext("2d");
      ctx.drawImage(img, 0, 0, N, N);
      let data;
      try { data = ctx.getImageData(0, 0, N, N).data; }
      catch (err) { flash("Couldn't read that image"); return; }
      const buckets = {};
      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3];
        if (a < 125) continue;
        const r = data[i], g = data[i + 1], b = data[i + 2];
        const key = (r >> 5) + "," + (g >> 5) + "," + (b >> 5);
        if (!buckets[key]) buckets[key] = { r: 0, g: 0, b: 0, n: 0 };
        buckets[key].r += r; buckets[key].g += g; buckets[key].b += b; buckets[key].n++;
      }
      const top = Object.values(buckets).sort((a, b) => b.n - a.n).slice(0, 8)
        .map((o) => ("#" + hx(o.r / o.n) + hx(o.g / o.n) + hx(o.b / o.n)).toUpperCase());
      setExtracted(top);
      flash(`${top.length} colors extracted from your image`);
    };
    img.onerror = () => flash("Couldn't load that image");
    img.src = URL.createObjectURL(file);
  };

  return (
    <div style={{ fontFamily: FONT_BODY, maxWidth: 900 }}>
      <div style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.18em", textTransform: "uppercase", color: "#B07A00", marginBottom: 8 }}>Step 03</div>
      <h2 style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 30, letterSpacing: "-0.01em", color: INK, margin: "0 0 6px" }}>Color management</h2>
      <p style={{ fontSize: 14, lineHeight: 1.5, color: "#6B6B70", margin: "0 0 22px", maxWidth: "64ch" }}>
        Choose the palette you want on the wall — Default or Pastel, whichever fits — or skip both and build entirely from your own colors. Add colors by entering them or pulling key colors from your logo; they stay in "Your colors," kept separate from either starter palette.
      </p>

      <div style={{ display: "flex", gap: 36, flexWrap: "wrap", marginBottom: 28 }}>
        <div style={{ flex: 1, minWidth: 280 }}>
          <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: MUTED, marginBottom: 12 }}>Enter a color · convert to HEX</div>
          <div style={{ display: "inline-flex", border: `1px solid ${HAIRLINE}`, borderRadius: 2, overflow: "hidden", marginBottom: 14 }}>
            {["hex", "rgb", "cmyk", "pantone"].map((f, i) => {
              const active = convertFmt === f;
              return (
                <span key={f} onClick={() => setConvertFmt(f)} style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.04em", color: active ? INK : "#6B6B70", background: active ? YELLOW : "transparent", padding: "8px 13px", fontWeight: active ? 700 : 400, cursor: "pointer", borderLeft: i > 0 ? `1px solid ${HAIRLINE}` : "none" }}>
                  {f.toUpperCase()}
                </span>
              );
            })}
          </div>

          <div style={{ display: "flex", gap: 16, alignItems: "flex-start", marginBottom: 12 }}>
            <div style={{ flex: 1, minWidth: 0 }}>
              {convertFmt === "hex" && (
                <div style={{ height: 42, border: `1px solid ${HAIRLINE}`, borderRadius: 2, background: "#fff", display: "flex", alignItems: "center", padding: "0 12px" }}>
                  <input
                    value={hexInput}
                    onChange={(e) => setHexInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") addConverted(); }}
                    placeholder={CONV_PLACEHOLDER.hex}
                    style={{ border: "none", outline: "none", width: "100%", fontFamily: FONT_MONO, fontSize: 13, color: INK, background: "transparent" }}
                  />
                </div>
              )}

              {convertFmt === "rgb" && (
                <>
                  <ChannelSlider label="Red" value={rgb.r} max={255} onChange={(v) => setRgb((s) => ({ ...s, r: v }))} />
                  <ChannelSlider label="Green" value={rgb.g} max={255} onChange={(v) => setRgb((s) => ({ ...s, g: v }))} />
                  <ChannelSlider label="Blue" value={rgb.b} max={255} onChange={(v) => setRgb((s) => ({ ...s, b: v }))} />
                </>
              )}

              {convertFmt === "cmyk" && (
                <>
                  <ChannelSlider label="Cyan" value={cmyk.c} max={100} suffix="%" onChange={(v) => setCmyk((s) => ({ ...s, c: v }))} />
                  <ChannelSlider label="Magenta" value={cmyk.m} max={100} suffix="%" onChange={(v) => setCmyk((s) => ({ ...s, m: v }))} />
                  <ChannelSlider label="Yellow" value={cmyk.y} max={100} suffix="%" onChange={(v) => setCmyk((s) => ({ ...s, y: v }))} />
                  <ChannelSlider label="Key (black)" value={cmyk.k} max={100} suffix="%" onChange={(v) => setCmyk((s) => ({ ...s, k: v }))} />
                </>
              )}

              {convertFmt === "pantone" && (
                <div style={{ height: 42, border: `1px solid ${HAIRLINE}`, borderRadius: 2, background: "#fff", display: "flex", alignItems: "center", padding: "0 12px" }}>
                  <input
                    value={pantoneInput}
                    onChange={(e) => setPantoneInput(e.target.value)}
                    onKeyDown={(e) => { if (e.key === "Enter") addConverted(); }}
                    placeholder={CONV_PLACEHOLDER.pantone}
                    style={{ border: "none", outline: "none", width: "100%", fontFamily: FONT_MONO, fontSize: 13, color: INK, background: "transparent" }}
                  />
                </div>
              )}
            </div>

            {/* Always the larger preview square, always on the right, same size and
                position regardless of which format is active. */}
            <div style={{ flex: "none", display: "flex", flexDirection: "column", alignItems: "center", gap: 6 }}>
              {convertFmt === "hex" ? (
                <input
                  type="color"
                  value={convertHex || "#000000"}
                  onChange={(e) => onPickNativeColor(e.target.value)}
                  title="Pick visually — always a valid color"
                  style={{ width: 72, height: 72, border: `1px solid ${HAIRLINE}`, borderRadius: 3, padding: 0, cursor: "pointer", background: "none" }}
                />
              ) : (
                <div style={{ width: 72, height: 72, borderRadius: 3, border: `1px solid ${HAIRLINE}`, background: convertHex || "#FAF9F6" }} />
              )}
              <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: convertHex ? INK : MUTED }}>{convertHex || "—"}</span>
            </div>
          </div>

          {convertFmt === "pantone" && (
            <div style={{ marginBottom: 12 }}>
              <div style={{ fontFamily: FONT_MONO, fontSize: 9, letterSpacing: "0.06em", textTransform: "uppercase", color: MUTED, marginBottom: 6 }}>Or pick a known code</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {Object.entries(PANTONE_MAP).map(([name, hexVal]) => (
                  <span
                    key={name}
                    onClick={() => setPantoneInput(name)}
                    title={hexVal}
                    style={{ display: "inline-flex", alignItems: "center", gap: 6, border: `1px solid ${pantoneInput.toUpperCase() === name ? INK : HAIRLINE}`, borderRadius: 2, padding: "4px 8px 4px 4px", cursor: "pointer" }}
                  >
                    <span style={{ width: 14, height: 14, borderRadius: 2, background: hexVal, display: "inline-block" }} />
                    <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: INK }}>{name}</span>
                  </span>
                ))}
              </div>
            </div>
          )}

          <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
            {!convertHex && (
              <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: "#C7402F" }}>
                {convertFmt === "pantone" ? "Code not recognized — try one of the chips below" : "Enter a valid HEX value, e.g. #C7402F"}
              </span>
            )}
            <span onClick={addConverted} style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.08em", textTransform: "uppercase", color: INK, border: `1px solid ${INK}`, borderRadius: 2, padding: "8px 14px", cursor: "pointer" }}>+ Add color</span>
          </div>
        </div>

        <div style={{ flex: 1, minWidth: 280 }}>
          <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: MUTED, marginBottom: 12 }}>Pull colors from an image or logo</div>
          <label style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 8, border: "2px dashed #c2bfb6", borderRadius: 3, background: "#FAF9F6", padding: 22, cursor: "pointer" }}>
            <span style={{ width: 38, height: 38, borderRadius: "50%", background: "#ECEAE4", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 17, color: MUTED }}>↑</span>
            <span style={{ fontFamily: FONT_BODY, fontSize: 13, color: "#33333A" }}>Drop or choose an image — we read the main colors</span>
            <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: MUTED }}>PNG · JPG · SVG · logo or photo</span>
            <input type="file" accept="image/*" onChange={onImage} style={{ display: "none" }} />
          </label>
          {extracted.length > 0 && (
            <>
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase", color: MUTED, margin: "16px 0 9px" }}>Extracted colors — tap to add</div>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {extracted.map((hexVal, i) => {
                  const already = extrasSet.has(hexVal);
                  return (
                    <span
                      key={i}
                      onClick={() => addExtra(hexVal)}
                      title={already ? `${hexVal} already added` : `Add ${hexVal}`}
                      style={{ display: "inline-flex", alignItems: "center", gap: 7, border: `1px solid ${already ? "#16744B" : HAIRLINE}`, borderRadius: 2, padding: "5px 9px 5px 5px", cursor: already ? "default" : "pointer", opacity: already ? 0.6 : 1 }}
                    >
                      <span style={{ width: 22, height: 22, borderRadius: 2, background: hexVal, display: "inline-block" }} />
                      <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: INK }}>{hexVal}</span>
                      {already && <span style={{ fontFamily: FONT_MONO, fontSize: 10, color: "#16744B" }}>✓</span>}
                    </span>
                  );
                })}
              </div>
            </>
          )}
        </div>
      </div>

      {/* Standalone — never nested inside a palette card, so it never implies these
          colors belong to Default or Pastel. This is the client's own set. */}
      <div style={{ marginBottom: 28 }}>
        <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: MUTED, marginBottom: 12 }}>Your colors{extras.length > 0 ? ` (${extras.length})` : ""}</div>
        {extras.length === 0 ? (
          <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: MUTED, border: `1px dashed ${HAIRLINE}`, borderRadius: 2, padding: "12px 14px" }}>
            None added yet — enter a color or pull one from an image above.
          </div>
        ) : (
          <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
            {extras.map((hexVal) => (
              <span
                key={hexVal}
                onClick={() => removeExtra(hexVal)}
                title={`Remove ${hexVal}`}
                style={{ display: "inline-flex", alignItems: "center", gap: 7, border: `1px solid ${INK}`, borderRadius: 2, padding: "5px 9px 5px 5px", cursor: "pointer" }}
              >
                <span style={{ width: 22, height: 22, borderRadius: 2, background: hexVal, display: "inline-block" }} />
                <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: INK }}>{hexVal}</span>
                <span style={{ fontFamily: FONT_MONO, fontSize: 12, color: MUTED }}>×</span>
              </span>
            ))}
          </div>
        )}
      </div>

      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10, marginBottom: 12 }}>
        <span style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: MUTED }}>Choose one palette for the wall — optional</span>
        {variant && <span onClick={useOnlyMyColors} style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.04em", color: MUTED, cursor: "pointer" }}>Use only my colors, no starter palette</span>}
      </div>
      {!variant && extras.length === 0 && (
        <div style={{ fontFamily: FONT_MONO, fontSize: 12, color: "#B07A00", background: "#FEF1CE", border: "1px solid #f0dfa1", borderRadius: 2, padding: "10px 14px", marginBottom: 16 }}>
          No palette chosen and no colors added yet — pick a palette below, or add at least one color above.
        </div>
      )}
      <div style={{ display: "flex", gap: 20, flexWrap: "wrap", marginBottom: 8 }}>
        {VARIANT_KEYS.map((key) => (
          <PaletteCard
            key={key}
            variantKey={key}
            selected={variant === key}
            onSelect={() => selectVariant(key)}
          />
        ))}
      </div>

      <StepFooter stepNumber={stepNumber} totalSteps={totalSteps} completed={completed} onToggleComplete={onToggleComplete} onBack={onBack} onNext={onNext} />
      <Toast message={toast} />
    </div>
  );
}

export default AssetManagerStep3ColorManagement;

</script>

<script>
(function () {
  try {
  const e = React.createElement;

  function compile(scriptId, exportName) {
    const raw = document.getElementById(scriptId).textContent;
    const cleaned = raw
      .replace(/^import[^\n]*\n/m, "")
      .replace(new RegExp("^export function " + exportName, "m"), "function " + exportName)
      .replace(new RegExp("^export default " + exportName + ";?\\s*$", "m"), "");
    const compiled = Babel.transform(cleaned, { presets: [["react", { runtime: "classic" }]] }).code;
    const wrapped = new Function(
      "React", "useState", "useRef", "useCallback", "useEffect", "useMemo",
      compiled + "\nreturn " + exportName + ";"
    );
    return wrapped(React, React.useState, React.useRef, React.useCallback, React.useEffect, React.useMemo);
  }

  const AssetManagerStep3ColorManagement = compile("src-step3", "AssetManagerStep3ColorManagement");

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(
    e("div", { className: "frame" },
      e(AssetManagerStep3ColorManagement, {
        onChange: (data) => console.log("onChange", data),
        onBack: () => console.log("back"),
        onNext: () => console.log("next"),
        onToggleComplete: () => console.log("toggle complete"),
      })
    )
  );
  } catch (err) {
    document.getElementById("root").textContent = "Loader failed: " + (err && err.message);
    console.error("LOADER ERROR", err);
  }
})();
</script>
