<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SetupDiagram — live demo</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html, body { margin: 0; background: #f0eee8; }
  #root { padding: 40px 20px; display: flex; flex-direction: column; gap: 40px; align-items: center; }
  h2 { font-family: sans-serif; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: #6B6B70; margin: 0 0 12px; }
  pre { font-family: monospace; font-size: 11px; color: #6B6B70; }
</style>
</head>
<body>
<div id="root">Loading…</div>

<!--
  SetupDiagram.jsx source, inlined so this demo is a single self-contained file that
  works when opened directly (double-click / file://), with no fetch() and no build step.
  Keep this in sync with SetupDiagram.jsx — it's a straight copy.
-->
<script type="text/plain" id="setup-diagram-source">
import React, { useState, useRef, useCallback, useEffect, useMemo } from "react";

/**
 * Graffiti+ Setup Diagram.
 * Wall elevation + VR-tracking sensor map: set wall/screen size, place lighthouses,
 * the home tracker, transmitters, and the computer/printer, then drag any sensor to
 * fine-tune it. Cable runs to the hub are computed automatically and flagged red past 5 m.
 *
 * Fully self-contained (no external deps beyond React) so it can be dropped into any
 * host app. Persistence is optional: pass `onChange` to let the host own storage, or
 * leave `persist` on to mirror config to localStorage under `gp-setup-<eventId>`.
 */

const M2F = 3.28084;
const FT_TO_M = 0.3048;
const CFG_KEYS = [
  "unit", "widthM", "heightM", "floorM", "wStr", "hStr", "fStr",
  "pitchMm", "pitchStr",
  "lighthouses", "homeTracker", "transmitters", "txPos", "lhPos", "pcLoc", "prLoc", "overrides",
];

const DEFAULT_CONFIG = {
  unit: "m",
  widthM: 6.0, heightM: 3.4, floorM: 1.0,
  wStr: "6", hStr: "3.4", fStr: "1",
  pitchMm: 2.6, pitchStr: "2.6",
  lighthouses: 2, homeTracker: true, transmitters: 4, txPos: "bottom",
  lhPos: "floor", pcLoc: "left", prLoc: "right",
  overrides: {},
};

const FONT_MONO = "var(--gp-font-mono, 'Space Mono', 'Courier New', monospace)";
const FONT_BODY = "var(--gp-font-body, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const FONT_DISPLAY = "var(--gp-font-display, 'Manrope', 'Helvetica Neue', Arial, sans-serif)";
const YELLOW = "#FEBD17";
const INK = "#0A0B0C";

function fmtNum(m, unit) {
  const v = unit === "m" ? m : m * M2F;
  const dec = unit === "m" ? 2 : 1;
  return (+v.toFixed(dec)).toString();
}

function formatMeters(m, unit) {
  return unit === "m" ? `${m.toFixed(2)} m` : `${(m * M2F).toFixed(1)} ft`;
}

function slugToTitle(slug) {
  return slug.replace(/[-_]/g, " ").replace(/\b\w/g, (c) => c.toUpperCase());
}

// ---- Pure geometry: wall/screen layout, sensor placement, cable routing ----
function computeGeometry(st) {
  const W = 760, floorY = 470;
  // Whenever the wall is height-constrained, its top edge lands exactly at topPad —
  // there's no natural gap for whatever sits just above it. The home tracker is
  // *always* there (top-center, independent of any other setting), so reserve room
  // for it — more if lighthouses/transmitters are also top-mounted.
  const topSensorReserve = Math.max(
    st.homeTracker ? 24 : 0,
    st.lhPos === "top" ? 30 : 0,
    st.txPos === "top" ? 34 : 0,
  );
  const topPad = 44 + topSensorReserve;
  // Equipment cabinets sit outside the wall bounds (54px offset + half cabinet width,
  // wider still with two devices stacked on one side). Reserve enough margin on
  // whichever side holds equipment so cabinets never scale past the canvas edge —
  // otherwise a wide wall pushes them off the 0–760 viewBox and they get clipped.
  const cabReach = (loc) => {
    const n = (st.pcLoc === loc ? 1 : 0) + (st.prLoc === loc ? 1 : 0);
    if (n === 0) return 0;
    const w = n > 1 ? 74 : 50;
    return 54 + w / 2;
  };
  const mL = Math.max(60, cabReach("left") + 14);
  const mR = Math.max(64, cabReach("right") + 30);
  const contentW = W - mL - mR, contentH = floorY - topPad;
  const wM = st.widthM, hM = st.heightM, fM = st.floorM;
  const scale = Math.min(contentW / Math.max(wM, 0.1), contentH / Math.max(hM + fM, 0.1));
  const wallW = wM * scale, wallH = hM * scale, gap = fM * scale;
  const wallLeft = mL + (contentW - wallW) / 2;
  const wallBottom = floorY - gap;
  const wallTop = wallBottom - wallH;
  const wallRight = wallLeft + wallW;
  const cx = wallLeft + wallW / 2;
  // Hug the width-dimension line to the wall's actual top edge (which floats well
  // below topPad whenever the wall is width- rather than height-constrained) —
  // just far enough above the top-mounted sensor labels to clear them.
  const widthDimY = Math.max(16, wallTop - topSensorReserve - 16);
  const cols = Math.max(3, Math.min(16, Math.round(wM / 0.6)));
  const rows = Math.max(2, Math.min(10, Math.round(hM / 0.6)));

  const gridV = [];
  for (let c = 1; c < cols; c++) {
    gridV.push({ x: +(wallLeft + (wallW * c) / cols).toFixed(1), y1: +wallTop.toFixed(1), y2: +wallBottom.toFixed(1) });
  }
  const gridH = [];
  for (let r = 1; r < rows; r++) {
    gridH.push({ y: +(wallTop + (wallH * r) / rows).toFixed(1), x1: +wallLeft.toFixed(1), x2: +wallRight.toFixed(1) });
  }

  const auto = {};
  const nL = st.lighthouses;
  const lhY = st.lhPos === "top" ? wallTop : floorY;
  for (let i = 0; i < nL; i++) {
    const x = nL === 1 ? cx : wallLeft + (wallW * i) / (nL - 1);
    auto["L" + i] = { x, y: lhY };
  }
  if (st.homeTracker) auto["H0"] = { x: cx, y: wallTop };

  const nT = st.transmitters;
  const ftPx = FT_TO_M * scale;
  const rowW = (nT - 1) * ftPx;
  const ty = st.txPos === "top" ? Math.max(wallTop - 22, 16) : Math.min(wallBottom + 22, floorY - 10);
  const sx = cx - rowW / 2;
  for (let i = 0; i < nT; i++) auto["T" + i] = { x: sx + i * ftPx, y: ty };

  // ---- Equipment cabinets (computer + printer, raised off the floor) ----
  // "Left"/"right" cabinets sit on the floor outside the wall. "Behind" equipment is
  // inset into the screen's bottom-right corner — the one zone that never collides
  // with centered transmitters/tracker or edge-mounted lighthouses, regardless of
  // how the other sensors are configured.
  const byLoc = {};
  const addDev = (k, loc) => { (byLoc[loc] = byLoc[loc] || []).push(k); };
  addDev("PC", st.pcLoc);
  addDev("PR", st.prLoc);
  const locCabX = (loc) => (loc === "left" ? wallLeft - 54 : loc === "right" ? wallRight + 54 : Math.max(wallLeft + 40, wallRight - 58));
  const cabH = 40, cabTop = floorY - cabH;
  const behindCabTop = Math.max(wallTop + 10, wallBottom - 52);
  const stations = [];
  Object.keys(byLoc).forEach((loc) => {
    const devs = byLoc[loc];
    const behind = loc === "behind";
    const w = devs.length > 1 ? 74 : 50;
    const cabCx = locCabX(loc);
    const thisCabTop = behind ? behindCabTop : cabTop;
    const dxOf = (idx) => (devs.length > 1 ? cabCx + (idx === 0 ? -18 : 18) : cabCx);
    stations.push({
      cabX: +(cabCx - w / 2).toFixed(1), cabY: +thisCabTop.toFixed(1), cabW: w, cabH,
      drawerY: +(thisCabTop + 13).toFixed(1), drawerX1: +(cabCx - w / 2 + 6).toFixed(1), drawerX2: +(cabCx + w / 2 - 6).toFixed(1),
      behind,
      devs: devs.map((k, idx) => ({ key: k, isPC: k === "PC", isPrinter: k === "PR", x: +dxOf(idx).toFixed(1), y: +(thisCabTop - 12).toFixed(1) })),
    });
  });

  // ---- Hub sits next to the computer ----
  const pcBehind = st.pcLoc === "behind";
  const hubCabX = locCabX(st.pcLoc);
  auto["HUB0"] = pcBehind
    ? { x: hubCabX + 30, y: behindCabTop + 10 }
    : { x: hubCabX + (st.pcLoc === "left" ? 22 : -22), y: floorY - cabH - 6 };

  const pos = (id) => st.overrides[id] || auto[id];
  const hub = pos("HUB0");

  // ---- Cables (data) + length check ----
  const THRESH = 5; // metres
  const pxM = (px) => px / scale;
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
  // Route a sensor's cable to the hub. Behind computer → straight. Otherwise route
  // AROUND the screen: drop to the floor, run along the floor, rise to the hub side.
  const routeToHub = (p) => {
    if (pcBehind) return { pts: [p, hub], len: pxM(dist(p, hub)) };
    const aisleY = floorY + 6;
    const onLeft = hub.x <= cx;
    const edgeX = onLeft ? wallLeft - 10 : wallRight + 10;
    if (p.y >= wallBottom - 2) {
      const len = pxM(Math.abs(p.y - aisleY) + Math.abs(p.x - hub.x) + Math.abs(aisleY - hub.y));
      return { pts: [p, { x: p.x, y: aisleY }, { x: hub.x, y: aisleY }, hub], len };
    }
    const liftY = Math.min(p.y, wallTop - 10);
    const pts = [p, { x: p.x, y: liftY }, { x: edgeX, y: liftY }, { x: edgeX, y: aisleY }, { x: hub.x, y: aisleY }, hub];
    const len = pxM(Math.abs(p.y - liftY) + Math.abs(p.x - edgeX) + Math.abs(liftY - aisleY) + Math.abs(edgeX - hub.x) + Math.abs(aisleY - hub.y));
    return { pts, len };
  };

  const cables = [];
  const runs = [];
  const pushCable = (label, pts, len) => {
    const over = len > THRESH;
    cables.push({
      points: pts.map((p) => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" "),
      stroke: over ? "#C7402F" : "#9A9A96",
      width: 1.6,
      // Behind-screen runs are conceptual (they pass through the mounting structure,
      // not across the visible face) — dash them so they read as concealed, not clutter.
      dashed: pcBehind,
    });
    runs.push({ label, len, over });
  };
  for (let i = 0; i < nT; i++) { const t = pos("T" + i); const r = routeToHub(t); pushCable(`T${i + 1} → Hub`, r.pts, r.len); }
  if (st.homeTracker) { const h = pos("H0"); const r = routeToHub(h); pushCable("Home → Hub", r.pts, r.len); }

  const cableRuns = runs.map((r) => ({ label: r.label, len: formatMeters(r.len, st.unit), over: r.over, ok: !r.over }));
  const overCount = runs.filter((r) => r.over).length;
  const anyOver = overCount > 0;
  const warnText = `${overCount} ${overCount === 1 ? "run" : "runs"} over 5 m — check routing`;

  const sensors = [];
  const mk = (id, flags, p, label, op) =>
    sensors.push({ id, isLH: false, isHome: false, isTx: false, isHub: false, x: +p.x.toFixed(1), y: +p.y.toFixed(1), label, op: op == null ? 1 : op, ...flags });
  for (let i = 0; i < nL; i++) mk("L" + i, { isLH: true }, pos("L" + i), "L" + (i + 1));
  if (st.homeTracker) mk("H0", { isHome: true }, pos("H0"), "HOME");
  for (let i = 0; i < nT; i++) mk("T" + i, { isTx: true }, pos("T" + i), "T" + (i + 1));
  mk("HUB0", { isHub: true }, hub, "HUB");

  const suggested = wM < 6 ? 2 : wM < 9 ? 3 : 4;

  const pitchMm = st.pitchMm;
  const pxWidth = pitchMm > 0 ? Math.round((wM / pitchMm) * 1000) : null;
  const pxHeight = pitchMm > 0 ? Math.round((hM / pitchMm) * 1000) : null;

  return {
    wall: { x: +wallLeft.toFixed(1), y: +wallTop.toFixed(1), w: +wallW.toFixed(1), h: +wallH.toFixed(1) },
    scr: { cx: +cx.toFixed(1), cy: +((wallTop + wallBottom) / 2).toFixed(1), pxWidth, pxHeight },
    gridV, gridH, sensors, stations, cables, cableRuns,
    anyOver, warnText, overCount,
    widthDim: { x1: +wallLeft.toFixed(1), x2: +wallRight.toFixed(1), y: widthDimY, tx: +cx.toFixed(1), label: formatMeters(wM, st.unit) },
    heightDim: { x: +(wallLeft - 24).toFixed(1), y1: +wallTop.toFixed(1), y2: +wallBottom.toFixed(1), ty: +((wallTop + wallBottom) / 2).toFixed(1), label: formatMeters(hM, st.unit) },
    floorDim: { x: +(wallRight + 26).toFixed(1), y1: +wallBottom.toFixed(1), y2: +floorY.toFixed(1), ty: +((wallBottom + floorY) / 2).toFixed(1), label: formatMeters(fM, st.unit) },
    floorLine: { y: floorY, x1: 30, x2: 740, labelX: 30 },
    suggested,
  };
}

// ---- Small shared UI bits ----

function SegmentedControl({ options, value, onChange, disabled, flexEqual }) {
  return (
    <div style={{ display: flexEqual ? "flex" : "inline-flex", border: "1px solid #d8d5cd", borderRadius: 2, overflow: "hidden" }}>
      {options.map((o, i) => {
        const active = o.value === value;
        return (
          <span
            key={o.value}
            onClick={disabled ? undefined : () => onChange(o.value)}
            style={{
              flex: flexEqual ? 1 : undefined,
              textAlign: flexEqual ? "center" : undefined,
              fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.04em", textTransform: "uppercase",
              padding: flexEqual ? "7px 0" : "7px 12px",
              cursor: disabled ? "default" : "pointer",
              borderLeft: i > 0 ? "1px solid #d8d5cd" : "none",
              color: active ? INK : "#6B6B70",
              background: active ? YELLOW : "transparent",
              fontWeight: active ? 700 : 400,
            }}
          >
            {o.label}
          </span>
        );
      })}
    </div>
  );
}

// SVG text label with a small background halo, so it stays legible over grid lines,
// cables, or other labels it happens to cross. Monospace font makes the width a
// reliable estimate from character count, no DOM measurement needed.
function SvgLabel({ x, y, dy = 0, children, fontSize = 10, fill = "#33333A", anchor = "middle", letterSpacing, bg = "rgba(255,255,255,0.88)" }) {
  const text = String(children);
  const charW = fontSize * 0.62 + (letterSpacing || 0);
  const w = text.length * charW + 6;
  const h = fontSize + 6;
  const rectX = anchor === "middle" ? x - w / 2 : anchor === "end" ? x - w + 3 : x - 3;
  const rectY = y + dy - fontSize * 0.78 - 3;
  return (
    <>
      <rect x={rectX} y={rectY} width={w} height={h} fill={bg} />
      <text x={x} y={y} dy={dy} textAnchor={anchor} fontFamily="ui-monospace, Menlo, monospace" fontSize={fontSize} letterSpacing={letterSpacing} fill={fill}>{children}</text>
    </>
  );
}

function Stepper({ value, onDec, onInc }) {
  const btnStyle = {
    width: 30, height: 30, display: "flex", alignItems: "center", justifyContent: "center",
    fontFamily: FONT_MONO, fontSize: 15, color: INK, cursor: "pointer", background: "#fff",
  };
  return (
    <div style={{ display: "flex", alignItems: "center", border: "1px solid #d8d5cd", borderRadius: 2, overflow: "hidden" }}>
      <span onClick={onDec} style={btnStyle}>−</span>
      <span style={{ width: 34, textAlign: "center", fontFamily: FONT_MONO, fontSize: 13, color: INK, borderLeft: "1px solid #d8d5cd", borderRight: "1px solid #d8d5cd", lineHeight: "30px" }}>{value}</span>
      <span onClick={onInc} style={btnStyle}>+</span>
    </div>
  );
}

function FieldLabel({ children }) {
  return <span style={{ display: "block", fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.04em", textTransform: "uppercase", color: "#6B6B70", marginBottom: 5 }}>{children}</span>;
}

const numInputStyle = { fontFamily: FONT_MONO, fontSize: 13, color: INK, background: "#fff", border: "1px solid #d8d5cd", borderRadius: 2, padding: "8px 10px", width: "100%" };

export function SetupDiagram({
  eventId,
  eventName,
  editable = true,
  compact = false,
  showHeader = true,
  initialConfig,
  onChange,
  persist = true,
}) {
  const [config, setConfig] = useState(() => {
    const merged = { ...DEFAULT_CONFIG, ...initialConfig };
    return {
      ...merged,
      wStr: initialConfig?.wStr ?? fmtNum(merged.widthM, merged.unit),
      hStr: initialConfig?.hStr ?? fmtNum(merged.heightM, merged.unit),
      fStr: initialConfig?.fStr ?? fmtNum(merged.floorM, merged.unit),
      pitchStr: initialConfig?.pitchStr ?? String(merged.pitchMm),
    };
  });
  const [drag, setDrag] = useState(null);
  const svgRef = useRef(null);
  const storageKey = eventId ? `gp-setup-${eventId}` : null;

  // Load any previously saved config for this event on mount.
  useEffect(() => {
    if (!storageKey || !persist) return;
    try {
      const raw = localStorage.getItem(storageKey);
      if (!raw) return;
      const saved = JSON.parse(raw);
      setConfig((c) => {
        const patch = {};
        for (const k of CFG_KEYS) if (k in saved) patch[k] = saved[k];
        return { ...c, ...patch };
      });
    } catch (e) {}
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [storageKey]);

  // Read-only views pick up live edits made elsewhere (another tab/the editor).
  useEffect(() => {
    if (!storageKey || editable) return;
    const onStorage = (e) => {
      if (e.key !== storageKey || !e.newValue) return;
      try {
        const saved = JSON.parse(e.newValue);
        setConfig((c) => {
          const patch = {};
          for (const k of CFG_KEYS) if (k in saved) patch[k] = saved[k];
          return { ...c, ...patch };
        });
      } catch (err) {}
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  }, [storageKey, editable]);

  // Persist + let the host platform own its own copy of the config.
  useEffect(() => {
    if (storageKey && persist && editable) {
      try { localStorage.setItem(storageKey, JSON.stringify(config)); } catch (e) {}
    }
    if (onChange) onChange(config);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [config]);

  const onW = useCallback((e) => {
    const t = e.target.value, v = parseFloat(t);
    setConfig((s) => ({ ...s, wStr: t, ...(isFinite(v) && v > 0 ? { widthM: s.unit === "m" ? v : v / M2F } : {}) }));
  }, []);
  const onH = useCallback((e) => {
    const t = e.target.value, v = parseFloat(t);
    setConfig((s) => ({ ...s, hStr: t, ...(isFinite(v) && v > 0 ? { heightM: s.unit === "m" ? v : v / M2F } : {}) }));
  }, []);
  const onF = useCallback((e) => {
    const t = e.target.value, v = parseFloat(t);
    setConfig((s) => ({ ...s, fStr: t, ...(isFinite(v) && v >= 0 ? { floorM: s.unit === "m" ? v : v / M2F } : {}) }));
  }, []);
  const onPitch = useCallback((e) => {
    const t = e.target.value, v = parseFloat(t);
    setConfig((s) => ({ ...s, pitchStr: t, ...(isFinite(v) && v > 0 ? { pitchMm: v } : {}) }));
  }, []);
  const step = (key, delta, min, max) => () =>
    setConfig((s) => ({ ...s, [key]: Math.max(min, Math.min(max, s[key] + delta)) }));
  const setUnit = (u) => () =>
    setConfig((s) => ({ ...s, unit: u, wStr: fmtNum(s.widthM, u), hStr: fmtNum(s.heightM, u), fStr: fmtNum(s.floorM, u) }));
  const setField = (key, val) => setConfig((s) => ({ ...s, [key]: val }));
  const toggleHome = () => setConfig((s) => ({ ...s, homeTracker: !s.homeTracker }));
  const autoArrange = () => setConfig((s) => ({ ...s, overrides: {} }));

  const startDrag = (id) => (e) => {
    if (!editable) return;
    e.preventDefault();
    setDrag({ id });
  };
  const onMove = useCallback((e) => {
    if (!drag || !svgRef.current) return;
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const ctm = svg.getScreenCTM();
    if (!ctm) return;
    const p = pt.matrixTransform(ctm.inverse());
    const x = Math.max(12, Math.min(748, p.x));
    const y = Math.max(14, Math.min(470, p.y));
    const id = drag.id;
    setConfig((s) => ({ ...s, overrides: { ...s.overrides, [id]: { x, y } } }));
  }, [drag]);
  const endDrag = useCallback(() => { if (drag) setDrag(null); }, [drag]);

  const exportPng = () => {
    const svg = svgRef.current;
    if (!svg) return;
    try {
      const xml = new XMLSerializer().serializeToString(svg);
      const url = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(xml)));
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        c.width = 1520; c.height = 1040;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 1520, 1040);
        ctx.drawImage(img, 0, 0, 1520, 1040);
        c.toBlob((b) => {
          const a = document.createElement("a");
          a.href = URL.createObjectURL(b);
          a.download = "grft-setup-diagram.png";
          a.click();
        });
      };
      img.src = url;
    } catch (err) {}
  };
  const printPdf = () => { try { window.print(); } catch (e) {} };

  const geo = useMemo(() => computeGeometry(config), [config]);

  const slug = eventId ? slugToTitle(eventId) : null;
  const headerTitle = eventName ? `${eventName} · wall setup` : slug ? `${slug} · wall setup` : "Wall elevation & sensor map";
  const hasEvent = !!(eventId || eventName);

  return (
    <div style={{ fontFamily: FONT_BODY, background: "#fff", border: "1px solid #E6E3DC", borderRadius: 3, overflow: "hidden", maxWidth: 1080, margin: "0 auto" }}>
      {showHeader && (
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 16, padding: "15px 18px", borderBottom: "1px solid #E6E3DC", flexWrap: "wrap" }}>
          <div>
            <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.18em", textTransform: "uppercase", color: "#B07A00", marginBottom: 5 }}>GRFT+ · Setup diagram</div>
            <div style={{ fontFamily: FONT_DISPLAY, fontWeight: 700, fontSize: 19, letterSpacing: "-0.01em", color: INK }}>{headerTitle}</div>
            {hasEvent && <div style={{ fontFamily: FONT_MONO, fontSize: 11, color: "#9A9A96", marginTop: 4 }}>Saved to this event — updates automatically.</div>}
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <SegmentedControl
              options={[{ value: "m", label: "Metric" }, { value: "ft", label: "Imperial" }]}
              value={config.unit}
              onChange={(u) => setUnit(u)()}
            />
            <span onClick={printPdf} style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: INK, border: `1px solid ${INK}`, borderRadius: 2, padding: "8px 13px", cursor: "pointer" }}>⤓ PDF</span>
            <span onClick={exportPng} style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.06em", textTransform: "uppercase", color: INK, background: YELLOW, borderRadius: 2, padding: "8px 13px", fontWeight: 700, cursor: "pointer" }}>↧ PNG</span>
          </div>
        </div>
      )}

      <div style={{ display: "flex", flexWrap: "wrap", alignItems: "stretch" }}>
        {editable && (
          <div style={{ flex: "1 1 256px", minWidth: 0, maxWidth: 330, borderRight: "1px solid #E6E3DC", padding: 18, display: "flex", flexDirection: "column", gap: 22, background: "#FAF9F6" }}>
            <div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: "#9A9A96", marginBottom: 12 }}>Wall &amp; screen</div>
              <div style={{ display: "flex", gap: 10, marginBottom: 11 }}>
                <label style={{ flex: 1 }}>
                  <FieldLabel>Width ({config.unit})</FieldLabel>
                  <input className="sd-num" type="number" step="0.1" value={config.wStr} onInput={onW} onChange={onW} style={numInputStyle} />
                </label>
                <label style={{ flex: 1 }}>
                  <FieldLabel>Height ({config.unit})</FieldLabel>
                  <input className="sd-num" type="number" step="0.1" value={config.hStr} onInput={onH} onChange={onH} style={numInputStyle} />
                </label>
              </div>
              <label style={{ display: "block", marginBottom: 11 }}>
                <FieldLabel>Height from floor ({config.unit})</FieldLabel>
                <input className="sd-num" type="number" step="0.1" value={config.fStr} onInput={onF} onChange={onF} style={numInputStyle} />
              </label>
              <label style={{ display: "block" }}>
                <FieldLabel>Pixel pitch (mm)</FieldLabel>
                <input className="sd-num" type="number" step="0.1" value={config.pitchStr} onInput={onPitch} onChange={onPitch} style={numInputStyle} />
              </label>
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: "#9A9A96", marginTop: 8 }}>
                Resolution: {geo.scr.pxWidth != null ? geo.scr.pxWidth : "—"} × {geo.scr.pxHeight != null ? geo.scr.pxHeight : "—"} px
              </div>
            </div>

            <div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: "#9A9A96", marginBottom: 12 }}>Sensors</div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <div>
                  <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: INK }}>Lighthouses</div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: "#9A9A96" }}>2–4 · suggested {geo.suggested}</div>
                </div>
                <Stepper value={config.lighthouses} onDec={step("lighthouses", -1, 2, 4)} onInc={step("lighthouses", 1, 2, 4)} />
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12 }}>
                <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: INK }}>Lighthouse mount</div>
                <SegmentedControl options={[{ value: "floor", label: "Floor" }, { value: "top", label: "Top" }]} value={config.lhPos} onChange={(v) => setField("lhPos", v)} />
              </div>
              <div onClick={toggleHome} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 12, cursor: "pointer" }}>
                <div>
                  <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: INK }}>Home tracker</div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: "#9A9A96" }}>1 · top center</div>
                </div>
                <span style={{ width: 38, height: 22, borderRadius: 11, background: config.homeTracker ? YELLOW : "#e2dfd8", position: "relative", flex: "none" }}>
                  <span style={{ position: "absolute", top: 2, [config.homeTracker ? "right" : "left"]: 2, width: 18, height: 18, borderRadius: "50%", background: config.homeTracker ? INK : "#fff", boxShadow: config.homeTracker ? "none" : "0 1px 2px rgba(0,0,0,0.2)" }} />
                </span>
              </div>
              <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 10 }}>
                <div>
                  <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: INK }}>Transmitters</div>
                  <div style={{ fontFamily: FONT_MONO, fontSize: 10, color: "#9A9A96" }}>1–8 · 1 ft apart</div>
                </div>
                <Stepper value={config.transmitters} onDec={step("transmitters", -1, 1, 8)} onInc={step("transmitters", 1, 1, 8)} />
              </div>
              <SegmentedControl options={[{ value: "top", label: "Top" }, { value: "bottom", label: "Bottom" }]} value={config.txPos} onChange={(v) => setField("txPos", v)} />
            </div>

            <div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: "#9A9A96", marginBottom: 12 }}>Equipment</div>
              <div style={{ marginBottom: 12 }}>
                <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: INK, marginBottom: 8 }}>Computer</div>
                <SegmentedControl
                  flexEqual
                  options={[{ value: "left", label: "Left" }, { value: "right", label: "Right" }, { value: "behind", label: "Behind" }]}
                  value={config.pcLoc}
                  onChange={(v) => setField("pcLoc", v)}
                />
              </div>
              <div style={{ marginBottom: 18 }}>
                <div style={{ fontFamily: FONT_BODY, fontSize: 13, color: INK, marginBottom: 8 }}>Printer</div>
                <SegmentedControl
                  flexEqual
                  options={[{ value: "left", label: "Left" }, { value: "right", label: "Right" }, { value: "behind", label: "Behind" }]}
                  value={config.prLoc}
                  onChange={(v) => setField("prLoc", v)}
                />
              </div>
              <div onClick={autoArrange} style={{ textAlign: "center", fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.08em", textTransform: "uppercase", color: INK, border: `1px solid ${INK}`, borderRadius: 2, padding: 11, cursor: "pointer" }}>↺ Auto-arrange</div>
              <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.02em", color: "#9A9A96", marginTop: 10, lineHeight: 1.5 }}>Drag any sensor on the diagram to fine-tune its position.</div>
            </div>
          </div>
        )}

        <div className="sd-diagram" style={{ flex: "1 1 360px", minWidth: 0, padding: "14px 16px", background: "#fff" }}>
          <svg ref={svgRef} viewBox="0 0 760 520" onPointerMove={onMove} onPointerUp={endDrag} onPointerLeave={endDrag} style={{ width: "100%", height: "auto", display: "block", touchAction: "none" }}>
            <rect x="0" y="0" width="760" height="520" fill="#ffffff" />

            <line x1={geo.floorLine.x1} y1={geo.floorLine.y} x2={geo.floorLine.x2} y2={geo.floorLine.y} stroke={INK} strokeWidth="2" />
            <SvgLabel x={geo.floorLine.labelX} y={geo.floorLine.y} dy={16} anchor="start" fontSize={10} letterSpacing={1.5} fill="#9A9A96">FLOOR</SvgLabel>

            <rect x={geo.wall.x} y={geo.wall.y} width={geo.wall.w} height={geo.wall.h} fill={INK} />
            {geo.gridV.map((g, i) => <line key={"gv" + i} x1={g.x} y1={g.y1} x2={g.x} y2={g.y2} stroke="rgba(255,255,255,0.16)" strokeWidth="1" />)}
            {geo.gridH.map((g, i) => <line key={"gh" + i} x1={g.x1} y1={g.y} x2={g.x2} y2={g.y} stroke="rgba(255,255,255,0.16)" strokeWidth="1" />)}
            <rect x={geo.wall.x} y={geo.wall.y} width={geo.wall.w} height={geo.wall.h} fill="none" stroke={YELLOW} strokeWidth="2" />
            <text x={geo.scr.cx} y={geo.wall.y + 16} textAnchor="middle" fontFamily="ui-monospace, Menlo, monospace" fontSize="11" letterSpacing="2" fill="rgba(255,255,255,0.55)">SCREEN · {geo.scr.pxWidth != null ? `${geo.scr.pxWidth} × ${geo.scr.pxHeight} PX` : "—"}</text>

            <line x1={geo.widthDim.x1} y1={geo.widthDim.y} x2={geo.widthDim.x2} y2={geo.widthDim.y} stroke="#9A9A96" strokeWidth="1" />
            <SvgLabel x={geo.widthDim.tx} y={geo.widthDim.y} dy={-5} fontSize={12}>{geo.widthDim.label}</SvgLabel>
            <line x1={geo.heightDim.x} y1={geo.heightDim.y1} x2={geo.heightDim.x} y2={geo.heightDim.y2} stroke="#9A9A96" strokeWidth="1" />
            <g transform={`rotate(-90 ${geo.heightDim.x} ${geo.heightDim.ty})`}>
              <SvgLabel x={geo.heightDim.x} y={geo.heightDim.ty} dy={-5} fontSize={12}>{geo.heightDim.label}</SvgLabel>
            </g>
            <line x1={geo.floorDim.x} y1={geo.floorDim.y1} x2={geo.floorDim.x} y2={geo.floorDim.y2} stroke="#9A9A96" strokeWidth="1" />
            <g transform={`rotate(-90 ${geo.floorDim.x} ${geo.floorDim.ty})`}>
              <SvgLabel x={geo.floorDim.x} y={geo.floorDim.ty} dy={14} fontSize={11} fill="#6B6B70">{`${geo.floorDim.label} from floor`}</SvgLabel>
            </g>

            {geo.cables.map((c, i) => (
              <polyline key={"c" + i} points={c.points} fill="none" stroke={c.stroke} strokeWidth={c.width} strokeLinejoin="round" strokeDasharray={c.dashed ? "5 4" : undefined} opacity={c.dashed ? 0.75 : 1} />
            ))}

            {geo.stations.map((st, i) => (
              <g key={"st" + i}>
                <rect x={st.cabX} y={st.cabY} width={st.cabW} height={st.cabH} rx="2" fill="#ffffff" stroke={INK} strokeWidth="1.5" strokeDasharray={st.behind ? "3 2" : undefined} />
                <line x1={st.drawerX1} y1={st.drawerY} x2={st.drawerX2} y2={st.drawerY} stroke={INK} strokeWidth="1" strokeDasharray={st.behind ? "3 2" : undefined} />
                {st.behind && (
                  <SvgLabel x={st.cabX + st.cabW / 2} y={st.cabY + st.cabH} dy={13} fontSize={8} letterSpacing={0.5} fill="#6B6B70">BEHIND SCREEN</SvgLabel>
                )}
                {st.devs.map((d) => (
                  <g key={d.key} transform={`translate(${d.x} ${d.y})`}>
                    {d.isPC && (
                      <>
                        <rect x="-13" y="-12" width="26" height="17" rx="1.5" fill="#ffffff" stroke={INK} strokeWidth="1.5" />
                        <line x1="0" y1="5" x2="0" y2="9" stroke={INK} strokeWidth="1.5" />
                        <line x1="-7" y1="10" x2="7" y2="10" stroke={INK} strokeWidth="1.5" strokeLinecap="round" />
                      </>
                    )}
                    {d.isPrinter && (
                      <>
                        <rect x="-7" y="-12" width="14" height="7" fill="#ffffff" stroke={INK} strokeWidth="1.3" />
                        <rect x="-12" y="-5" width="24" height="13" rx="1.5" fill="#ffffff" stroke={INK} strokeWidth="1.5" />
                        <rect x="-7" y="3" width="14" height="5" fill="#ffffff" stroke={INK} strokeWidth="1.2" />
                        <circle cx="8" cy="-1" r="1.3" fill={INK} />
                      </>
                    )}
                  </g>
                ))}
              </g>
            ))}

            {geo.sensors.map((s) => (
              <g key={s.id} transform={`translate(${s.x} ${s.y})`} onPointerDown={startDrag(s.id)} style={{ cursor: editable ? "grab" : "default", opacity: s.op }}>
                {s.isLH && (
                  <>
                    <rect x="-9" y="-20" width="18" height="20" rx="2" fill="#2A6FDB" />
                    <circle cx="0" cy="-14" r="3.5" fill={YELLOW} />
                    <polygon points="13,-16 8,-9 11,-9 9,-3 15,-11 12,-11" fill="#B07A00" />
                    <SvgLabel x={0} y={-25} fontSize={10} fill="#2A6FDB">{s.label}</SvgLabel>
                  </>
                )}
                {s.isHome && (
                  <>
                    <circle cx="0" cy="0" r="10" fill="#C7402F" />
                    <circle cx="0" cy="0" r="3.2" fill="#ffffff" />
                    <SvgLabel x={0} y={-16} fontSize={10} fill="#C7402F">{s.label}</SvgLabel>
                  </>
                )}
                {s.isTx && (
                  <>
                    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#1F8A5B" />
                    <SvgLabel x={0} y={-11} fontSize={9} fill="#1F8A5B">{s.label}</SvgLabel>
                  </>
                )}
                {s.isHub && (
                  <>
                    <rect x="-14" y="-9" width="28" height="18" rx="2" fill={INK} />
                    <line x1="-8" y1="6" x2="-8" y2="9" stroke={YELLOW} strokeWidth="1.4" />
                    <line x1="-2" y1="6" x2="-2" y2="9" stroke={YELLOW} strokeWidth="1.4" />
                    <line x1="4" y1="6" x2="4" y2="9" stroke={YELLOW} strokeWidth="1.4" />
                    <text x="0" y="3" textAnchor="middle" fontFamily="ui-monospace, Menlo, monospace" fontSize="8" letterSpacing="1" fill="#ffffff">HUB</text>
                  </>
                )}
              </g>
            ))}
          </svg>

          {geo.anyOver && (
            <div style={{ display: "flex", alignItems: "center", gap: 9, marginTop: 12, padding: "10px 13px", background: "#FBEAE7", border: "1px solid #E3B4AC", borderRadius: 3 }}>
              <span style={{ color: "#C7402F", fontSize: 14 }}>⚠</span>
              <span style={{ fontFamily: FONT_MONO, fontSize: 11, letterSpacing: "0.02em", color: "#C7402F" }}>{geo.warnText}</span>
            </div>
          )}

          {!compact && (
            <>
              <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(150px,1fr))", gap: "14px 20px", padding: "14px 4px 4px" }}>
                <LegendItem color="#2A6FDB" shape="square" label="Lighthouse · power only" />
                <LegendItem color="#C7402F" shape="circle" label="Home tracker" />
                <LegendItem color="#1F8A5B" shape="square" label="Transmitter · 1 ft apart" />
                <LegendItem color={INK} shape="square" label="Hub" />
                <LegendItem color="#fff" shape="square" outline label="Computer / printer · on cabinet" />
                <span style={{ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: FONT_MONO, fontSize: 11, color: "#33333A" }}>
                  <span style={{ width: 14, height: 2, background: "#9A9A96", display: "inline-block" }} />
                  Data cable · red if &gt; 5 m
                </span>
                <span style={{ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: FONT_MONO, fontSize: 11, color: "#33333A" }}>
                  <span style={{ width: 14, height: 0, borderTop: "2px dashed #9A9A96", display: "inline-block" }} />
                  Dashed · routed behind screen
                </span>
              </div>
              <div style={{ marginTop: 14, borderTop: "1px solid #E6E3DC", paddingTop: 14 }}>
                <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.16em", textTransform: "uppercase", color: "#9A9A96", marginBottom: 10 }}>Cable runs · to hub</div>
                <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(190px,1fr))", gap: "6px 18px" }}>
                  {geo.cableRuns.map((r, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, padding: "5px 0", borderBottom: "1px solid #F0EEE8" }}>
                      <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: "#33333A" }}>{r.label}</span>
                      <span style={{ fontFamily: FONT_MONO, fontSize: 11, color: r.over ? "#C7402F" : INK, fontWeight: r.over ? 700 : 400 }}>{r.len}{r.over ? " ⚠" : ""}</span>
                    </div>
                  ))}
                </div>
                <div style={{ fontFamily: FONT_MONO, fontSize: 10, letterSpacing: "0.02em", color: "#9A9A96", marginTop: 10, lineHeight: 1.5 }}>
                  The hub sits next to the computer. Transmitters and the home tracker run to it; when the computer is to the side, the cables route around the screen (down to the floor, across, and up) rather than across the screen face. If the computer is behind the screen, the hub is mounted there too (dashed lines) — those runs pass through the mounting structure, not across the visible face. Lighthouses need power only — no data run.
                </div>
              </div>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function LegendItem({ color, shape, label, outline }) {
  return (
    <span style={{ display: "inline-flex", alignItems: "center", gap: 8, fontFamily: FONT_MONO, fontSize: 11, color: "#33333A" }}>
      <span style={{ width: 12, height: 12, borderRadius: shape === "circle" ? "50%" : 2, background: color, display: "inline-block", border: outline ? `1.5px solid ${INK}` : "none" }} />
      {label}
    </span>
  );
}

export default SetupDiagram;

</script>

<script>
(function () {
  const { useState } = React;
  const e = React.createElement;

  const src = document.getElementById("setup-diagram-source").textContent;
  const cleaned = src
    .replace(/^import[^\n]*\n/m, "")
    .replace(/^export function SetupDiagram/m, "function SetupDiagram")
    .replace(/^export default SetupDiagram;\s*$/m, "");
  const compiled = Babel.transform(cleaned, { presets: [["react", { runtime: "classic" }]] }).code;

  const wrapped = new Function(
    "React", "useState", "useRef", "useCallback", "useEffect", "useMemo",
    compiled + "\nreturn SetupDiagram;"
  );
  const SetupDiagram = wrapped(React, React.useState, React.useRef, React.useCallback, React.useEffect, React.useMemo);

  function Demo() {
    const [savedLog, setSavedLog] = useState([]);
    return e("div", { style: { width: "100%", maxWidth: 1080, display: "flex", flexDirection: "column", gap: 40 } },
      e("div", null,
        e("h2", null, "Editable — with onChange logging"),
        e(SetupDiagram, {
          eventId: "nike-air-max-hk",
          eventName: "Nike Air Max — Hong Kong",
          onChange: (cfg) => setSavedLog((l) => [...l.slice(-2), `w=${cfg.widthM.toFixed(2)}m h=${cfg.heightM.toFixed(2)}m pitch=${cfg.pitchMm}mm`]),
        }),
        e("pre", null, savedLog.join("\n"))
      ),
      e("div", null,
        e("h2", null, "Read-only / compact — client recap"),
        e(SetupDiagram, { eventId: "nike-air-max-hk", editable: false, compact: true })
      )
    );
  }

  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(e(Demo));
})();
</script>
</body>
</html>
