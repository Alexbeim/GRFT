<!-- @dsCard group="Components" viewport="700x250" subtitle="Hairline content blocks — audience cards + numbered steps" name="Audience card + Numbered step" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{background:#FFFFFF;padding:30px 40px;color:#0A0B0C;display:grid;grid-template-columns:1fr 1fr;gap:40px}
  .block{display:flex;flex-direction:column;gap:8px;padding-top:16px;border-top:1px solid var(--gp-hairline-light)}
  .lbl{font-family:var(--gp-font-display);font-weight:700;font-size:22px;letter-spacing:-0.01em}
  .val{font-family:var(--gp-font-body);font-size:15px;line-height:1.5;color:#6B6B70}
  .num{font-family:var(--gp-font-mono);font-size:13px;letter-spacing:.18em;color:#B07A00}
  .title{font-family:var(--gp-font-display);font-weight:700;font-size:23px;line-height:1.04;letter-spacing:-0.01em;margin:12px 0 10px}
  .body{font-family:var(--gp-font-body);font-size:15px;line-height:1.5;color:#33333A}
</style></head>
<body>
  <div class="block">
    <span class="lbl">Brand activations</span>
    <span class="val">Custom-built for your identity and crowd — the crowd paints, the brand gets the credit.</span>
  </div>
  <div>
    <span class="num">01</span>
    <div class="title">We arrive and set up</div>
    <span class="body">Full setup and takedown — software, controllers, custom cans, AV gear, and crew.</span>
  </div>
</body></html>
