<!-- @dsCard group="Components" viewport="700x150" subtitle="Mono · uppercase · lead dot · yellow on light / white on dark" name="Eyebrow label" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0}
  body{margin:0;display:grid;grid-template-columns:1fr 1fr}
  .cell{min-height:150px;padding:30px;display:flex;flex-direction:column;gap:16px;justify-content:center}
  .light{background:#FFFFFF}
  .dark{background:#0A0B0C;border-left:1px solid var(--gp-hairline)}
  .eb{display:inline-flex;align-items:center;gap:.6em;font-family:var(--gp-font-mono);font-size:13px;
      letter-spacing:.2em;text-transform:uppercase}
  .dot{width:7px;height:7px;border-radius:50%;background:#FEBD17;display:inline-block}
  .light .eb{color:#B07A00}.dark .eb{color:#F4F4F2}
</style></head>
<body>
  <div class="cell light">
    <span class="eb"><span class="dot"></span>The original</span>
    <span class="eb"><span class="dot"></span>Featured</span>
  </div>
  <div class="cell dark">
    <span class="eb"><span class="dot"></span>On now</span>
    <span class="eb"><span class="dot"></span>New project</span>
  </div>
</body></html>
