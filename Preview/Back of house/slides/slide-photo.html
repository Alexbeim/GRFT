<!-- @dsCard group="Slides" viewport="1280x720" subtitle="Full-bleed photo — copy in the dark edge" name="Photo slide" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{width:1920px;height:1080px;background:#000D10;position:relative;overflow:hidden;color:#F4F4F2}
  .photo{position:absolute;inset:0;background:repeating-linear-gradient(135deg,#16181b 0 2px,#0e1013 2px 46px);opacity:.55}
  .ph-tag{position:absolute;top:40px;right:60px;font-family:var(--gp-font-mono);font-size:18px;letter-spacing:.2em;
    text-transform:uppercase;color:#3a3d42}
  .scrim{position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,11,12,0.95) 18%,rgba(10,11,12,0.4) 48%,transparent 70%)}
  .pad{position:absolute;left:96px;right:96px;bottom:80px}
  .eb{font-family:var(--gp-font-mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#FEBD17;display:block;margin-bottom:26px}
  h1{font-family:var(--gp-font-display);font-weight:700;font-size:110px;line-height:.92;letter-spacing:-0.01em;margin:0;max-width:1300px}
  .two{color:#9A9A96}
  .cap{font-family:var(--gp-font-mono);font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:#8A8A86;margin-top:34px}
</style></head>
<body>
  <div class="photo"></div>
  <div class="ph-tag">[ full-bleed event photo ]</div>
  <div class="scrim"></div>
  <div class="pad">
    <span class="eb">· On now</span>
    <h1>From load-in to last tag,<br><span class="two">we handle everything.</span></h1>
    <div class="cap">Nike Jordan · NBA All-Star 2025</div>
  </div>
</body></html>
