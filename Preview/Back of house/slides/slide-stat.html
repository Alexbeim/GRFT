<!-- @dsCard group="Slides" viewport="1280x720" subtitle="Stat slide — big figures across a hairline row" name="Stat slide" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{width:1920px;height:1080px;background:#0A0B0C;color:#F4F4F2;padding:80px 96px;box-sizing:border-box;
       display:flex;flex-direction:column}
  .eyebrow-row{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--gp-hairline);padding-bottom:26px}
  .eb{font-family:var(--gp-font-mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#FEBD17}
  .ebr{font-family:var(--gp-font-mono);font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#8A8A86}
  h1{font-family:var(--gp-font-display);font-weight:700;font-size:84px;line-height:.94;letter-spacing:-0.01em;margin:70px 0 auto}
  .two{color:#9A9A96}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--gp-hairline);border-top:1px solid var(--gp-hairline)}
  .cell{background:#0A0B0C;padding:44px 0 8px;display:flex;flex-direction:column;gap:18px}
  .fig{font-family:var(--gp-font-graffiti);font-size:118px;line-height:1;letter-spacing:0}
  .unit{font-family:var(--gp-font-mono);font-size:24px;letter-spacing:.16em;text-transform:uppercase;color:#8A8A86}
</style></head>
<body>
  <div class="eyebrow-row"><span class="eb">· The proof</span><span class="ebr">Graffiti+ / Proof</span></div>
  <h1>The numbers<br><span class="two">on the wall.</span></h1>
  <div class="row">
    <div class="cell"><span class="fig">18</span><span class="unit">Years of deployment</span></div>
    <div class="cell"><span class="fig" style="color:#FEBD17">500+</span><span class="unit">Global activations</span></div>
    <div class="cell"><span class="fig">6</span><span class="unit">Continents</span></div>
    <div class="cell"><span class="fig">2008</span><span class="unit">Vancouver, BC</span></div>
  </div>
</body></html>
