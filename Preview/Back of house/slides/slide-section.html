<!-- @dsCard group="Slides" viewport="1280x720" subtitle="Section header — big numeral, two-line title" name="Section divider" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  html,body{margin:0}
  body{width:1920px;height:1080px;background:#0A0B0C;color:#F4F4F2;padding:80px 96px;box-sizing:border-box;
       display:flex;flex-direction:column}
  .eyebrow-row{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px solid var(--gp-hairline);padding-bottom:26px}
  .eb{font-family:var(--gp-font-mono);font-size:24px;letter-spacing:.2em;text-transform:uppercase;color:#FEBD17}
  .ebr{font-family:var(--gp-font-mono);font-size:24px;letter-spacing:.18em;text-transform:uppercase;color:#8A8A86}
  .mid{margin-top:auto;margin-bottom:auto;display:flex;align-items:flex-end;gap:60px}
  .num{font-family:var(--gp-font-display);font-weight:700;font-size:420px;line-height:.8;letter-spacing:-0.01em;color:#FEBD17}
  h1{font-family:var(--gp-font-display);font-weight:700;font-size:96px;line-height:.92;letter-spacing:-0.01em;margin:0 0 40px}
  .two{color:#9A9A96}
  .lead{font-family:var(--gp-font-body);font-size:34px;line-height:1.4;color:#E0E0DC;max-width:760px}
</style></head>
<body>
  <div class="eyebrow-row"><span class="eb">· How it works</span><span class="ebr">Graffiti+ / 02</span></div>
  <div class="mid">
    <span class="num">02</span>
    <div>
      <h1>From load-in to last tag,<br><span class="two">we handle everything.</span></h1>
      <p class="lead">Our team handles full setup and takedown — software, controllers, custom cans, AV gear, and crew. Guests just pick up a can and paint.</p>
    </div>
  </div>
</body></html>
